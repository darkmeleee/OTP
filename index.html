/* js/views/login.js */
/* Вход: «Войти через ОТП Банк» открывает демо-экран единого входа с тестовыми учётными записями.
   Пароли не запрашиваются: на публичном стенде форма логина в стиле банка выглядела бы как фишинг. */
(function () {
  'use strict';
  const OM = window.OM;
  const esc = OM.esc;
  let step = 'start';
  let chosen = null;

  const ring = (c, dot) => `<svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="11.5" fill="none" stroke="${c}" stroke-width="6"/><circle cx="16" cy="16" r="3.6" fill="${dot}"/></svg>`;

  function personOf(a) {
    const saved = OM.savedState(a.id);
    return Object.assign({}, a.p, saved ? { name: saved.name, av: saved.av, prof: saved.prof } : {});
  }

  function row(a, sso) {
    const p = personOf(a);
    const tone = a.canAdmin ? 'badge-lime' : a.canManage ? 'badge-dark' : a.id === 'timur' ? 'badge-blue' : 'badge-violet';
    return `<button class="acc" data-login="${a.id}">
      ${OM.ava(p, 52, { title: false })}
      <span class="grow"><span class="acc-top"><b>${esc(p.name)}</b><span class="badge ${tone}">${esc(a.badge)}</span></span><small>${esc(sso ? a.login : a.about)}</small></span>
      ${OM.icon('arrow', 18)}
    </button>`;
  }

  function card() {
    const list = OM.accounts();
    if (step === 'checking' && chosen) {
      const a = list.find((x) => x.id === chosen);
      const p = personOf(a);
      return `<div class="sso-check">${OM.ava(p, 84, { title: false })}<div class="spinner" aria-hidden="true"></div>
        <b class="h4">Проверяем доступ…</b><span class="muted small">${esc(p.name)} · ${esc(a.login)}</span></div>`;
    }
    if (step === 'sso') {
      return `<div class="sso-head"><span class="sso-logo">${ring('#222', '#C1FF05')}<span>ОТП Банк</span></span><span class="badge badge-gray">Единый вход · демо</span></div>
        <h2 class="h3">Выберите учётную запись</h2>
        <div class="acc-list mt-20">${list.map((a) => row(a, true)).join('')}</div>
        <div class="try-note" style="background:var(--surface)">${OM.icon('shield', 18)}<span>Демо: пароль не нужен и не запрашивается</span></div>
        <button class="btn btn-ghost mt-16" data-back>${OM.icon('back', 18)} Назад</button>`;
    }
    return `<div class="auth-mark">${OM.logo()}<span class="logo-word"><b>отп</b><i>мания</i></span></div>
      <h2 class="h2 mt-24">Вход в кабинет</h2>
      <button class="btn btn-dark btn-lg btn-block sso-btn mt-24" data-sso>${ring('#C1FF05', '#C1FF05')} Войти через ОТП Банк</button>
      <div class="auth-or"><span>или тестовый аккаунт</span></div>
      <div class="acc-list">${list.map((a) => row(a, false)).join('')}</div><button class="btn btn-primary btn-block mt-16" data-act="autoDemo">${OM.icon('spark', 18)} Демо для жюри · 90 секунд</button><button class="btn btn-secondary btn-block mt-12" data-act="tour">${OM.icon('play', 18)} Показать историю · 5 минут</button>`;
  }

  function hero() {
    const crowd = [['anna', ''], ['egor', 'big'], ['timur', ''], ['kamila', 'far']].map(([id, cls]) => {
      const p = OM.DATA.people.concat(OM.DATA.team).find((x) => x.id === id);
      return `<div class="p ${cls}">${OM.avatar.svg(p.av, { view: 'full' })}</div>`;
    }).join('');
    return `<section class="auth-hero">
      <div class="tg-bg">${OM.avatar.backdrop('lime', 'coins', { w: 760, h: 960, cy: 700, r0: 170 })}</div>
      <div class="auth-top"><span class="logo">${OM.logo()}<span class="logo-word"><b>отп</b><i>мания</i></span></span></div>
      <h1 class="auth-title">Вклад замечен.<br>Награда предсказуема.</h1>
      <p class="auth-lead">Говори спасибо, собирай образ, трать коины на то, что хочется</p>
      <div class="auth-crowd">${crowd}
        <div class="auth-pet">${OM.avatar.pet('cat', 'orange')}</div>
        <span class="auth-float f1">${OM.coin('ru', 22)} +2 500 РуКоинов</span>
        <span class="auth-float f2">${OM.icon('flame', 16)} 12 недель признания</span>
        <span class="auth-float f3">${OM.icon('heart', 16)} Спасибо за инструкцию!</span>
      </div>
    </section>`;
  }

  OM.views.login = {
    title: 'Вход',
    render() {
      step = 'start';
      chosen = null;
      return `<div class="auth">${hero()}
        <section class="auth-panel"><div class="auth-card" data-card>${card()}</div>
          <p class="auth-foot">Демо-стенд концепции «ОТП Мания» для кейс-чемпионата CL Cup Moscow 2026. Не является сервисом ОТП Банка: вход только по тестовым учётным записям.</p>
        </section></div>`;
    },
    mount(el) {
      const paint = () => { el.querySelector('[data-card]').innerHTML = card(); };
      let timer = null;
      el.addEventListener('click', (e) => {
        if (e.target.closest('[data-sso]')) { step = 'sso'; paint(); return; }
        if (e.target.closest('[data-back]')) { step = 'start'; paint(); return; }
        const b = e.target.closest('[data-login]');
        if (!b || step === 'checking') return;
        chosen = b.dataset.login;
        step = 'checking';
        paint();
        timer = setTimeout(() => {
          if (OM.login(chosen)) OM.afterLogin();
        }, 900);
      });
      return () => clearTimeout(timer);
    },
  };
})();

/* Каркас: шапка в стиле otpbank.ru, вход и выход, уведомления, меню, роутер. */
(function () {

  const OM = window.OM;
  const esc = OM.esc;
  const S = () => OM.state;

  const NAV = [
    ['home', 'Главная', 'home'],
    ['office', 'Офис', 'office'],
    ['wardrobe', 'Гардероб', 'hanger'],
    ['shop', 'Магазин', 'bag'],
    ['colleagues', 'Коллеги', 'people'],
    ['vote', 'Выбор коллег', 'vote'],
    ['bonuses', 'Бонусы', 'gift'],
    ['team', 'Команда', 'chart', 'manage'],
    ['admin', 'Программа', 'shield', 'admin'],
  ];
  const TAB = ['home', 'office', 'wardrobe', 'bonuses'];
  // Классический вид: без офиса в навигации, магазин — в нижней панели
  const classic = () => !!(OM.state && OM.state.prefs && OM.state.prefs.classic);
  const tabs = () => (classic() ? ['home', 'shop', 'wardrobe', 'bonuses'] : TAB);
  // Разделы руководителя и администратора видят только их аккаунты
  const allowed = (n) => !(n[0] === 'office' && classic()) && (!n[3] || (n[3] === 'admin' ? OM.account.canAdmin : OM.account.canManage));

  const $top = document.getElementById('topbar');
  const $head = document.getElementById('header');
  const $main = document.getElementById('main');
  const $tab = document.getElementById('tabbar');

  function notifs() {
    const s = S();
    const out = [];
    s.pending.forEach((p) => {
      const from = p.from ? OM.person(p.from) : null;
      out.push({
        id: 'n-' + p.id, ic: 'gift', go: '#/bonuses', t: p.t,
        text: from ? `${esc(from.name)} ${from.g === 'f' ? 'назначила' : 'назначил'} вам ${OM.fmt(p.amount)} ${OM.curName(p.cur, p.amount)} · ${esc(p.tier)}` : `${esc(p.text)} — ${OM.fmt(p.amount)} ${OM.curName(p.cur, p.amount)} ждут в бонусах`,
      });
    });
    OM.account.notifs.forEach((n) => out.push(Object.assign({ t: Date.now() - n.ago * 864e5 }, n)));
    if (s.stage === 'voting') out.push({ id: 'n-vote', ic: 'vote', go: '#/vote', t: Date.now() - 2 * 864e5, text: '«Выбор коллег»: голосование открыто до 25-го' });
    s.orders.filter((o) => o.status === 'done' && o.done).slice(0, 2).forEach((o) => out.push({ id: 'n-' + o.id, ic: 'bag', go: '#/bonuses', t: o.done, text: `Заказ «${esc(o.name)}» выдан${o.rating ? '' : ' — оцените его'}` }));
    if (s.stage === 'nominations') out.push({ id: 'n-team-vote', ic: 'vote', go: '#/vote', t: Date.now() - 864e5, text: '«Выбор коллег»: голосование в команде до 10-го' });
    const waitNoms = OM.account.canManage ? Object.keys(OM.DATA.cats).filter((c) => { const n = OM.store.teamNominee(c); return n && n.status === 'wait'; }).length : 0;
    if (s.stage === 'review' && waitNoms) out.push({ id: 'n-nom-' + waitNoms, ic: 'vote', go: '#/team', t: Date.now() - 3 * 36e5, text: `Номинанты команды ждут подтверждения: ${waitNoms}` });;
    return out.sort((a, b) => b.t - a.t);
  }

  function paintChrome(route) {
    if (!OM.account) { $top.innerHTML = ''; $head.innerHTML = ''; $tab.innerHTML = ''; return; }
    const s = S();
    route = route || (cur && cur.name) || 'home';
    const me = OM.person('me');
    const unread = notifs().filter((n) => !s.readNotifs.includes(n.id)).length;
    $top.className = 'topbar';
    $top.innerHTML = `<div class="container">
      <div class="topbar-links"><button data-act="autoDemo">${OM.icon('spark', 16)} Демо · 90 секунд</button><button data-act="tour">${OM.icon('play', 16)} Показать историю</button><button data-act="howItWorks">${OM.icon('question', 16)} Как это работает</button><button class="quiet" data-demo-reset>${OM.icon('refresh', 16)} Сбросить демо</button></div>
    </div>`;
    $head.className = 'header' + (window.scrollY > 4 ? ' scrolled' : '');
    $head.innerHTML = `<div class="container">
      <a class="logo" href="#/home" aria-label="ОТП Мания — главная">${OM.logo()}<span class="logo-word"><b>отп</b><i>мания</i></span></a>
      <nav class="nav" aria-label="Разделы">${NAV.filter(allowed).map(([id, name]) => `<a href="#/${id}" class="${route === id || (route === 'profile' && id === 'colleagues') ? 'on' : ''}">${name}${id === 'bonuses' && s.pending.length ? '<span class="dot" aria-label="есть награды"></span>' : ''}</a>`).join('')}</nav>
      <div class="header-right">
        <a class="bal-pill" href="#/bonuses" data-bal="coin" title="Коины">${OM.coin('coin', 26)}<span class="bal-num tnum">${OM.fmt(s.balance.coin)}</span></a>
        <a class="bal-pill ru" href="#/bonuses" data-bal="ru" title="РуКоины">${OM.coin('ru', 26)}<span class="bal-num tnum">${OM.fmt(s.balance.ru)}</span></a>
        <button class="icon-btn" data-bell aria-label="Уведомления">${OM.icon('bell', 20)}${unread ? '<span class="badge-dot"></span>' : ''}</button>
        <button class="me-btn" data-me aria-label="Меню профиля">${OM.ava(me, 40, { title: false })}</button>
      </div>
    </div>`;
    $tab.className = 'tabbar';
    $tab.innerHTML = NAV.filter((n) => tabs().includes(n[0])).map(([id, name, ic]) => `<a href="#/${id}" class="${route === id ? 'on' : ''}"><span class="tb-ic">${OM.icon(ic, 20)}</span>${name}</a>`).join('') +
      `<a href="#more" data-more class="${['shop', 'colleagues', 'vote', 'team', 'profile'].includes(route) ? 'on' : ''}"><span class="tb-ic">${OM.icon('plus', 20)}</span>Ещё</a>`;
  }

  // ---------- роутер ----------
  let cur = null, cleanup = null, viewEl = null;
  function parse() {
    const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
    return { name: parts[0] || 'home', params: parts.slice(1) };
  }
  function go() {
    let { name, params } = parse();
    if (name === 'more') return;
    if (!OM.account && name !== 'login') { location.replace('#/login'); return; }
    if (name === 'login' && OM.account) { location.replace('#/home'); return; }
    if (!OM.views[name]) name = 'home';
    if ((name === 'team' && !OM.account.canManage) || (name === 'admin' && !OM.account.canAdmin)) { location.replace('#/home'); return; }
    OM.modal.closeAll();
    OM.closeMenu();
    if (cleanup) { try { cleanup(); } catch (e) { console.error(e); } cleanup = null; }
    document.body.classList.toggle('is-auth', name === 'login');
    const view = OM.views[name];
    cur = { name, params, view };
    viewEl = document.createElement('div');
    viewEl.className = 'view';
    viewEl.innerHTML = view.render(params);
    $main.replaceChildren(viewEl);
    cleanup = (view.mount && view.mount(viewEl, params)) || null;
    paintChrome(name);
    window.scrollTo(0, 0);
    document.title = name === 'login' ? 'Вход · ОТП Мания' : `${view.title} · ОТП Мания`;
  }

  OM.afterLogin = () => {
    location.hash = '#/home';
    setTimeout(() => {
      OM.toast(`Вы вошли как ${esc(S().name)}`, { icon: 'user' });
      if (!S().onboarded) setTimeout(() => OM.actions.onboarding(), 350);
    }, 300);
  };

  OM.on('change', () => {
    if (!OM.account || !cur || cur.name === 'login') return;
    paintChrome();
    if (cur.view.update) cur.view.update(viewEl, cur.params);
    else {
      const y = window.scrollY;
      viewEl.innerHTML = cur.view.render(cur.params);
      window.scrollTo(0, y);
    }
  });

  // ---------- общие клики ----------
  document.addEventListener('click', (e) => {
    const a = e.target.closest('[data-act]');
    if (a && OM.actions[a.dataset.act]) {
      e.preventDefault();
      OM.actions[a.dataset.act](Object.assign({}, a.dataset), a, e);
    }
  });

  $top.addEventListener('click', (e) => {
    if (e.target.closest('[data-demo-reset]')) confirmReset();
  });

  function confirmReset() {
    OM.modal.open({
      label: 'Сбросить демо',
      html: `<div class="modal-title">Сбросить демо?</div><p class="modal-sub">Все тестовые аккаунты вернутся к началу</p>
        <div class="modal-foot"><button class="btn btn-dark btn-lg" data-yes>Сбросить</button><button class="btn btn-secondary btn-lg" data-close>Отмена</button></div>`,
      onMount(el, entry) {
        el.querySelector('[data-yes]').onclick = () => {
          OM.modal.close(entry);
          OM.officePos = null;
          OM.store.reset();
          if (location.hash !== '#/home') location.hash = '#/home'; else go();
          setTimeout(() => OM.actions.onboarding(), 450);
        };
      },
    });
  }

  function signOut(to) {
    OM.closeMenu();
    OM.officePos = null;
    OM.logout();
    location.hash = to || '#/login';
  }

  $head.addEventListener('click', (e) => {
    const bell = e.target.closest('[data-bell]');
    if (bell) {
      e.stopPropagation();
      const list = notifs();
      const read = S().readNotifs;
      OM.openMenu(bell, `<div style="padding:8px 12px 4px" class="row space"><b style="font-weight:500">Уведомления</b><span class="small muted">${list.length}</span></div>
        ${list.map((n) => `<div class="notif ${read.includes(n.id) ? '' : 'unread'}" data-go="${n.go}"><span class="notif-ic">${OM.icon(n.ic, 18)}</span><div class="grow small"><div>${n.text}</div><div class="muted">${OM.when(n.t)}</div></div></div>`).join('')}`,
        (m) => {
          m.style.width = '360px';
          m.addEventListener('click', (ev) => { const g = ev.target.closest('[data-go]'); if (g) { OM.closeMenu(); location.hash = g.dataset.go; } });
        });
      setTimeout(() => { if (OM.account) OM.store.readNotifs(list.map((n) => n.id)); }, 1200);
      return;
    }
    const me = e.target.closest('[data-me]');
    if (me) {
      e.stopPropagation();
      const p = OM.person('me');
      OM.openMenu(me, `<div class="row" style="padding:10px 12px">${OM.ava(p, 44)}<div><b style="font-weight:500">${esc(p.name)}</b><div class="small muted">${esc(OM.account.login)}</div></div></div><div class="menu-sep"></div>
        <button class="menu-item" data-go="#/profile/me">${OM.icon('user', 18)} Мой профиль</button>
        <button class="menu-item" data-go="#/wardrobe">${OM.icon('hanger', 18)} Изменить образ</button>
        <button class="menu-item" data-go="#/bonuses">${OM.icon('gift', 18)} Бонусы и заказы</button>
        <div class="menu-sep"></div>
        <button class="menu-item" data-mhow>${OM.icon('question', 18)} Как это работает</button>
        <button class="menu-item" data-mtour>${OM.icon('play', 18)} Показать историю</button>
        <button class="menu-item" data-monb>${OM.icon('door', 18)} Знакомство заново</button>
        <button class="menu-item" data-mreset>${OM.icon('refresh', 18)} Сбросить демо</button>
        <div class="menu-sep"></div>
        <button class="menu-item" data-mswitch>${OM.icon('people', 18)} Сменить аккаунт</button>
        <button class="menu-item" data-mout>${OM.icon('logout', 18)} Выйти</button>`,
        (m) => {
          m.addEventListener('click', (ev) => {
            const g = ev.target.closest('[data-go]');
            if (g) { OM.closeMenu(); location.hash = g.dataset.go; return; }
            if (ev.target.closest('[data-mhow]')) { OM.closeMenu(); OM.actions.howItWorks(); return; }
            if (ev.target.closest('[data-mtour]')) { OM.closeMenu(); OM.actions.tour(); return; }
            if (ev.target.closest('[data-monb]')) { OM.closeMenu(); OM.actions.onboarding(); return; }
            if (ev.target.closest('[data-mreset]')) { OM.closeMenu(); confirmReset(); return; }
            if (ev.target.closest('[data-mswitch]') || ev.target.closest('[data-mout]')) signOut();
          });
        });
    }
  });

  $tab.addEventListener('click', (e) => {
    const more = e.target.closest('[data-more]');
    if (!more) return;
    e.preventDefault();
    e.stopPropagation();
    const items = NAV.filter((n) => !tabs().includes(n[0]) && allowed(n));
    const m = OM.openMenu(more, items.map(([id, name, ic]) => `<button class="menu-item" data-go="#/${id}">${OM.icon(ic, 18)} ${name}</button>`).join('') +
      `<div class="menu-sep"></div><button class="menu-item" data-go="#/login">${OM.icon('logout', 18)} Выйти</button>`, (mm) => {
      mm.addEventListener('click', (ev) => { const g = ev.target.closest('[data-go]'); if (g) { OM.closeMenu(); if (g.dataset.go === '#/login') signOut(); else location.hash = g.dataset.go; } });
    });
    const r = more.getBoundingClientRect();
    m.style.top = 'auto';
    m.style.bottom = window.innerHeight - r.top + 8 + 'px';
  });

  window.addEventListener('scroll', () => { $head.classList.toggle('scrolled', window.scrollY > 4); }, { passive: true });
  window.addEventListener('hashchange', go);

  go();
  if (OM.account && !S().onboarded && cur && cur.name !== 'login') setTimeout(() => OM.actions.onboarding(), 500);

  // Офлайн-кэш и установка на телефон — только в продакшен-сборке
  if (document.querySelector('meta[name="om-build"]') && 'serviceWorker' in navigator && window.isSecureContext) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
})();

</script>
</body>
</html>
