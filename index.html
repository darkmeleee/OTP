    ['timur', 'shop', '.shop-grid', 'Сертификаты по брони: партию распределяют по броням, при нехватке — жребий, на подтверждение 48 часов.', () => { const t = document.querySelector('[data-shop="certs"]'); if (t) t.click(); }],
    ['anna', 'wardrobe', '.view .container', 'Анна, вклад месяца: мантия и титул на месяц, примерка мерча на аватаре — гардероб продаёт мерч.'],
    ['eva', 'admin', '.view .grid', 'Ева, HR: охват, ER, активные руководители, «заходили и действовали», брони сертификатов и сигналы.'],
    ['eva', 'admin', '[data-sim-results]', 'Симулятор экономики: потолок эмиссии, касса и остаток на 3 года. Бюджет не растёт.'],
  ];
  let demo = null;
  const unlight = () => document.querySelectorAll('.demo-hl').forEach((x) => x.classList.remove('demo-hl'));
  const demoStop = () => { if (!demo) return; clearTimeout(demo.timer); unlight(); demo.bar.remove(); demo = null; };
  const demoStep = (i) => {
    if (!demo) return;
    clearTimeout(demo.timer);
    unlight();
    if (i >= DEMO.length) {
      demo.bar.innerHTML = `<b class="demo-t">Готово: вся механика за 90 секунд</b><button class="btn btn-sm btn-primary" data-demo-again>Ещё раз</button><button class="btn btn-sm btn-secondary" data-demo-stop>Закрыть</button>`;
      return;
    }
    const [acc, route, sel, text, prep] = DEMO[i];
    demo.i = i;
    OM.modal.closeAll();
    if (OM.account && OM.account.id !== acc) OM.logout();
    if (!OM.account) { OM.login(acc); OM.state.onboarded = true; OM.save(); }
    if (prep && route !== 'shop') prep();
    const next = '#/' + route;
    if (location.hash === next) window.dispatchEvent(new HashChangeEvent('hashchange')); else location.hash = next;
    demo.bar.innerHTML = `<span class="demo-n">${i + 1} / ${DEMO.length}</span><span class="demo-t">${esc(text)}</span><span class="demo-p"><i></i></span><button class="btn btn-sm btn-primary" data-demo-next>Дальше</button><button class="btn btn-sm btn-secondary" data-demo-stop>Стоп</button>`;
    setTimeout(() => {
      if (!demo || demo.i !== i) return;
      if (prep && route === 'shop') prep();
      const el = document.querySelector(sel);
      if (el) { el.classList.add('demo-hl'); el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
      const bar = demo.bar.querySelector('.demo-p i');
      if (bar) { bar.style.transition = 'width 10.3s linear'; requestAnimationFrame(() => { bar.style.width = '100%'; }); }
    }, 650);
    demo.timer = setTimeout(() => demoStep(i + 1), 11000);
  };
  A.autoDemo = () => {
    demoStop();
    const bar = document.createElement('div');
    bar.className = 'demo-bar';
    bar.addEventListener('click', (e) => {
      if (e.target.closest('[data-demo-stop]')) demoStop();
      else if (e.target.closest('[data-demo-next]')) demoStep(demo.i + 1);
      else if (e.target.closest('[data-demo-again]')) demoStep(0);
    });
    document.body.appendChild(bar);
    demo = { bar, i: 0, timer: null };
    demoStep(0);
  };
  A.tour = () => {
    const steps = [
      ['Егор · руководитель', 'egor', 'team', 'Наградите Тимура за FAQ для стажёров — сумму подскажет гайдбук. Индекс учитывает признание, а не количество Коинов.'],
      ['Тимур · сотрудник', 'timur', 'bonuses', 'Заберите настоящую награду из предыдущего шага. Она сохранится после выхода и перезагрузки.'],
      ['Тимур · первые шаги', 'timur', 'home', 'Посмотрите открытку, отправьте задачу на проверку, поблагодарите наставника, проголосуйте в номинациях команды и забронируйте сертификат. В магазине можно предложить поездку за счёт ОТП.'],
      ['Анна · вклад месяца', 'anna', 'wardrobe', 'Примерьте одежду месяца, выберите титул и загляните в офис.'],
      ['Ева · HR', 'eva', 'admin', 'Проверьте запросы сотрудников, правила инициатив, метрики, брони сертификатов и экономику программы.'],
      ['Ирина · директор', 'irina', 'admin', 'Подтвердите награды куратору и руководителю по оценке в демонстрационной системе СОП.']
    ];
    OM.modal.open({ size: 'wide', label: 'Показать историю', html: `<div class="modal-title">Показать историю · 5 минут</div><p class="modal-sub">Шаги сохраняют действия между аккаунтами. Откройте эту историю снова, чтобы перейти дальше.</p><div class="list mt-20">${steps.map(([title,id,route,desc],i) => `<div class="list-item"><span class="way-n">${i+1}</span><div class="grow"><b>${title}</b><p class="small muted">${desc}</p></div><button class="btn btn-sm btn-secondary" data-tour-account="${id}" data-route="${route}">Открыть</button></div>`).join('')}</div>`, onMount(el, entry) { el.addEventListener('click', e => { const b = e.target.closest('[data-tour-account]'); if (!b) return; OM.modal.close(entry); OM.logout(); OM.login(b.dataset.tourAccount); OM.state.onboarded = true; OM.save(); const next = '#/' + b.dataset.route; if (location.hash === next) window.dispatchEvent(new HashChangeEvent('hashchange')); else location.hash = next; }); } });
  };
})();

/* js/views/home.js */
/* Главная кабинета: образ, бонусы, спасибо из рабочих инструментов, открытки и вишлист,
   ударный режим, питомец, путь, «Мой год» и лента признания. */
(function () {
  'use strict';
  const OM = window.OM;
  const D = OM.DATA;
  const esc = OM.esc;
  const S = () => OM.state;
  OM.views = OM.views || {};

  const SRC = { tracker: ['Трекер задач', 'check'], calendar: ['Календарь', 'calendar'], course: ['Академия', 'book'] };
  let phraseI = 0;

  function greeting() {
    const h = new Date().getHours();
    return h < 5 ? 'Доброй ночи' : h < 12 ? 'Доброе утро' : h < 18 ? 'Добрый день' : 'Добрый вечер';
  }

  // Питомец по модели Finch: подсказывает мягко и никогда не ругает
  function petPhrases() {
    const s = S();
    if (s.prefs.vacation) return ['Я путешествую, пока ты в отпуске ✈ Отдыхай!'];
    const out = [];
    if (s.pending.length) out.push('Тебя ждёт награда. Забрать — один клик 🎁');
    if (!s.streak.done && !s.prefs.noStreak) out.push('Кто помог тебе на этой неделе? Одно спасибо — и ударный режим продолжится');
    if (OM.account.tools.some((t) => !s.toolsDone.includes(t.id))) out.push('В рабочих инструментах есть повод сказать спасибо');
    if (s.stage === 'nominations' && Object.keys(D.cats).some((c) => !OM.store.myTeamVote(c))) out.push('«Выбор коллег»: кто в команде лучший в каждой номинации? Голос — до 10-го');
    if (s.stage === 'voting' && Object.values(s.votes).some((v) => !v)) out.push('«Выбор коллег» до 25-го. Поддержишь чей-то вклад?');
    out.push('Хочешь, посижу с тобой 25 минут, пока ты делаешь задачу?');
    out.push('Кажется, пора на перерыв ☕');
    return out;
  }

  function miniOffice() {
    const v = S().visited;
    const floors = 1 + Math.max(...D.rooms.map((r) => r.floor));
    const h = 44 + floors * 36;
    const cells = D.rooms.map((r) => [r.id, r.floor, r.side === 'r' ? 1 : 0]);
    let s = `<svg class="mini" viewBox="0 0 300 ${h}" aria-hidden="true"><rect width="300" height="${h}" fill="#fff"/><rect x="18" y="30" width="264" height="${h - 36}" rx="4" fill="#222"/><rect x="104" y="10" width="92" height="20" rx="10" fill="#222"/><text x="150" y="24" text-anchor="middle" font-family="Onest, Arial" font-size="11" font-weight="700" fill="#C1FF05">отп мания</text>`;
    cells.forEach(([id, f, side]) => {
      const x = side ? 158 : 26, y = 36 + (floors - 1 - f) * 36;
      const on = v.includes(id);
      s += `<rect x="${x}" y="${y}" width="116" height="30" rx="3" fill="${on ? '#C1FF05' : '#F3F4F6'}"/>`;
      if (on) s += `<circle cx="${x + 104}" cy="${y + 10}" r="5" fill="#222"/><path d="M${x + 101.5} ${y + 10} l1.8 1.8 l3.2 -3.4" stroke="#C1FF05" stroke-width="1.6" fill="none"/>`;
    });
    s += `<rect x="144" y="36" width="12" height="${floors * 36 - 6}" fill="#4A4A4F"/></svg>`;
    return s;
  }

  // Подпись источника награды — понятная человеку
  OM.rewardFrom = (p) => {
    const from = p.from ? OM.person(p.from) : null;
    if (p.kind === 'event') return `${esc(p.tier)} · Ваш праздник в ОТП`;
    return `${esc(p.tier)}${from ? ' · ' + esc(from.name) : ''}`;
  };

  const sec = {
    // Администратору — что ждёт решения и сколько свободно в бюджете
    adm() {
      const s = S();
      const A = D.admin;
      const b = A.budget;
      const sig = A.signals.filter((x) => !s.adm.signals[x.id]).length;
      const req = A.requests.filter((x) => !s.adm.requests[x.id]).length;
      return `<div class="mgr-banner mt-20" data-sec="adm">
        <span class="way-n" style="width:44px;height:44px;flex:none">${OM.icon('shield', 20)}</span>
        <b class="grow" style="font-weight:500;font-size:17px;min-width:160px">Программа</b>
        <div class="mgr-stats">
          <div><b>${sig}</b><span class="small muted">${OM.plural(sig, ['сигнал', 'сигнала', 'сигналов'])}</span></div>
          <div><b>${req}</b><span class="small muted">${OM.plural(req, ['запрос', 'запроса', 'запросов'])}</span></div>
          <div><b>${OM.num(b.total - b.paid - b.orders - b.reserve)} млн ₽</b><span class="small muted">свободно</span></div>
        </div>
        <a class="btn btn-primary" href="#/admin">Открыть ${OM.icon('arrow', 16)}</a>
      </div>`;
    },

    // Руководителю сразу видно индекс, кого давно не отмечали и что ждёт решения
    mgr() {
      const pend = OM.store.reviews().length + OM.store.peersToApprove().length;
      const quiet = D.team.filter((p) => { const r = OM.store.teamRec(p); return r == null || r > 30; }).length;
      const ix = OM.store.index();
      return `<div class="mgr-banner mt-20" data-sec="mgr">
        <span class="way-n" style="width:44px;height:44px;flex:none">${OM.icon('chart', 20)}</span>
        <b class="grow" style="font-weight:500;font-size:17px;min-width:160px">Ваша команда</b>
        <div class="mgr-stats">
          <div><b>${ix.value}</b><span class="small muted">индекс признания</span></div>
          <div><b>${quiet}</b><span class="small muted">без признания</span></div>
          <div><b>${pend}</b><span class="small muted">ждут решения</span></div>
        </div>
        <a class="btn btn-primary" href="#/team">Кабинет команды ${OM.icon('arrow', 16)}</a>
      </div>`;
    },

    hero() {
      const me = OM.person('me');
      const s = S();
      const ach = OM.achOf('me').length;
      const got = OM.thanksOf('me').length + s.inbox.filter((x) => x.vis !== 'public').length;
      return `<div class="card hero-profile" data-sec="hero">
        <a class="hero-look" href="#/wardrobe" aria-label="Изменить образ">
          <div class="tg-bg">${OM.avatar.backdrop(me.prof.backdrop, me.prof.pattern, { w: 260, h: 340, cy: 150, r0: 70 })}</div>
          <div class="hero-av">${OM.avatar.svg(me.av, { view: 'full' })}</div>
          ${me.av.pet && me.av.pet !== 'none' ? `<div class="hero-pet">${OM.avatar.pet(me.av.pet, me.av.petColor)}</div>` : ''}
          ${me.prof.emoji ? `<span class="hero-emoji">${me.prof.emoji}</span>` : ''}
          <span class="hero-edit">${OM.icon('edit', 14)} Образ</span>
        </a>
        <div class="hero-info">
          <div>
            <div class="h3">${esc(me.name)}</div>
            <div class="muted small mt-4">${esc(me.role)} · ${esc(me.team)}</div>
          </div>
          <div class="stat-row">
            <div class="stat"><div class="stat-v">${OM.icon('flame', 22)}${s.streak.weeks}</div><div class="stat-l">${OM.plural(s.streak.weeks, ['неделя', 'недели', 'недель'])} подряд</div></div>
            <div class="stat"><div class="stat-v">${got}</div><div class="stat-l">${OM.plural(got, ['спасибо', 'спасибо', 'спасибо'])} получено</div></div>
            <div class="stat"><div class="stat-v">${ach}</div><div class="stat-l">${OM.plural(ach, ['достижение', 'достижения', 'достижений'])}</div></div>
          </div>
          <div class="row-wrap">
            <a class="btn btn-primary" href="#/wardrobe">${OM.icon('hanger', 18)} Изменить образ</a>
            <a class="btn btn-secondary" href="#/profile/me">${OM.icon('eye', 18)} Как меня видят</a>
          </div>
        </div>
      </div>`;
    },

    balance() {
      const s = S();
      const pend = s.pending;
      const held = s.reserved.coin + s.reserved.ru;
      return `<div class="card balance-card" data-sec="balance">
        <div class="card-head" style="margin:0"><div class="card-title">Мои бонусы</div><a class="link-arrow" href="#/bonuses">Подробнее ${OM.icon('arrow', 16)}</a></div>
        <div class="bal-split">
          <a class="stat clickable" href="#/shop"><div class="stat-v tnum">${OM.coin('coin', 26)}${OM.fmt(s.balance.coin)}</div><div class="stat-l">Коины · магазин</div></a>
          <a class="stat clickable" href="#/bonuses"><div class="stat-v tnum">${OM.coin('ru', 26)}${OM.fmt(s.balance.ru)}</div><div class="stat-l">РуКоины · привилегии</div></a>
        </div>
        ${held ? `<div class="small muted">В брони ${OM.fmt(held)} — спишется при выдаче</div>` : ''}
        ${pend.length ? pend.slice(0, 3).map((p) => `<div class="reward-call"><div class="reward-gift">${OM.icon('gift', 24)}</div><div class="grow"><b>+${OM.fmt(p.amount)} ${OM.curName(p.cur, p.amount)}</b><span>${OM.rewardFrom(p)}</span></div><button class="btn btn-primary btn-sm" data-act="claim" data-id="${p.id}">Забрать</button></div>`).join('') : `<div class="try-note">${OM.icon('check', 18)}<span>Все награды получены</span></div>`}
      </div>`;
    },

    // Спасибо в моменте: событие в трекере, календаре или курсе → поблагодарить участников
    tools() {
      const s = S();
      const list = OM.account.tools.filter((t) => !s.toolsDone.includes(t.id));
      return `<div class="card" data-sec="tools">
        <div class="card-head"><div class="card-title">Поблагодарить в моменте</div></div>
        ${list.length ? `<div class="list">${list.map((t) => {
          const [src, ic] = SRC[t.src];
          const ppl = t.who.map((id) => OM.person(id));
          return `<div class="list-item"><span class="way-n" style="width:40px;height:40px;flex:none">${OM.icon(ic, 18)}</span>
            <div class="grow" style="min-width:0"><b style="font-weight:500">${esc(t.title)}</b><div class="small muted">${src} · ${ppl.map((p) => esc(OM.firstName(p))).join(', ')}</div></div>
            <button class="btn btn-sm btn-primary" data-act="thank" data-to="${t.who[0]}" data-what="${esc(t.what)}" data-tool="${t.id}">${OM.icon('heart', 15)} Спасибо</button></div>`;
        }).join('')}</div>` : `<div class="empty"><span class="emoji">💚</span>Все спасибо отправлены</div>`}
      </div>`;
    },

    tasks() {
      const tasks = OM.store.tasks().filter(t => t.who === OM.meId);
      const st = S().taskStreak;
      const labels = { open: 'К выполнению', review: 'На проверке', done: 'Завершено' };
      return `<div class="card mt-20" data-sec="tasks"><div class="card-head"><div><div class="card-title">Мои задачи и награды</div><p class="small muted mt-8">Сумма известна заранее. За задачи выше средней сложности награда закреплена автоматически.</p></div>${S().prefs.noStreak ? '' : `<span class="badge badge-violet">${OM.icon('flame', 15)} ${st.weeks} нед. закрытия задач</span>`}</div><div class="list">${tasks.map(t => `<div class="list-item"><span class="way-n">${OM.icon(t.category === 'social' ? 'heart' : 'check', 18)}</span><div class="grow"><b>${esc(t.title)}</b><div class="small muted">${t.category === 'social' ? 'Социальный вклад' : 'Профессиональный результат'} · ${labels[t.status]}${t.feedback && t.status === 'open' ? ' · ' + esc(t.feedback) : ''}</div></div><span>${t.amount ? OM.money(t.amount, 'ru', 18) : '<span class="small muted">Без Коинов</span>'}</span>${t.status === 'open' ? `<button class="btn btn-sm btn-primary" data-act="completeTask" data-id="${t.id}">Закрыть задачу</button>` : `<span class="badge badge-soft">${labels[t.status]}</span>`}</div>`).join('') || '<p class="small muted">Новые задачи появятся здесь</p>'}</div><p class="small muted mt-16">Три недели с подтверждёнными задачами открывают одежду «В ритме» и титул. Они доступны, пока серия держится; отпуск и больничный замораживают её. Коины остаются у вас.</p></div>`;
    },

    // Открытка от команды, вишлист и чужие праздники
    social() {
      const blocks = [];
      const mine = OM.cardOf('me');
      if (mine) {
        blocks.push(`<button class="social-row" data-act="card" data-owner="${OM.meId}">
          <span class="ava-stack">${mine.signs.slice(0, 4).map((x) => OM.ava(OM.person(x.who), 30, { title: false })).join('')}</span>
          <span class="grow"><b>${esc(mine.title)}</b><span class="small muted">${mine.signs.length} ${OM.plural(mine.signs.length, ['подпись', 'подписи', 'подписей'])} в открытке${mine.gift ? ' · ' + esc(mine.gift) : ''}</span></span>${OM.icon('arrow', 16)}</button>`);
      }
      const w = OM.wishOf('me');
      if (w) {
        blocks.push(`<a class="social-row" href="#/profile/me">
          <span class="way-n" style="width:40px;height:40px;flex:none">${OM.icon('gift', 18)}</span>
          <span class="grow"><b>Вишлист: ${esc(w.kitObj.name)}</b><span class="small muted">Коллеги скинулись ${OM.fmt(w.got)} из ${OM.fmt(w.kitObj.price)}</span>
          <span class="bar bar-thin mt-8" style="display:block"><i style="width:${Math.min(100, (w.got / w.kitObj.price) * 100)}%"></i></span></span></a>`);
      }
      const other = Object.keys(OM.shared().cards).find((k) => !OM.isMe(k) && !OM.cardOf(k).signs.some((x) => OM.isMe(x.who)));
      if (other) {
        const c = OM.cardOf(other);
        const p = OM.person(other);
        blocks.push(`<button class="social-row" data-act="card" data-owner="${other}">
          ${OM.ava(p, 40, { title: false })}<span class="grow"><b>${c.kind === 'first' ? `У ${esc(OM.firstName(p))}а первый день` : `${esc(OM.firstName(p))}: ${esc(c.title)}`}</b><span class="small muted">Подпишите открытку от команды</span></span>${OM.icon('edit', 16)}</button>`);
      }
      if (!blocks.length) return '<div data-sec="social" hidden></div>';
      return `<div class="card" data-sec="social"><div class="card-head"><div class="card-title">Команда рядом</div></div><div class="col" style="gap:8px">${blocks.slice(0, 3).join('')}</div></div>`;
    },

    gamehead() {
      return `<div class="runner-head" data-sec="gamehead">
        <div class="card-title">Перерыв: забег</div>
        <span class="badge">${OM.icon('star', 13)} Рекорд ${OM.fmt(S().game.best)}</span>
      </div>`;
    },

    gamefoot() {
      const best = S().game.best;
      const next = D.items.filter((i) => i.src === 'game' && i.need > best).sort((a, b) => a.need - b.need)[0];
      const prev = D.items.filter((i) => i.src === 'game' && i.need <= best).sort((a, b) => b.need - a.need)[0];
      const floor = prev ? prev.need : 0;
      return `<div class="runner-foot" data-sec="gamefoot">
        <div class="grow" style="min-width:220px">${next
          ? `<div class="bar-label"><span>Дальше: ${esc(next.name)}</span><span class="muted tnum">${OM.fmt(best)} / ${OM.fmt(next.need)}</span></div><div class="bar"><i style="width:${Math.min(100, ((best - floor) / (next.need - floor)) * 100)}%"></i></div>`
          : `<div class="bar-label"><span>Все награды забега открыты</span></div><div class="bar"><i style="width:100%"></i></div>`}</div>
      </div>`;
    },

    // Ударный режим по неделям: хотя бы одно спасибо за неделю, в отпуске — заморозка
    streak() {

        best: s.game.best,
        onOver(score) {

          return res;
        },
      });
      // Таймер «посиди со мной»: тихо тикает в карточке питомца
      const tick = setInterval(() => {
        const end = S().pet.focusEnd;
        const node = el.querySelector('[data-focus]');
        if (!end || !node) return;
        const left = Math.max(0, end - Date.now());
        node.textContent = `${String(Math.floor(left / 60e3)).padStart(2, '0')}:${String(Math.floor((left % 60e3) / 1e3)).padStart(2, '0')}`;
        if (!left) { OM.store.focus(false); OM.toast('25 минут вместе — питомец подрос', { icon: 'paw' }); }
      }, 1000);
      const onClick = (e) => {
        if (e.target.closest('[data-focus-start]')) { OM.store.focus(true); return; }
        if (e.target.closest('[data-focus-stop]')) { OM.store.focus(false); return; }
        const pc = e.target.closest('[data-petclick]');
        if (pc) {
          phraseI++;
          const card = el.querySelector('[data-sec="pet"]');
          card.outerHTML = sec.pet();
          const anim = el.querySelector('[data-sec="pet"] .pet-anim');
          if (anim && !S().prefs.quiet) anim.classList.add('hop');
        }
        const wt = e.target.closest('[data-wtab]');
        if (wt) OM.wardrobeTab = wt.dataset.wtab;
      };
      el.addEventListener('click', onClick);
      el.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.matches('[data-petclick]')) e.target.click(); });
      return () => { runner.destroy(); clearInterval(tick); };
    },
    update(el) {
      ['hero', 'balance', 'steps', 'mgr', 'adm', 'tools', 'tasks', 'social', 'gamehead', 'gamefoot', 'streak', 'pet', 'path', 'office', 'year', 'feed'].forEach((k) => {
        const node = el.querySelector(`[data-sec="${k}"]`);
        if (node) node.outerHTML = sec[k]();
      });
    },
  };
})();

            <div class="card way"><span class="way-n">3</span><div class="h4">Важные даты</div><div class="amount">${OM.coin('coin', 22)} сами</div><p class="small muted">Стаж и юбилеи</p></div>
            <div class="card way"><span class="way-n">4</span><div class="h4">Подарок коллеги</div><div class="amount">${OM.coin('coin', 22)} перевод</div><p class="small muted">Коллега делится Коинами</p></div>
          </div>
        </section>

        <section class="section grid g-side">
          <div class="card">
            <div class="card-head"><div class="card-title">Мои заказы</div><a class="link-arrow" href="#/shop">Магазин ${OM.icon('arrow', 16)}</a></div>
            ${orders()}
          </div>
          <div class="card">
            <div class="card-title">Обмен РуКоинов</div><div class="card-sub">1 РуКоин = 1 Коин</div><div class="try-note mt-12">${OM.icon('info', 18)}<span>Сначала загляните в витрину РуКоинов: время и опыт там не стоят бюджету наград ни рубля.</span></div><button class="btn btn-sm btn-secondary mt-12" data-act="openShop" data-tab="priv">Витрина РуКоинов</button>
            ${s.balance.ru > 0 ? `<div class="row mt-20" style="gap:10px"><div class="money h3">${OM.coin('ru', 24)}<span data-conv-v>${OM.fmt(conv)}</span></div>${OM.icon('arrow', 20)}<div class="money h3">${OM.coin('coin', 24)}<span data-conv-v2>${OM.fmt(conv)}</span></div></div>
              <input class="range mt-12" type="range" min="1" max="${s.balance.ru}" step="1" value="${conv}" data-conv aria-label="Сумма конвертации">
              <div class="row small muted" style="justify-content:space-between"><span>1</span><span>${OM.fmt(s.balance.ru)}</span></div>
              <label class="field mt-12"><span class="field-label">Точная сумма</span><input class="input" type="number" min="1" max="${s.balance.ru}" step="1" value="${conv}" data-conv-number></label>
              <button class="btn btn-dark btn-block mt-16" data-do-conv>${OM.icon('swap', 18)} Конвертировать</button>` : '<p class="muted mt-16">РуКоинов пока нет</p>'}
          </div>
        </section>

        <section class="section">
          <div class="section-head"><h2 class="h2">История операций</h2><div class="seg">${[['all', 'Все'], ['in', 'Начисления'], ['out', 'Списания']].map(([v, n]) => `<button class="${filter === v ? 'on' : ''}" data-filter="${v}">${n}</button>`).join('')}</div></div>
          <div class="card" style="padding:12px 16px">${history()}</div>
        </section>
      </div>`;
    },
    mount(el) {
      el.addEventListener('input', (e) => {
        if (!e.target.matches('[data-conv], [data-conv-number]')) return;
        conv = Math.max(1, Math.min(S().balance.ru, Math.floor(+e.target.value || 1)));
        el.querySelector('[data-conv]').value = conv;
        if (!e.target.matches('[data-conv-number]')) el.querySelector('[data-conv-number]').value = conv;
        el.querySelector('[data-conv-v]').textContent = OM.fmt(conv);
        el.querySelector('[data-conv-v2]').textContent = OM.fmt(conv);
      });
      el.addEventListener('click', (e) => {
        const f = e.target.closest('[data-filter]');
        if (f) { filter = f.dataset.filter; el.innerHTML = OM.views.bonuses.render(); return; }
        const rt = e.target.closest('[data-rate]');
        if (rt) { OM.store.rateOrder(rt.dataset.rate, +rt.dataset.n); OM.toast('Спасибо за оценку', { icon: 'star' }); return; }
        const sh = e.target.closest('[data-shoptab]');
        if (sh) OM.shopTab = sh.dataset.shoptab;
        const c = e.target.closest('[data-do-conv]');
        if (c) {
          const from = S().balance.coin;
          const n = conv;
          const rect = c.getBoundingClientRect();
          OM.modal.open({
            label: 'Подтвердить обмен',
            html: `<div class="modal-title">Обменять ${OM.fmt(n)} ${OM.curName('ru', n)}?</div><p class="modal-sub">На баланс поступит ${OM.fmt(n)} ${OM.curName('coin', n)}. Обратный обмен недоступен.</p><div class="modal-foot"><button class="btn btn-primary" data-confirm-convert>Обменять</button><button class="btn btn-secondary" data-close>Отмена</button></div>`,
            onMount(modal, entry) {
              modal.querySelector('[data-confirm-convert]').onclick = () => {
                if (!OM.store.convert(n)) { OM.toast('Сумма превышает доступный баланс', { icon: 'info' }); return; }
                OM.modal.close(entry);
                OM.fx.flyCoins(rect, 'coin', from, from + n);
                OM.toast(`${OM.fmt(n)} ${OM.curName('ru', n)} → ${OM.fmt(n)} ${OM.curName('coin', n)}`, { coin: 'coin' });
              };
            },
          });
        }
      });
    },
  };
})();

/* js/views/wardrobe.js */
/* Гардероб-примерочная: всё меняется на аватаре сразу, сохранение — одной кнопкой.
   Профиль в духе Telegram: цвет фона, узор, рамка и эмодзи-статус. */
(function () {
  'use strict';
  const OM = window.OM;
  const D = OM.DATA;
  const esc = OM.esc;
  const S = () => OM.state;

  const TABS = [
    { id: 'look', name: 'Внешность' },
    { id: 'clothes', name: 'Одежда', subs: [['top', 'Верх'], ['bottom', 'Низ'], ['shoes', 'Обувь']] },
    { id: 'acc', name: 'Аксессуары', subs: [['hat', 'Головной убор'], ['glasses', 'Очки'], ['extra', 'Аксессуар']] },
    { id: 'pet', name: 'Питомец' },
    { id: 'profile', name: 'Карточка профиля' },
  ];
  const SLOT_TAB = { top: 'clothes', bottom: 'clothes', shoes: 'clothes', hat: 'acc', glasses: 'acc', extra: 'acc', pet: 'pet', backdrop: 'profile', pattern: 'profile', frame: 'profile' };
  const ITEM_SLOTS = ['top', 'bottom', 'shoes', 'hat', 'glasses', 'extra', 'pet'];
  const PROF_SLOTS = ['backdrop', 'pattern', 'frame'];

  let draft = null, prof = null, tab = 'clothes', sub = { clothes: 'top', acc: 'hat' };

  function init() {
    draft = Object.assign({}, S().av);
    prof = Object.assign({}, S().prof);
    if (OM.wardrobeTab) { tab = OM.wardrobeTab; OM.wardrobeTab = null; }
    if (OM.tryOn) {
      const t = OM.tryOn;
      OM.tryOn = null;
      if (PROF_SLOTS.includes(t.slot)) prof[t.slot] = t.id;
      else { draft[t.slot] = t.id; if (t.color) draft[t.slot + 'Color'] = t.color; }
      tab = SLOT_TAB[t.slot] || tab;
      if (sub[tab] !== undefined) sub[tab] = t.slot;
    }
  }

  const same = () => JSON.stringify(draft) === JSON.stringify(S().av) && JSON.stringify(prof) === JSON.stringify(S().prof);
  function missing() {
    const out = [];
    ITEM_SLOTS.forEach((sl) => { const it = OM.item(sl, draft[sl]); if (it && !OM.store.itemState(it).owned) out.push(it); });
    PROF_SLOTS.forEach((sl) => { const it = OM.item(sl, prof[sl]); if (it && !OM.store.itemState(it).owned) out.push(it); });
    const title = OM.store.titles && OM.store.titles().find((x) => x.id === prof.title);
    if (title && !title.unlocked) out.push({ name: title.name, titleHint: title.description });
    return out;
  }

  function tag(it) {
    const st = OM.store.itemState(it);
    switch (st.kind) {
      case 'free': return st.label === 'Бесплатно' ? 'Бесплатно' : `${OM.icon('check', 11, 2.6)} ${esc(st.label)}`;
      case 'owned': return `${OM.icon('check', 11, 2.6)} ${esc(st.label)}`;
      case 'buy': return `${OM.fmt(it.price)} ${OM.coin('coin', 14)}`;
      case 'kit': return `Комплект · ${OM.fmt(st.price)} ${OM.coin('coin', 14)}`;
      case 'waiting': return 'Ждёт выдачи';
      default: return `${OM.icon('lock', 11, 2.2)} ${esc(st.label)}`;
    }
  }

  function tiles(slot, list, small) {
    return `<div class="items" ${small ? 'style="grid-template-columns:repeat(auto-fill,minmax(96px,1fr))"' : ''}>${list.map((it) => {
      const st = OM.store.itemState(it);
      const on = (PROF_SLOTS.includes(slot) ? prof[slot] : draft[slot]) === it.id;
      let pic;
      if (slot === 'pet') pic = it.id === 'none' ? `<span class="emoji">🚫</span>` : OM.avatar.pet(it.id, it.id === draft.pet ? draft.petColor : (it.colors || [])[0], { shadow: false });
      else if (slot === 'pattern') pic = OM.avatar.backdrop(prof.backdrop, it.id, { w: 120, h: 120, cy: 60, r0: 4, dense: true });
      else if (slot === 'frame') pic = `<div style="display:grid;place-items:center;width:100%;height:100%">${OM.ava(Object.assign({}, OM.person('me'), { av: draft, prof: Object.assign({}, prof, { frame: it.id }) }), 72, { title: false })}</div>`;
      else {
        const color = it.id === draft[slot] ? draft[slot + 'Color'] : (it.colors || [])[0];
        pic = it.id === 'none' ? `<span class="emoji">🚫</span>` : OM.avatar.itemPreview(slot, it.id, color, draft);
      }
      return `<button class="item ${on ? 'on' : ''} ${st.owned ? '' : 'locked'}" data-slot="${slot}" data-id="${it.id}" title="${esc(st.hint || it.name)}">
        <div class="item-pic">${pic}</div><div class="item-name">${esc(it.name)}</div><div class="item-tag">${tag(it)}</div>
        ${st.kind === 'locked' ? `<span class="lock">${OM.icon('lock', 12, 2.2)}</span>` : st.owned && it.src !== 'base' ? `<span class="owned-mark">${OM.icon('check', 12, 2.6)}</span>` : ''}
      </button>`;
    }).join('')}</div>`;
  }

  function swatches(slot, it) {
    if (!it || !it.colors || it.colors.length < 2) return '';
    const map = slot === 'pet' ? OM.avatar.PETC : OM.avatar.CLOTH;
    const cur = draft[slot + 'Color'] || it.colors[0];
    return `<div class="opt-group"><div class="opt-title"><span>Цвет: ${esc(it.name.toLowerCase())}</span></div><div class="swatches">${it.colors.map((c) => `<button class="swatch ${cur === c ? 'on' : ''}" style="background:${map[c]}" data-color="${slot}" data-v="${c}" aria-label="${c}"></button>`).join('')}</div></div>`;
  }

  function appearanceTab() {
    const A = D.appearance;
    const tilesOf = (slot, list) => `<div class="items" style="grid-template-columns:repeat(auto-fill,minmax(92px,1fr))">${list.map(([id, name]) => `<button class="item ${draft[slot] === id ? 'on' : ''}" data-look="${slot}" data-v="${id}"><div class="item-pic">${OM.avatar.itemPreview(slot, id, null, draft)}</div><div class="item-name">${esc(name)}</div></button>`).join('')}</div>`;
    return `<div class="opt-group"><div class="opt-title"><span>Фигура</span></div><div class="items" style="grid-template-columns:repeat(2,minmax(0,150px))">${A.body.map(([id, n]) => `<button class="item ${draft.body === id ? 'on' : ''}" data-body="${id}"><div class="item-pic">${OM.avatar.itemPreview('body', id, null, draft)}</div><div class="item-name">${n}</div></button>`).join('')}</div></div>
      <div class="opt-group"><div class="opt-title"><span>Тон кожи</span></div><div class="swatches">${A.skin.map(([id, c]) => `<button class="swatch ${draft.skin === id ? 'on' : ''}" style="background:${c}" data-look="skin" data-v="${id}" aria-label="Тон кожи ${id}"></button>`).join('')}</div></div>
      <div class="opt-group"><div class="opt-title"><span>Причёска</span></div>${tilesOf('hair', A.hair)}</div>
      <div class="opt-group"><div class="opt-title"><span>Цвет волос</span></div><div class="swatches">${A.hairColor.map(([id, n]) => `<button class="swatch ${draft.hairColor === id ? 'on' : ''}" style="background:${OM.avatar.HAIR[id]}" data-look="hairColor" data-v="${id}" title="${esc(n)}" aria-label="${esc(n)}"></button>`).join('')}</div></div>
      <div class="opt-group"><div class="opt-title"><span>Глаза</span></div>${tilesOf('eyes', A.eyes)}</div>
      <div class="opt-group"><div class="opt-title"><span>Улыбка</span></div>${tilesOf('mouth', A.mouth)}</div>
      <div class="opt-group"><div class="opt-title"><span>Щёки</span></div>${tilesOf('cheeks', A.cheeks)}</div>
      <div class="opt-group"><div class="opt-title"><span>Борода и усы</span></div>${tilesOf('facial', A.facial)}</div>`;
  }

  function profileTab() {
    const me = Object.assign({}, OM.person('me'), { av: draft, prof });
    const bds = D.items.filter((i) => i.slot === 'backdrop');
    const titles = OM.store.titles ? OM.store.titles() : [];
    const selectedTitle = titles.find((x) => x.id === prof.title && x.id !== 'none');
    return `${OM.tgCard(me, { size: 108, h: 250, cy: 90, badges: selectedTitle ? `<span class="tg-badge">${OM.icon('star', 13)} ${esc(selectedTitle.name)}</span>` : '' })}
      <div class="opt-group mt-20"><div class="opt-title"><span>Титул</span><span class="small">за ваш вклад</span></div><div class="chips chip-w">${titles.map((t) => `<button class="chip ${(prof.title || 'none') === t.id ? 'on' : ''}" data-title="${t.id}" ${t.unlocked ? '' : 'disabled'} title="${esc(t.description)}">${t.unlocked ? '' : OM.icon('lock', 12)} ${esc(t.name)}${t.temporary ? ' · временный' : ''}</button>`).join('')}</div><p class="small muted mt-12">Титул «В ритме» действует, пока держится серия закрытия задач. «Вклад месяца» — до конца месяца победы. Титулы нельзя купить.</p></div>
      <div class="opt-group mt-20"><div class="opt-title"><span>Цвет профиля</span><span class="small">как в Telegram</span></div><div class="swatches" style="gap:10px">${bds.map((it) => {
        const b = OM.avatar.BACKDROPS[it.id];
        const st = OM.store.itemState(it);
        return `<button class="swatch ${prof.backdrop === it.id ? 'on' : ''}" style="width:48px;height:48px;background:${b.anim ? `linear-gradient(135deg,${b.c1},${b.c3},${b.c2})` : `radial-gradient(circle at 40% 35%,${b.c1},${b.c2})`}" data-slot="backdrop" data-id="${it.id}" title="${esc(it.name + (st.owned ? '' : ' — ' + (st.hint || (it.price ? it.price + ' Коинов' : ''))))}">${st.owned ? '' : `<span style="position:absolute;right:-4px;top:-4px;width:20px;height:20px;border-radius:50%;background:#222;color:#fff;display:grid;place-items:center">${OM.icon(st.kind === 'buy' ? 'coins' : 'lock', 11, 2.2)}</span>`}</button>`;
      }).join('')}</div></div>
      <div class="opt-group"><div class="opt-title"><span>Узор</span></div>${tiles('pattern', D.items.filter((i) => i.slot === 'pattern'), true)}</div>
      <div class="opt-group"><div class="opt-title"><span>Рамка аватара</span><span class="small">знаки за вклад нельзя купить</span></div>${tiles('frame', D.items.filter((i) => i.slot === 'frame'), true)}</div>
      <div class="opt-group"><div class="opt-title"><span>Эмодзи-статус</span></div><div class="emoji-grid">${D.emojis.map((e) => `<button class="emoji-btn ${prof.emoji === e ? 'on' : ''}" data-emoji="${e}">${e}</button>`).join('')}<button class="emoji-btn ${!prof.emoji ? 'on' : ''}" data-emoji="" style="font-size:13px;font-family:var(--font)">нет</button></div></div>`;
  }

  function panel() {
    const t = TABS.find((x) => x.id === tab);
    let body = '';
    if (tab === 'look') body = appearanceTab();
    else if (tab === 'profile') body = profileTab();
    else if (tab === 'pet') {
      const it = OM.item('pet', draft.pet);
      body = `${tiles('pet', D.items.filter((i) => i.slot === 'pet'))}${swatches('pet', it)}
        <div class="opt-group"><label class="field"><span class="field-label">Имя питомца</span><input class="input" data-petname value="${esc(S().petName)}" maxlength="18"></label></div>`;
    } else {
      const slot = sub[tab];
      const list = D.items.filter((i) => i.slot === slot);
      body = `<div class="sub-tabs">${t.subs.map(([id, n]) => `<button class="chip ${slot === id ? 'on' : ''}" data-sub="${id}">${n}</button>`).join('')}</div>${tiles(slot, list)}${swatches(slot, OM.item(slot, draft[slot]))}`;
    }
    return `<div class="card" style="padding:22px"><div class="ward-tabs seg" style="display:flex;flex-wrap:wrap;width:100%">${TABS.map((x) => `<button class="${tab === x.id ? 'on' : ''}" data-tab="${x.id}" style="flex:1">${x.name}</button>`).join('')}</div>${body}</div>`;
  }

  function mirror() {
    const miss = missing();
    const changed = !same();
    const petOn = draft.pet && draft.pet !== 'none';
    const howTo = (it) => {
      if (it.titleHint) return `<span class="small muted">${esc(it.titleHint)}</span>`;
      const st = OM.store.itemState(it);
      if (st.kind === 'buy') return `<button class="btn btn-xs btn-primary" data-act="buyItem" data-slot="${it.slot}" data-id="${it.id}" data-color="${draft[it.slot + 'Color'] || ''}">Купить · ${OM.fmt(it.price)}</button>`;
      if (st.kind === 'kit') return `<button class="btn btn-xs btn-primary" data-act="orderKit" data-id="${it.kit}">Комплект · ${OM.fmt(st.price)}</button>`;
      if (st.kind === 'waiting') return `<span class="small muted">ждёт выдачи заказа</span>`;
      return `<span class="small muted">${esc(st.hint || '')}</span>`;
    };
    return `<div class="mirror">
      <div class="mirror-frame">
        <div class="stage-bg">${OM.avatar.backdrop(prof.backdrop, prof.pattern, { w: 400, h: 520, cy: 250, r0: 110 })}</div>
        <span class="curtain l"></span><span class="curtain r"></span>
        <span class="mirror-tag badge ${changed ? 'badge-lime' : 'badge-dark'}" style="height:30px;font-size:13px">${changed ? OM.icon('spark', 13) + ' Примерка' : OM.icon('check', 13, 2.4) + ' Сейчас на вас'}</span>
        <div class="mirror-av">${OM.avatar.svg(draft, { view: 'full' })}</div>
        ${petOn ? `<div class="mirror-pet">${OM.avatar.pet(draft.pet, draft.petColor)}</div>` : ''}
      </div>
      ${miss.length ? `<div class="try-note">${OM.icon('info', 18)}<div class="grow"><div><b style="font-weight:500">Нужно получить:</b></div>${miss.map((it) => `<div class="row space mt-8" style="gap:8px"><span class="small">${esc(it.name)}</span>${howTo(it)}</div>`).join('')}</div></div>` : ''}
      <div class="mirror-actions">
        <button class="btn btn-primary btn-lg" data-save ${miss.length || !changed ? 'disabled' : ''}>${OM.icon('check', 18, 2.2)} ${changed ? 'Сохранить образ' : 'Образ сохранён'}</button>
        <button class="btn btn-secondary btn-lg btn-icon" data-random title="Случайный образ" aria-label="Случайный образ">${OM.icon('refresh', 20)}</button>
        <button class="btn btn-secondary btn-lg" data-reset ${changed ? '' : 'disabled'}>Сбросить</button>
      </div>
    </div>`;
  }

  function randomize() {
    const pick = (a) => a[(Math.random() * a.length) | 0];
    const A = D.appearance;
    draft.skin = pick(A.skin)[0];
    draft.hair = pick(A.hair.slice(0, 9))[0];
    draft.hairColor = pick(A.hairColor)[0];
    draft.eyes = pick(A.eyes)[0];
    draft.mouth = pick(A.mouth)[0];
    ITEM_SLOTS.filter((s) => s !== 'pet').forEach((slot) => {
      const own = D.items.filter((i) => i.slot === slot && OM.store.itemState(i).owned);
      const it = pick(own);
      draft[slot] = it.id;
      if (it.colors) draft[slot + 'Color'] = pick(it.colors);
    });
    if (Math.random() < 0.5) draft.hat = 'none';
    if (Math.random() < 0.5) draft.extra = 'none';
  }

  OM.views.wardrobe = {
    title: 'Гардероб',
    render() {
      if (!draft) init();
      return `<div class="container">
        <div class="page-head"><h1 class="h1">Гардероб</h1><span class="small muted">Примерка бесплатна</span></div>
        <div class="try-note" style="margin:0 0 20px;background:var(--lime-3)">${OM.icon('star', 18)}<span>Особые образы за вклад: куртка «В ритме» — за 3 недели закрытия задач подряд, мантия «Вклад месяца» — на месяц победы. Отпуск и больничный замораживают серию.</span></div>
        <div class="fitting">${mirror()}${panel()}</div>
      </div>`;
    },
    mount(el) {
      const repaint = () => {
        const fit = el.querySelector('.fitting');
        if (fit) fit.innerHTML = mirror() + panel();
      };
      el.addEventListener('click', (e) => {
        const t = e.target;
        const tb = t.closest('[data-tab]');
        if (tb) { tab = tb.dataset.tab; repaint(); return; }
        const sb = t.closest('[data-sub]');
        if (sb) { sub[tab] = sb.dataset.sub; repaint(); return; }
        const it = t.closest('[data-slot]');
        if (it && !t.closest('[data-act]')) {
          const slot = it.dataset.slot, id = it.dataset.id;
          if (PROF_SLOTS.includes(slot)) prof[slot] = id;
          else {
            draft[slot] = id;
            const item = OM.item(slot, id);
            if (item && item.colors && !item.colors.includes(draft[slot + 'Color'])) draft[slot + 'Color'] = item.colors[0];
          }
          repaint();
          return;
        }
        const bd = t.closest('[data-body]');
        if (bd) { draft = OM.avatar.applyBody(draft, bd.dataset.body); repaint(); return; }
        const lk = t.closest('[data-look]');
        if (lk) { draft[lk.dataset.look] = lk.dataset.v; repaint(); return; }
        const c = t.closest('[data-color]');
        if (c) { draft[c.dataset.color + 'Color'] = c.dataset.v; repaint(); return; }
        const em = t.closest('[data-emoji]');
        if (em) { prof.emoji = em.dataset.emoji; repaint(); return; }
        const title = t.closest('[data-title]');
        if (title && !title.disabled) { prof.title = title.dataset.title; repaint(); return; }
        if (t.closest('[data-random]')) { randomize(); repaint(); return; }
        if (t.closest('[data-reset]')) { draft = Object.assign({}, S().av); prof = Object.assign({}, S().prof); repaint(); return; }
        if (t.closest('[data-save]') && !missing().length) {
          OM.store.saveAvatar(draft);
          OM.store.setProf(prof);
          OM.toast('Образ сохранён — коллеги видят его в офисе и профиле', { icon: 'hanger' });
          const av = el.querySelector('.mirror-av');
          if (av) av.classList.add('pop');
        }
      });
      el.addEventListener('change', (e) => {
        if (e.target.matches('[data-petname]')) {
          const v = e.target.value.trim();
          if (v) { OM.store.setPetName(v); OM.toast(`Питомца зовут ${esc(v)}`, { icon: 'paw' }); }
        }
      });
      return () => { draft = null; prof = null; };
    },
  };
})();

})();

/* Коллеги и профиль: аватар, образ, подтверждённые достижения, благодарности.
   Баланс, покупки и голоса в профиле не показываются. */
(function () {
  'use strict';
  const OM = window.OM;

  const esc = OM.esc;
  let q = '';
  let filter = 'all';

  const FILTERS = [['all', 'Все'], ['team', 'Моя команда'], ['regions', 'Регионы'], ['result', 'Result'], ['learning', 'Learning'], ['enjoyment', 'Enjoyment']];

  function list() {
    let ppl = OM.everyone().filter((p) => p.id !== 'me');

    if (s) ppl = ppl.filter((p) => [p.name, p.role, p.team, p.city].concat(p.skills || []).join(' ').toLowerCase().includes(s));

  function card(p) {

        <div class="pcard-role">${esc(p.role)} · ${esc(p.city)}</div>

          ${ach ? `<span class="badge badge-soft">${OM.icon('check', 12, 2.4)} ${ach} ${OM.plural(ach, ['достижение', 'достижения', 'достижений'])}</span>` : p.isNew ? '<span class="badge badge-blue">Новый сотрудник</span>' : ''}

        </div>

      </div>
    </div>`;
  }

  OM.views.colleagues = {
    title: 'Коллеги',
    render() {
      const l = list();
      return `<div class="container">
        <div class="page-head"><h1 class="h1">Коллеги</h1>
          <a class="btn btn-secondary" href="#/office">${OM.icon('office', 18)} Найти в офисе</a></div>
        <div class="row-wrap" style="gap:12px">
          <div class="search grow" style="min-width:260px;max-width:520px"><input class="input" data-q placeholder="Имя, команда или навык" value="${esc(q)}">${OM.icon('search', 18)}</div>
          <div class="chips">${FILTERS.map(([id, n]) => `<button class="chip ${filter === id ? 'on' : ''}" data-f="${id}">${D.cats[id] ? `<i class="cdot" style="background:${D.cats[id].color}"></i>` : ''}${n}</button>`).join('')}</div>
        </div>
        <div class="small muted mt-16" data-count>${l.length} ${OM.plural(l.length, ['человек', 'человека', 'человек'])}</div>
        <div class="people-grid mt-12" data-grid>${l.map(card).join('') || '<div class="empty"><span class="emoji">🔎</span>Никого не нашли</div>'}</div>
      </div>`;
    },
    mount(el) {
      const paint = () => {
        const l = list();
        el.querySelector('[data-grid]').innerHTML = l.map(card).join('') || '<div class="empty"><span class="emoji">🔎</span>Никого не нашли</div>';
        el.querySelector('[data-count]').textContent = `${l.length} ${OM.plural(l.length, ['человек', 'человека', 'человек'])}`;
      };
      el.addEventListener('input', (e) => { if (e.target.matches('[data-q]')) { q = e.target.value; paint(); } });
      el.addEventListener('click', (e) => {
        const f = e.target.closest('[data-f]');
        if (f) { filter = f.dataset.f; el.querySelectorAll('[data-f]').forEach((b) => b.classList.toggle('on', b === f)); paint(); return; }
        if (e.target.closest('button, a')) return;
        const c = e.target.closest('[data-person]');
        if (c) location.hash = '#/profile/' + c.dataset.person;
      });
      el.addEventListener('keydown', (e) => { const c = e.target.closest('[data-person]'); if (c && e.key === 'Enter' && e.target === c) location.hash = '#/profile/' + c.dataset.person; });
    },
    update(el) {
      const g = el.querySelector('[data-grid]');
      if (g) g.innerHTML = list().map(card).join('');
    },
  };

  // ---------- профиль ----------
  const WEAR = ['top', 'bottom', 'shoes', 'hat', 'glasses', 'extra', 'pet'];
  function wearList(p) {
    return WEAR.filter((sl) => p.av[sl] && p.av[sl] !== 'none').map((sl) => {
      const it = OM.item(sl, p.av[sl]);
      if (!it) return '';
      const color = p.av[sl + 'Color'] || '';
      const pic = sl === 'pet' ? OM.avatar.pet(it.id, color) : OM.avatar.itemPreview(sl, it.id, color, p.av);
      const kind = it.src === 'kit' ? '<span class="badge badge-dark">с реальной вещью</span>' : it.src === 'digital' ? '<span class="badge badge-violet">цифровая</span>' : '';
      return `<button class="item" data-act="itemCard" data-slot="${sl}" data-id="${it.id}" data-owner="${p.id}" data-color="${color}"><div class="item-pic">${pic}</div><div class="item-name">${esc(it.name)}</div><div class="item-tag">${kind || 'Открыть карточку'}</div></button>`;
    }).join('');
  }

  function achCard(a, p, mine) {
    const by = a.by ? OM.person(a.by) : null;
    return `<div class="ach">
      <div class="row-wrap">${OM.catBadge(a.cat)}<span class="badge badge-soft">${OM.icon('check', 12, 2.4)} Подтверждённый вклад</span></div>
      <div class="ach-title">${esc(a.title)}</div>
      <div class="ach-text">${esc(a.what)}</div>
      <div class="ach-res"><b style="font-weight:600">Результат:</b> ${esc(a.res)}</div>
      <div class="ach-foot">
        <span class="ava-stack">${(a.parts || []).map((id) => OM.ava(OM.person(id), 26)).join('')}</span>
        <span>${(a.parts || []).length > 1 ? 'Участники · ' : ''}${by ? (by.id === 'me' ? 'подтвердили вы' : (by.g === 'f' ? 'подтвердила ' : 'подтвердил ') + esc(by.name)) : ''} · ${OM.when(Date.now() - a.ago * 864e5)}</span>
      </div>
      ${mine ? '' : `<div class="row-wrap mt-16"><button class="btn btn-sm btn-primary" data-act="thank" data-to="${p.id}" data-cat="${a.cat}">${OM.icon('heart', 16)} Поблагодарить</button>${OM.isTeam(p.id) ? `<button class="btn btn-sm btn-outline" data-act="teamVote" data-who="${p.id}" data-cat="${a.cat}">Голос в номинации</button>` : ''}</div>`}
    </div>`;

  function recognitionExtras(id, mine) {
    const wish = OM.wishOf(id), card = OM.cardOf(id);

    }
    if (card) html += `<div class="card mt-16"><div class="row"><span class="way-n">${OM.icon('heart', 20)}</span><div><div class="card-title">${esc(card.title)}</div><div class="small muted">${card.signs.length} ${OM.plural(card.signs.length, ['подпись', 'подписи', 'подписей'])} от коллег</div></div></div><button class="btn btn-secondary mt-16" data-act="card" data-owner="${owner}">${mine ? 'Читать открытку' : 'Открыть и подписать'}</button></div>`;
    return html;
  }

  OM.views.profile = {
    title: 'Профиль',
    render(params) {
      const id = (params && params[0]) || 'me';
      const p = OM.person(id);
      if (!p) return `<div class="container"><div class="empty"><span class="emoji">🤷</span>Профиль не найден. <a class="link" href="#/colleagues">К коллегам</a></div></div>`;
      const mine = OM.isMe(id);
      const ach = OM.achOf(id);
      const th = OM.thanksOf(id);
      const actions = mine
        ? `<a class="btn btn-primary" href="#/wardrobe">${OM.icon('hanger', 18)} Изменить образ</a>`
        : `<button class="btn btn-primary" data-act="thank" data-to="${id}">${OM.icon('heart', 18)} Поблагодарить</button>${OM.isTeam(id) ? `<button class="btn btn-secondary" data-act="teamVote" data-who="${id}">Голос в номинации</button>` : ''}${OM.account.canManage ? `<button class="btn btn-secondary" data-act="award" data-who="${id}">Наградить</button>` : ''}<button class="btn btn-secondary" data-act="transfer" data-to="${id}">Поделиться Коинами</button><button class="btn btn-secondary" data-act="peerBonus" data-to="${id}">Peer-бонус · 1 000</button>`;
      const badges = [
        OM.titleOf && OM.titleOf(id) ? `<span class="tg-badge">${OM.icon('star', 13)} ${esc(OM.titleOf(id))}</span>` : '',
        p.winner ? `<span class="tg-badge">${OM.icon('trophy', 14)} «Выбор коллег»</span>` : '',
      ].join('');
      return `<div class="container">
        ${mine ? `<div class="try-note" style="background:var(--lime-3);margin:0 0 20px">${OM.icon('eye', 18)}<span>Так вас видят коллеги</span></div>` : `<a class="link-arrow muted" href="#/colleagues" style="margin-bottom:16px;display:inline-flex">${OM.icon('back', 16)} Коллеги</a>`}
        <div class="profile-layout">
          <div class="profile-side">
            ${OM.tgCard(p, { size: 150, h: 420, cy: 140, badges, actions })}
            <div class="card card-tight">
              <div class="small muted">Команда</div><div>${esc(p.team)}</div>
              <div class="small muted mt-12">Город</div><div>${esc(p.city)}</div>
              ${(p.skills || []).length ? `<div class="small muted mt-12">Компетенции</div><div class="chips mt-8">${p.skills.map((k) => `<span class="badge">${esc(k)}</span>`).join('')}</div>` : ''}
              ${mine ? '' : `<button class="btn btn-sm btn-secondary mt-16" data-project>${OM.icon('arrow', 16)} Посмотреть проект</button>`}
            </div>
            ${recognitionExtras(id, mine)}
          </div>
          <div>
            <section>
              <div class="section-head"><h2 class="h3">Достижения</h2></div>
              ${ach.length ? ach.map((a) => achCard(a, p, mine)).join('') : `<div class="card"><div class="empty"><span class="emoji">🌱</span>${p.isNew ? 'Первые достижения впереди' : 'Пока нет достижений'}</div></div>`}
            </section>
            <section class="section">
              <div class="section-head"><h2 class="h3">Образ</h2><span class="small muted">Нажмите, чтобы примерить</span></div>
              <div class="card" style="padding:16px"><div class="items" style="grid-template-columns:repeat(auto-fill,minmax(120px,1fr))">${wearList(p)}</div></div>
            </section>
            <section class="section">
              <div class="section-head"><h2 class="h3">Благодарности</h2></div>
              <div class="card">${th.length ? th.map((t) => { const a = OM.person(t.from); return `<div class="feed-item">${OM.ava(a, 40)}<div class="grow"><div class="feed-text"><b>${esc(a.id === 'me' ? 'Вы' : a.name)}</b></div><div class="feed-quote">«${esc(t.what)}»${t.help ? ` — <span class="muted">${esc(t.help)}</span>` : ''}</div><div class="feed-meta">${OM.catBadge(t.cat)}<span>${OM.when(t.t)}</span></div></div></div>`; }).join('') : '<div class="empty">Пока пусто</div>'}</div>
            </section>
          </div>
        </div>
      </div>`;
    },
    mount(el) {
      el.addEventListener('click', (e) => {
        if (e.target.closest('[data-project]')) OM.toast('Проект откроется в OTP Space — в демо это заглушка', { icon: 'info' });
      });

  };
})();

/* js/views/vote.js */
/* «Выбор коллег»: выбор в команде → подтверждение → финал банка → итог.
   Номинации не связаны со «спасибо»: в каждой номинации пул — вся команда, голос тайный и с причиной.
   В финале за себя и свою команду голосовать нельзя, промежуточные результаты скрыты. */
(function () {
  'use strict';
  const OM = window.OM;
  const D = OM.DATA;
  const esc = OM.esc;
  const S = () => OM.state;

  const STAGES = [
    ['nominations', 'Выбор в команде', '1–10 число'],
    ['review', 'Подтверждение', 'до 15-го'],
    ['voting', 'Финал банка', '16–25 число'],
    ['results', 'Итог', 'до конца месяца'],
  ];
  const NOTE = {
    result: 'Профессиональная номинация · задачи, улучшения и клиентский результат',
    learning: 'Профессиональная номинация · знания, наставничество и развитие',
    enjoyment: 'Социальная номинация · атмосфера, сообщества и помощь коллегам',
  };
  const PRIZE = 25000;
  const cats = () => Object.keys(D.cats);
  const month = () => new Date().toLocaleDateString('ru-RU', { month: 'long' });
  const people = (n) => (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? 'человека' : 'человек');
  // Черновик выбора до отправки голоса — отдельно для каждого аккаунта
  const drafts = {};
  const draft = (cat) => {
    const all = drafts[OM.meId] || (drafts[OM.meId] = {});
    if (!all[cat]) { const mine = OM.store.myTeamVote(cat); all[cat] = { who: mine ? mine.who : null, why: mine ? mine.why : '', edit: !mine }; }
    return all[cat];
  };
  let opened = false;

  const head = (cat, extra) => `<div class="section-head"><h2 class="h3">${D.cats[cat].name} <span class="muted" style="font-weight:400">· ${D.cats[cat].ru}</span></h2>${extra || ''}</div><p class="small muted" style="margin:-8px 0 16px">${NOTE[cat]}</p>`;
  const done = (cat) => `<span class="badge badge-soft">${OM.icon('check', 12, 2.4)} Голос отдан</span>`;

  // Этап 1. В каждой номинации пул — вся команда
  function teamCat(cat) {
    const mine = OM.store.myTeamVote(cat);
    const d = draft(cat);
    if (mine && !d.edit) {
      const p = OM.person(mine.who);
      return `<section class="vote-cat">${head(cat, done(cat))}<div class="card"><div class="row" style="gap:14px">${OM.ava(p, 48)}<div class="grow"><div class="small muted">Ваш голос · видите только вы</div><b style="font-weight:500">${esc(p.name)}</b><div class="small mt-8">«${esc(mine.why)}»</div></div><button class="btn btn-sm btn-secondary" data-edit="${cat}">Изменить</button></div></div></section>`;
    }
    return `<section class="vote-cat">${head(cat)}<div class="card">
      <div class="pool">${OM.store.teamPool().map((id) => { const p = OM.person(id); return `<button type="button" class="pool-p ${d.who === id ? 'on' : ''}" data-pool="${cat}" data-who="${id}">${OM.ava(p, 44, { title: false })}<span>${esc(OM.firstName(p))}</span></button>`; }).join('')}</div>
      <label class="field mt-16"><span class="field-label">За что · одной строкой</span><textarea class="input" rows="2" maxlength="200" data-why="${cat}" placeholder="Что сделал коллега и чем это помогло">${esc(d.why)}</textarea></label>
      <div class="row-wrap mt-12"><button class="btn btn-primary" data-team-vote="${cat}">Отдать голос</button>${mine ? `<button class="btn btn-ghost" data-cancel="${cat}">Отмена</button>` : ''}<span class="small" style="color:#B3261E" data-msg="${cat}"></span></div>
    </div></section>`;
  }
  function teamStage() {
    const n = OM.store.teamPool().length;
    const k = cats().filter((c) => OM.store.myTeamVote(c)).length;
    const merged = OM.account.team.length < 3 ? ' Ваша команда меньше трёх человек — голосуете в общем пуле отдела.' : '';
    return `<div class="card window-bar" style="margin-bottom:28px"><div class="row" style="gap:14px"><span class="way-n" style="width:44px;height:44px">${OM.icon('people', 20)}</span><div><b style="font-weight:500">Пул — вся команда: ${n} ${people(n)}</b><div class="small muted">В каждой номинации один тайный голос с причиной. За себя голосовать нельзя, «спасибо» на номинации не влияет.${merged}</div></div></div>
      <div class="grow" style="min-width:180px"><div class="bar-label"><span>Ваши голоса</span><span class="muted">${k} из ${cats().length}</span></div><div class="bar"><i style="width:${(k / cats().length) * 100}%"></i></div></div></div>
      ${cats().map(teamCat).join('')}`;
  }

  // Этап 2. Номинант команды — больше всего голосов; руководитель подтверждает вклад
  function nomineesStage() {
    const badge = { ok: ['badge-lime', 'Подтверждено'], details: ['badge-warn', 'Нужны подробности'], wait: ['badge-gray', 'Ждёт руководителя'] };
    return `<div class="grid g-3">${cats().map((cat) => {
      const n = OM.store.teamNominee(cat);
      if (!n) return `<div class="card">${OM.catBadge(cat)}<div class="empty small mt-12">Голосов пока нет</div></div>`;
      const p = OM.person(n.who), b = badge[n.status] || badge.wait;
      return `<div class="card"><div class="row-wrap" style="justify-content:space-between">${OM.catBadge(cat)}<span class="badge ${b[0]}">${b[1]}</span></div>
        <div class="row mt-16" style="gap:12px">${OM.ava(p, 52)}<div><b style="font-weight:500">${esc(p.name)}</b><div class="small muted">${n.n} из ${n.total} голосов команды</div></div></div>
        <div class="list mt-12">${n.reasons.slice(0, 2).map((r) => `<div class="list-item small">«${esc(r)}»</div>`).join('')}</div>
        ${OM.account.canManage && n.status === 'wait' ? `<div class="row-wrap mt-12"><button class="btn btn-sm btn-primary" data-confirm="${cat}" data-ok="1">Подтвердить</button><button class="btn btn-sm btn-ghost" data-confirm="${cat}" data-ok="0">Попросить подробности</button></div>` : ''}</div>`;
    }).join('')}</div>
    <p class="small muted mt-16">Причины показываем без авторов. После подтверждения руководителя номинант команды выходит в финал банка 16-го числа.</p>`;
  }

  // Этап 3. Финал банка: номинанты команд, за свою команду голосовать нельзя
  function finalist(cat, f) {
    const p = OM.person(f.who);
    const voted = S().votes[cat] === f.id;
    const participants = Array.from(new Set([f.who].concat(f.parts || [])));
    const own = participants.some((id) => OM.isMe(id));
    const blocked = own || participants.some((id) => OM.isTeam(id));
    return `<div class="fin ${voted ? 'voted' : ''} ${blocked ? 'blocked' : ''}">
      <div class="fin-title">${esc(f.title)}</div>
      <div class="small muted">${esc(f.res)}</div>
      <div class="fin-who">${OM.ava(p, 36)}<div class="grow"><b style="font-weight:500">${esc(p.name)}</b><div class="small muted">${esc(p.team)}</div></div><a class="link small" href="#/profile/${p.id}">Профиль</a></div>
      ${f.parts.length > 1 ? `<div class="row small muted"><span class="ava-stack">${f.parts.map((id) => OM.ava(OM.person(id), 24)).join('')}</span>${f.parts.map((id) => esc(OM.firstName(OM.person(id)))).join(', ')}</div>` : ''}
      <div class="fin-foot">${blocked
        ? `<span class="badge badge-gray" style="height:36px;font-size:13px">${OM.icon('lock', 13)} ${own ? 'Ваш вклад' : 'Ваша команда'}</span>`
        : voted
          ? `<button class="btn btn-dark" data-vote="${cat}" data-id="${f.id}" title="Отменить голос">${OM.icon('check', 18, 2.4)} Ваш голос</button>`
          : `<button class="btn btn-primary" data-vote="${cat}" data-id="${f.id}">Голосовать</button>`}</div>
    </div>`;
  }
  // Порядок перемешан при открытии; номинант своей команды может смениться — добавляем его в конец
  function finalOrder(cat) {
    const list = OM.store.finalists(cat);
    const order = ((OM.voteOrder || {})[cat] || []).map((id) => list.find((f) => f.id === id)).filter(Boolean);
    list.forEach((f) => { if (!order.includes(f)) order.push(f); });
    return order;
  }
  function voting() {
    const v = S().votes;
    const n = cats().filter((c) => v[c]).length;
    return `<div class="card window-bar" style="margin-bottom:28px"><div class="row" style="gap:14px"><span class="way-n" style="width:44px;height:44px">${OM.icon('vote', 20)}</span><div><b style="font-weight:500">Ваши голоса: ${n} из ${cats().length}</b><div class="small muted">В финале — номинанты команд банка. По одному голосу в номинации, учитываем всех соавторов</div></div></div>
      <div class="grow" style="min-width:180px"><div class="bar"><i style="width:${(n / cats().length) * 100}%"></i></div></div></div>
      ${cats().map((cat) => `<section class="vote-cat">${head(cat, v[cat] ? done(cat) : '')}<div class="fin-grid">${finalOrder(cat).map((f) => finalist(cat, f)).join('')}</div></section>`).join('')}`;
  }
  function results() {
    return cats().map((cat) => {
      const list = OM.store.finalists(cat);
      const raw = (f) => (D.results[f.id] != null ? D.results[f.id] : 15);
      const sum = list.reduce((a, f) => a + raw(f), 0) || 1;
      const pct = (f) => Math.round((raw(f) / sum) * 100);
      list.sort((a, b) => raw(b) - raw(a));
      const win = list[0];
      if (!win) return '';
      const p = OM.person(win.who);
      return `<section class="vote-cat">${head(cat)}
        <div class="grid g-main">
          <div class="card winner"><div class="row-wrap"><span class="badge badge-lime">${OM.icon('trophy', 13)} Вклад месяца</span><span class="badge" style="background:rgba(255,255,255,.12);color:#fff">+${OM.fmt(PRIZE)} ${OM.coin('ru', 14)}</span></div>
            <div class="row mt-16">${OM.ava(p, 64)}<div><div class="h4">${esc(win.title)}</div><div class="muted small">${esc(p.name)} · ${esc(p.team)}</div></div></div>
            <p class="mt-12 small" style="color:rgba(255,255,255,.85)">${esc(win.res)}</p>
            ${win.parts.length > 1 ? `<p class="small muted mt-8">Делится между участниками</p>` : ''}</div>

        </div></section>`;
    }).join('');

  OM.views.vote = {
    title: 'Выбор коллег',
    render() {
      if (!opened) { OM.shuffleVotes(); opened = true; }
      const st = S().stage;
      const body = st === 'nominations' ? teamStage() : st === 'review' ? nomineesStage() : st === 'voting' ? voting() : results();
      return `<div class="container">
        <div class="page-head"><h1 class="h1">Выбор коллег · ${month()}</h1></div>
        <div class="stages">${STAGES.map(([id, n, d], i) => `<button class="stage ${st === id ? 'on' : ''} ${STAGES.findIndex((x) => x[0] === st) > i ? 'done' : ''}" data-stage="${id}"><b>${i + 1}. ${n}</b><span class="small muted">${d}</span></button>`).join('')}</div>

        <div class="mt-24">${body}</div>
      </div>`;
    },
    mount(el) {
      const rerender = () => { el.innerHTML = OM.views.vote.render(); };
      el.addEventListener('input', (e) => {
        const w = e.target.closest('[data-why]');
        if (w) draft(w.dataset.why).why = w.value;
      });
      el.addEventListener('click', (e) => {
        const s = e.target.closest('[data-stage]');
        if (s) { OM.store.setStage(s.dataset.stage); if (s.dataset.stage === 'results') OM.fx.confetti({ n: 120 }); return; }
        const pick = e.target.closest('[data-pool]');
        if (pick) {
          draft(pick.dataset.pool).who = pick.dataset.who;
          el.querySelectorAll(`[data-pool="${pick.dataset.pool}"]`).forEach((b) => b.classList.toggle('on', b === pick));
          const m = el.querySelector(`[data-msg="${pick.dataset.pool}"]`); if (m) m.textContent = '';
          return;
        }
        const ed = e.target.closest('[data-edit]');
        if (ed) { draft(ed.dataset.edit).edit = true; rerender(); return; }
        const cn = e.target.closest('[data-cancel]');
        if (cn) { const mine = OM.store.myTeamVote(cn.dataset.cancel); Object.assign(draft(cn.dataset.cancel), { edit: false, who: mine.who, why: mine.why }); rerender(); return; }
        const tv = e.target.closest('[data-team-vote]');
        if (tv) {
          const cat = tv.dataset.teamVote, d = draft(cat);
          const r = d.who ? OM.store.teamVote(cat, d.who, d.why) : 'Выберите коллегу из пула команды';
          if (r === true) { d.edit = false; OM.toast('Голос учтён. Его видите только вы', { icon: 'check' }); rerender(); }
          else { const m = el.querySelector(`[data-msg="${cat}"]`); if (m) m.textContent = r; }
          return;
        }
        const cf = e.target.closest('[data-confirm]');
        if (cf) { OM.store.confirmNominee(cf.dataset.confirm, cf.dataset.ok === '1'); OM.toast(cf.dataset.ok === '1' ? 'Номинант подтверждён и выйдет в финал банка' : 'Запросили у команды подробности', { icon: 'check' }); return; }
        const v = e.target.closest('[data-vote]');
        if (v) {
          const was = S().votes[v.dataset.vote];
          OM.store.vote(v.dataset.vote, v.dataset.id);
          if (was !== v.dataset.id) OM.toast('Голос учтён. Его видите только вы', { icon: 'check' });
        }
      });
      return () => { opened = false; };
    },
  };
})();

;

      let v = seed % 6 === 0 ? 0 : (seed % 3) + (seed % 7 === 0 ? 1 : 0);
      if (rec == null || ago < rec - 3) v = 0;
      if (rec === 0 && w === 11) v = Math.max(v, 2);
      out.push(Math.min(4, v));
    }
    return out;

          ${chartCard('months', 'Награды по месяцам', 'РуКоины', OM.charts.bars({ data: byMonth, ref: M.fundMonth, refLabel: 'фонд в месяц', unit: 'РуКоинов', label: 'Награды по месяцам' }), OM.charts.table(['Месяц', 'РуКоины'], byMonth.map((m) => [m[0], OM.fmt(m[1])]))) }

  const sim = Object.assign({}, A.sim);
  // Тот же помесячный расчёт, что в финмодели (лист «Поток_36м»): спрос — доля свободных коинов,
  // магазин — не больше окна, события — по курсу 1:10, лишний спрос ждёт в брони.
  function simRun(s) {
    const rate = 5, keff = 1.03, S0 = 160, E = 95.2 / 12, evB = 33 - s.shop;
    const ramp = (t) => (t <= 12 ? [0, 0.25, 0.5, 0.6][Math.floor((t - 1) / 3)] : t <= 24 ? 0.7 : 0.8);
    const p = s.p / 100, e = s.e / 100, v = s.v / 100;

    const out = { stock: [S0 / rate], cash: [0, 0, 0], qmax: 0 };
    for (let t = 1; t <= 36; t++) {
      const L = p * (S + E - Q);
      const ev = Math.min(e * L, (evB / 12) * s.prem * ramp(t));
      const dem = (1 - v - e) * L + Q + (t === 1 ? (s.rush / 100) * S0 : 0);
      const shop = Math.min(dem, ((s.shop / 12 + Math.max(0, evB / 12 - ev / s.prem)) / keff) * rate);
      Q = dem - shop;
      S = S + E - v * L - ev - shop;
      out.cash[Math.floor((t - 1) / 12)] += (shop * keff) / rate + ev / s.prem;
      out.qmax = Math.max(out.qmax, Q / ((s.shop / 12 / keff) * rate));
      if (t % 12 === 0) out.stock.push(S / rate);
    }
    return out;
  }
  function simResults() {
    const r = simRun(sim);
    const points = [['Сейчас', r.stock[0]]].concat([1, 2, 3].map((y) => [String(A.year + y - 1), Math.round(r.stock[y] * 10) / 10]));
    return `<div class="chart">${OM.charts.line({ data: points, yMax: Math.max(40, ...points.map((p) => p[1])) + 4, fmt: (v) => OM.num(v, 1) + ' млн', tick: (v) => OM.num(v, 0), label: 'Остаток коинов на счетах, млн ₽ по номиналу' })}</div><div class="grid g-3 mt-16"><div><div class="small muted">Остаток через 3 года</div><b class="h3">${OM.num(r.stock[3], 1)} млн ₽</b><div class="small muted">без изменений — 51 млн ₽</div></div><div><div class="small muted">Касса по годам, млн ₽</div><b class="h3 tnum">${r.cash.map((c) => OM.num(c, 1)).join(' · ')}</b><div class="small muted">бюджет — 33 в год</div></div><div><div class="small muted">Очередь в магазине</div><b class="h3">${r.qmax < 0.05 ? 'нет' : OM.num(r.qmax, 1) + ' мес.'}</b><div class="small muted">максимум, в окнах магазина</div></div></div><p class="small muted mt-16">Каждый месяц сотрудники тратят часть свободных коинов: в магазине — 5 коинов за 1 ₽ и не больше окна, на события сообществ — 10 за 1 ₽, часть — без денег. Лишний спрос ждёт в брони. Формулы — как в финмодели. Накопленные Коины не сгорают.</p>`;
  }
  function simulator() {
    const inputs = [['p', 'Тратят в месяц, % свободных коинов', 4, 20, 1], ['e', 'Траты на события сообществ, %', 0, 40, 1], ['v', 'Траты без денег, %', 0, 30, 1], ['prem', 'Курс событий, коинов за 1 ₽', 5, 15, 1], ['shop', 'Магазин в бюджете 33, млн ₽', 20, 30, 1], ['rush', 'Рывок после запуска, % остатка', 0, 40, 5]];
    return `<section class="section"><div class="section-head"><div><h2 class="h2">Симулятор экономики</h2><div class="muted mt-8">Сценарий для обсуждения · значения ползунков не меняют реальные балансы</div></div></div><div class="grid g-main"><div class="card" data-sim-results>${simResults()}</div><div class="card"><div class="col" style="gap:20px">${inputs.map(([id, label, min, max, step]) => `<label class="field"><span class="bar-label"><span>${label}</span><b class="tnum" data-sim-value="${id}">${OM.num(sim[id], 0)}</b></span><input type="range" min="${min}" max="${max}" step="${step}" value="${sim[id]}" data-sim="${id}" aria-label="${label}" style="width:100%;accent-color:var(--lime-ink)"></label>`).join('')}</div><p class="small muted mt-20">База: остаток 32 → 20,8 → 16,1 → 14,8 млн ₽, касса 25,2 → 18,8 → 16,2 при бюджете 33 = магазин 25 + события 8. IT финансируется отдельно от наград.</p></div></div></section>`;
  }

  OM.views.admin = {
    title: 'Программа',
    render() {
      const k = A.kpi;
      return `<div class="container">
        <div class="page-head"><div><h1 class="h1">Программа</h1><div class="muted mt-8">ОТП Мания · прогноз на ${A.month}-й месяц ${A.year} года</div></div></div>
        <div class="grid g-4">
          ${kpi('Кого заметили за месяц', `${k.coverage}%`, `было ${k.coverageBase}%`, k.coverage)}
          ${kpi('Как быстро замечают вклад', `${k.median} ${OM.plural(k.median, ['день', 'дня', 'дней'])}`, 'медиана', (k.median / 14) * 100)}
          ${kpi('CSI', OM.num(k.csi, 2), `цель ${OM.num(k.csiGoal, 2)}`, (k.csi / 5) * 100)}
          ${kpi('Заказы в срок', `${k.onTime}%`, 'цель 95%', k.onTime)}
        </div>
        <div class="grid g-3 mt-20">
          ${kpi('Вовлечённость · ER', `${k.er}%`, `было ${k.erBase}% · цель ${k.erGoal}%`, k.er)}
          ${kpi('Активные руководители', `${A.managers.active} из ${A.managers.total}`, `отметили коллег за месяц · цель 80%`, A.managers.active / A.managers.total * 100)}
          ${kpi('Действовали за 30 дней', '47%', 'заходили 89% · поблагодарили, голосовали, получили признание или потратили', 47)}
        </div>
        <div class="grid g-2 mt-20">${budget()}${obligations()}</div>
        <div class="grid g-2 mt-20">${signals()}${requests()}</div>
        <div class="grid g-2 mt-20">${managerIndex()}${sopRewards()}</div>
        ${certBatches()}
        ${eventRequests()}
        ${taskReviews()}
        ${peerReviews()}
        ${simulator()}
      </div>`;
    },
    mount(el) {
      el.addEventListener('input', (e) => {
        const field = e.target.closest('[data-sim]');
        if (!field) return;
        sim[field.dataset.sim] = Number(field.value);
        el.querySelector(`[data-sim-value="${field.dataset.sim}"]`).textContent = OM.num(sim[field.dataset.sim], field.dataset.sim === 'k' ? 2 : 0);
        el.querySelector('[data-sim-results]').innerHTML = simResults();

      el.addEventListener('click', (e) => {

        if (peer) { OM.store.approvePeer(peer.dataset.peerReview, peer.dataset.ok === '1'); OM.toast(peer.dataset.ok === '1' ? 'Peer-бонус отправлен коллеге' : 'Peer-бонус отклонён', { icon: 'check' }); return; }
        const task = e.target.closest('[data-task-review]');
        if (task) { const r = OM.store.reviewTask(task.dataset.taskReview, task.dataset.ok === '1'); OM.toast(r.ok ? (task.dataset.ok === '1' ? 'Результат подтверждён. Награда отправлена' : 'Задача возвращена на доработку') : (r.reason || 'Не удалось обработать задачу'), { icon: r.ok ? 'check' : 'info' }); return; }

        if (ok && r.amount > initiatives().free) { OM.toast('Не хватает фонда командных инициатив', { icon: 'info' }); return; }
        OM.store.decideRequest(r.id, ok);
        OM.toast(ok ? `Одобрено: ${OM.fmt(r.amount)} Коинов` : 'Запрос отклонён', { icon: ok ? 'check' : 'x' });
      });
    },
  };
})();

/* js/views/office.js */
/* Экран ОТП Офиса: сцена, подсказки, отметки маршрута и быстрые переходы по зонам. */
(function () {
  'use strict';
  const OM = window.OM;
  const D = OM.DATA;
  const esc = OM.esc;
  const S = () => OM.state;
  const ICON = { reception: 'door', wardrobe: 'hanger', team: 'heart', gallery: 'trophy', academy: 'book', lab: 'bulb' };
  const MAIN_HOT = { reception: 'desk', wardrobe: 'mirror', team: 'board', gallery: 'frames', academy: 'shelf', lab: 'ideas' };
  let office = null;
  let zone = null;
  let walkTo = null;

  function hudZone() {
    if (walkTo) return `<span class="hud-pill walk-status" data-hud="zone"><span class="z-ic">${OM.icon('arrow', 16)}</span><span>Идём: ${esc(walkTo)}</span></span>`;
    const r = D.rooms.find((x) => x.id === zone);
    return `<span class="hud-pill" data-hud="zone"><span class="z-ic">${OM.icon(r ? ICON[r.id] : 'office', 16)}</span><span>${r ? esc(r.name) : 'Лифт'}</span>
      <span class="route-dots" title="Маршрут: ${S().visited.length} из 6">${D.rooms.map((x) => `<i class="${S().visited.includes(x.id) ? 'on' : ''}"></i>`).join('')}</span></span>`;
  }

  const routeCount = () => `Пройдено ${S().visited.length} из 6`;

  function zoneCards() {
    return D.rooms.map((r) => `<button class="zone ${zone === r.id ? 'here' : ''}" data-zone="${r.id}">
      <span class="zone-ic">${OM.icon(ICON[r.id], 18)}</span><b>${esc(r.name)}</b>
      ${S().visited.includes(r.id) ? `<span class="stamp-ok">${OM.icon('check', 12, 2.6)}</span>` : ''}</button>`).join('');
  }

  function act(t) {
    if (t.kind === 'gift') { OM.actions.rewardCard({ id: t.id }); return; }
    if (t.kind === 'npc') { OM.actions.profileCard({ id: t.id }); return; }
    switch (t.act) {
      case 'wardrobe': OM.toast('Добро пожаловать в примерочную', { icon: 'hanger' }); location.hash = '#/wardrobe'; break;
      case 'shop': location.hash = '#/shop'; break;
      case 'vote': location.hash = '#/vote'; break;
      case 'regions': OM.actions.regions(); break;
      case 'board': OM.actions.zone({ id: 'team' }); break;
      case 'ideas': OM.actions.zone({ id: 'lab' }); break;
      default: OM.actions.zone({ id: t.act });
    }
  }

  function firstVisit(z) {
    if (!OM.store.visit(z)) return;
    const room = D.rooms.find((r) => r.id === z);
    const unlock = D.items.filter((i) => i.src === 'route' && i.zone === z).map((i) => i.name);
    OM.toast(`${esc(room.name)}${unlock.length ? ' · открыто: ' + esc(unlock.join(', ')) : ' · отмечено'}`, { icon: 'check', ms: 3600 });
    if (OM.store.routeDone()) {
      setTimeout(() => {
        OM.fx.confetti({ n: 180 });
        OM.toast('Маршрут пройден! Открыты новые вещи', { icon: 'trophy', ms: 5200 });
      }, 900);
    }
  }

  OM.views.office = {
    title: 'ОТП Офис',
    render() {
      return `<div class="container">
        <div class="page-head"><div><h1 class="h1">ОТП Офис</h1><p class="muted mt-8">Нажмите на комнату или коллегу — аватар дойдёт сам</p></div>
          <button class="btn btn-secondary btn-icon" data-act="howItWorks" title="Как это работает" aria-label="Как это работает">${OM.icon('question', 20)}</button></div>
        <div class="card office-card">
          <div class="office-stage" data-stage></div>
          <div class="office-hud"><span data-hud-wrap>${hudZone()}</span></div>
          <div data-prompt></div>
        </div>
        <div class="section-head mt-24"><h2 class="h3">Зоны</h2><span class="small muted" data-route-count>${routeCount()}</span></div>
        <div class="zone-cards" data-zones>${zoneCards()}</div>
        <div class="grid g-2 mt-20"><div class="card"><div class="card-title">Офис — весь банк</div><p class="muted mt-12">Коллеги из регионов участвуют в признании наравне с головным офисом. Найдите специалистов по городу, соберите сообщество или предложите встречу.</p><div class="row-wrap mt-16"><a class="btn btn-secondary" href="#/colleagues">Коллеги в регионах</a><button class="btn btn-primary" data-act="supportRequest">Предложить мероприятие</button></div></div><div class="card"><div class="card-title">Уникальный опыт</div><p class="muted mt-12">Встреча с руководителем, место на стратсессии и другие редкие лоты — за накопленные Коины.</p><a class="btn btn-secondary mt-16" href="#/shop" data-auction-link>Зал аукционов</a></div></div>
      </div>`;
    },
    mount(el) {
      const prompt = el.querySelector('[data-prompt]');
      office = new OM.Office(el.querySelector('[data-stage]'), {
        onZone(z) {
          zone = z;
          firstVisit(z);
          const w = el.querySelector('[data-hud-wrap]');
          if (w) w.innerHTML = hudZone();
          const zc = el.querySelector('[data-zones]');
          if (zc) zc.innerHTML = zoneCards();
        },
        onNear(n) {
          if (!n) { prompt.innerHTML = ''; return; }
          prompt.innerHTML = `<div class="office-prompt">${n.kind === 'gift' ? OM.icon('gift', 18) : n.kind === 'npc' ? OM.icon('user', 18) : OM.icon('spark', 18)}<span>${esc(n.label)}</span><button class="btn btn-primary btn-sm" data-near title="Клавиша E">${n.kind === 'gift' ? 'Забрать' : 'Открыть'}</button></div>`;
          prompt.querySelector('[data-near]').onclick = () => act(n);
        },
        onArrive: act,
        onTarget(label) {
          walkTo = label;
          const w = el.querySelector('[data-hud-wrap]');
          if (w) w.innerHTML = hudZone();
        },
      });
      zone = office.zone;
      if (zone && !S().visited.includes(zone)) setTimeout(() => firstVisit(zone), 400);
      const w = el.querySelector('[data-hud-wrap]');
      if (w) w.innerHTML = hudZone();
      el.querySelector('[data-zones]').innerHTML = zoneCards();
      el.addEventListener('click', (e) => {
        if (e.target.closest('[data-auction-link]')) { OM.shopTab = 'auction'; return; }
        const z = e.target.closest('[data-zone]');
        if (!z || !office) return;
        const h = OM.Office.HOTS.find((x) => x.id === MAIN_HOT[z.dataset.zone]);
        office.goTo({ floor: OM.Office.zoneFloor(h.zone), x: h.x, kind: 'hot', id: h.id, act: h.act, label: h.label });
        el.querySelector('.office-card').scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
      return () => { if (office) office.destroy(); office = null; walkTo = null; };
    },
    update(el) {
      if (office) office.refresh();
      const w = el.querySelector('[data-hud-wrap]');
      if (w) w.innerHTML = hudZone();
      const zc = el.querySelector('[data-zones]');
      if (zc) zc.innerHTML = zoneCards();
      const rc = el.querySelector('[data-route-count]');
      if (rc) rc.textContent = routeCount();
    },
  };
})();
