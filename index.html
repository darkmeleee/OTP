    D.shop.communities.forEach((c) => { comm[c.id] = c.got; });
    return { v: 3, events: [], feed: [], noms: [], ideas: [], peers: [], auction: {}, cards, wishes, stock, comm,
      tasks: D.tasks.map((t) => Object.assign({ status: 'open' }, clone(t))), support: clone(D.supportEvents), sop: [], queueSeq: 15,
      adminSignals: {}, adminRequests: {}, peerDecisions: {}, fundReturns: {}, centralFundReturned: 0, teamVotes: {}, teamConfirm: {}, batches: clone(D.shop.batches), seats: Object.fromEntries(D.shop.ruSeats.map((x) => [x.id, x.left])) };
  }
  let sh = null;
  const shared = () => {
    if (!sh) {
      try { sh = JSON.parse(ls.get(SHARED) || 'null'); } catch (e) { sh = null; }
      if (!sh || sh.v !== 3) sh = sharedDefaults();
      sh = Object.assign(sharedDefaults(), sh);
    }
    return sh;
  };
  const saveShared = () => ls.set(SHARED, JSON.stringify(shared()));
  const send = (type, to, payload) => { shared().events.push(Object.assign({ id: uid('e'), type, to, from: OM.meId, t: Date.now() }, payload)); };
  OM.shared = shared;

  function defaults(acc) {
    const p = byId[acc.person];
    const st = acc.start;
    return {
      v: 3,
      account: acc.id,
      onboarded: false,
      name: p.name,
      av: clone(p.av),
      prof: clone(p.prof),
      petName: st.petName,
      pet: { growth: st.growth || 0, focusEnd: 0, sessions: 0 },
      prefs: { quiet: false, noStreak: false, vacation: false, sickLeave: false, noConfetti: false, classic: false },
      balance: { coin: st.coin, ru: st.ru },
      reserved: { coin: 0, ru: 0 },
      pending: stamp(st.pending),
      history: stamp(st.history),
      orders: stamp(st.orders),
      owned: st.owned.slice(),
      visited: [],
      streak: { weeks: st.streak, best: st.streak, done: false, week: OM.weekId(), freezes: 1, frozen: 0 },
      taskStreak: { weeks: acc.id === 'anna' ? 3 : 0, best: acc.id === 'anna' ? 3 : 0, done: false, week: OM.weekId(), freezes: 1, frozen: 0 },
      monthAward: acc.winner ? { month: monthId(), title: 'Вклад месяца' } : null,
      game: { best: st.game, plays: st.game ? 12 : 0, last: 0 },
      votes: { result: null, learning: null, enjoyment: null },
      stage: 'nominations',
      thanks: [],
      inbox: [],
      applied: [],
      toolsDone: [],
      noms: [],
      mentors: [],
      bids: {},
      peer: null,
      firstSteps: { quiz: 0, claimed: false },
      celebrated: false,
      interests: ['Данные', 'Обучение'],
      publicity: 'public',
      readNotifs: [],
      mgr: { used: 0, rec: {}, recAt: {}, reviews: D.manager.reviews.map((r) => r.id), awards: [], weekDone: false, week: OM.weekId(), peers: {}, bonus: 'me',
        fundPeriod: monthId(), openingUsed: D.manager.usedMonth, fundBuckets: [{ period: monthName(monthNumber(monthId()) - 1), amount: D.manager.carry }, { period: monthId(), amount: D.manager.fundMonth }] },
      adm: { signals: {}, requests: {} },
      seq: 1,
    };
  }

  // Неделя без благодарности сбрасывает режим, если нет заморозки; в отпуске режим замораживается сам
  function rollWeek(s) {
    const w = OM.weekId();
    [s.streak, s.taskStreak].forEach((st) => {
      if (st.week === w) return;
      const m = /^(\d{4})-W(\d{2})$/.exec(st.week || '');
      let elapsed = 1;
      if (m) {
        const jan = new Date(Date.UTC(+m[1], 0, 4));
        const monday = jan.getTime() - ((jan.getUTCDay() || 7) - 1) * DAY + (+m[2] - 1) * 7 * DAY;
        elapsed = Math.max(1, Math.floor((Date.now() - monday) / (7 * DAY)));
      }
      const missed = Math.max(0, elapsed - (st.done ? 1 : 0));
      if (s.prefs.vacation || s.prefs.sickLeave) st.frozen += missed;
      else { const frozen = Math.min(st.freezes, missed); st.freezes -= frozen; if (missed > frozen) st.weeks = 0; }
      st.week = w;
      st.done = false;
    });
    if (s.av.top === 'streak-jacket' && s.taskStreak.weeks < 3) s.av.top = 'hoodie';
    if (s.av.top === 'month-jacket' && (!s.monthAward || s.monthAward.month !== monthId())) s.av.top = 'hoodie';
    if (s.mgr.week !== w) { s.mgr.week = w; s.mgr.weekDone = false; }
  }

  // Переносятся только ещё не выданные средства руководителя. Личные балансы не затрагиваются.
  function rollFund(s) {
    const mgr = s.mgr, now = monthNumber(monthId()), previous = monthNumber(mgr.fundPeriod);
    if (!Number.isFinite(previous) || previous >= now) return false;
    let spent = Math.max(0, mgr.openingUsed + mgr.used);
    let buckets = mgr.fundBuckets.map((b) => Object.assign({}, b)).sort((a, b) => monthNumber(a.period) - monthNumber(b.period));
    buckets.forEach((b) => { const used = Math.min(b.amount, spent); b.amount -= used; spent -= used; });
    for (let period = previous + 1; period <= now; period++) {
      buckets = buckets.filter((b) => {
        if (period - monthNumber(b.period) <= 3) return true;
        const key = s.account + ':' + b.period;
        if (!shared().fundReturns[key]) {
          shared().fundReturns[key] = { amount: b.amount, at: monthName(period) };
          shared().centralFundReturned += b.amount;
        }
        return false;
      });
      buckets.push({ period: monthName(period), amount: D.manager.fundMonth });
    }
    mgr.fundBuckets = buckets; mgr.fundPeriod = monthId(); mgr.used = 0; mgr.openingUsed = 0;
    return true;
  }

  // События, адресованные этому человеку, превращаются в награды, подарки и уведомления
  function ingest(s, acc) {
    shared().events.filter((e) => e.to === acc.person && !s.applied.includes(e.id)).forEach((e) => {
      s.applied.push(e.id);
      if (e.type === 'thanks') { s.inbox.unshift({ id: e.id, from: e.from, what: e.what, help: e.help, cat: e.cat, vis: e.vis, t: e.t }); return; }
      if (e.type === 'outbid') { const n = s.bids[e.lot] || 0; s.balance.coin += n; s.reserved.coin = Math.max(0, s.reserved.coin - n); delete s.bids[e.lot]; return; }
      if (e.type === 'merch') { s.orders.unshift({ id: 'gift-' + e.id, name: e.name, kind: 'kit', receivedGift: true, from: e.from, status: 'size', t: e.t, price: 0, cur: 'coin', ref: e.ref, twin: e.twin }); return; }
      if (e.type === 'taskDone') { advanceTask(s); return; }
      const base = { id: 'p-' + e.id, from: e.from, t: e.t, cat: e.cat, text: e.text };
      if (e.type === 'award') s.pending.unshift(Object.assign(base, { kind: 'award', tier: e.tier, amount: e.amount, cur: 'ru', room: 'team' }));
      if (e.type === 'peer') s.pending.unshift(Object.assign(base, { kind: 'peer', tier: 'Peer-бонус', amount: e.amount, cur: 'coin', room: 'team' }));
      if (e.type === 'gift') s.pending.unshift(Object.assign(base, { kind: 'gift', tier: e.tier, amount: e.amount, cur: 'coin', room: 'reception' }));
      if (e.type === 'sop') s.pending.unshift(Object.assign(base, { kind: 'award', src: 'СОП · индекс признания', tier: 'Награда по оценке ' + e.score, amount: e.amount, cur: 'coin', room: 'team' }));
    });
    s.noms.forEach((n) => { const live = shared().noms.find((x) => x.id === n.id); if (live) n.status = live.status; });
  }

  function load(acc) {
    let s = null;
    const legacyId = ({ egor: 'maria', timur: 'gleb' })[acc.id] || acc.id;
    const raw = ls.get(PREFIX + acc.id) || ls.get(PREFIX + legacyId) || ls.get('otp-mania-v2:' + legacyId);
    if (raw) {
      try {
        const parsed = JSON.parse(raw);
        if (parsed && (parsed.v === 3 || parsed.v === 2)) {
          const base = defaults(acc);
          s = Object.assign({}, base, parsed, { v: 3, account: acc.id });
          ['balance', 'reserved', 'prefs', 'pet', 'streak', 'taskStreak', 'mgr', 'adm'].forEach((k) => { s[k] = Object.assign({}, base[k], parsed[k] || {}); });
          if (parsed.v === 2) { s.streak.week = OM.weekId(); s.mgr.week = OM.weekId(); }
          if (legacyId !== acc.id && (!parsed.name || parsed.name === 'Мария Соколова' || parsed.name === 'Глеб Орлов')) s.name = byId[acc.person].name;
        }
      } catch (e) { /* повреждённые данные — начинаем с чистого состояния */ }
    }
    s = s || defaults(acc);
    Object.assign(shared().adminSignals, s.adm.signals);
    Object.assign(shared().adminRequests, s.adm.requests);
    s.adm.signals = shared().adminSignals;
    s.adm.requests = shared().adminRequests;
    if (!s.av.body) s.av.body = byId[acc.person].g || 'f';
    rollWeek(s);
    if (acc.canManage) rollFund(s);
    ingest(s, acc);
    return s;
  }

  OM.account = null;
  OM.meId = null;
  OM.state = null;
  OM.save = () => { if (OM.account && OM.state) ls.set(PREFIX + OM.account.id, JSON.stringify(OM.state)); saveShared(); };
  const commit = () => { OM.save(); OM.emit('change'); };
  const S = () => OM.state;
  const grow = (n) => { S().pet.growth += n; };

  // ---------- вход и выход ----------
  OM.accounts = () => D.accounts.map((a) => Object.assign({}, a, { p: byId[a.person] }));
  OM.login = (id) => {
    const acc = accountOf(({ maria: 'egor', gleb: 'timur' })[id] || id);
    if (!acc) return false;
    OM.account = acc;
    OM.meId = acc.person;
    OM.state = load(acc);
    if (OM.store && OM.store.syncBooks) OM.store.syncBooks();
    ls.set(SESSION, acc.id);
    OM.save();
    return true;
  };
  OM.logout = () => {
    OM.save();
    ls.del(SESSION);
    OM.account = null;
    OM.meId = null;
    OM.state = null;
  };
  OM.savedState = (id) => {
    const raw = ls.get(PREFIX + id);
    try { return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
  };
  const session = ls.get(SESSION);
  if (session && accountOf(({ maria: 'egor', gleb: 'timur' })[session] || session)) OM.login(session);

  // ---------- люди ----------
  OM.isMe = (id) => id === 'me' || (!!OM.meId && id === OM.meId);
  const real = (id) => (OM.isMe(id) ? OM.meId : id);
  function meView() {
    const s = S();
    return Object.assign({}, byId[OM.meId], { id: 'me', realId: OM.meId, name: s.name, av: s.av, prof: s.prof, game: s.game.best, winner: !!OM.account.winner });
  }
  function publicState(id) {
    const acc = accountOf(id), saved = OM.isMe(id) ? S() : OM.savedState(id);
    if (!acc || !saved) return null;
    const out = Object.assign(defaults(acc), clone(saved));
    rollWeek(out);
    return out;
  }
  function managerScore(id) {
    const acc = accountOf(id);
    if (!acc || !acc.canManage) return 0;
    const state = publicState(id) || defaults(acc), mgr = state.mgr, M = D.manager;
    const cov = D.team.filter((p) => { const age = mgr.recAt && mgr.recAt[p.id] ? (Date.now() - mgr.recAt[p.id]) / DAY : (mgr.rec[p.id] != null ? mgr.rec[p.id] : p.lastRec); return age != null && age <= 30; }).length / D.team.length;
    return Math.round(35 * clamp(cov / 0.8) + 25 * clamp((M.weeks + (mgr.weekDone ? 1 : 0)) / M.weeksGoal) + 15 * (M.median <= 7 ? 1 : clamp((14 - M.median) / 7)) + 25 * (M.voiceN >= 5 ? clamp((M.voice - 3) / 1.5) : 0));
  }
  OM.person = (id) => {
    if (OM.isMe(id)) return meView();
    const p = byId[id];
    if (!p) return null;
    const st = publicState(id);
    return st ? Object.assign({}, p, { name: st.name || p.name, av: st.av || p.av, prof: st.prof || p.prof }) : p;
  };
  OM.everyone = () => [meView()].concat(D.people, D.team).filter((p) => p.id === 'me' || p.id !== OM.meId).map((p) => p.id === 'me' ? p : OM.person(p.id));
  OM.isTeam = (id) => !!OM.account && OM.account.team.includes(id);
  OM.inTeam = (id) => D.team.some((p) => p.id === real(id));
  // Руководитель получателя: у команды стрима это Егор, у остальных — их руководитель вне демо
  OM.managerOf = (id) => (OM.inTeam(id) ? 'egor' : null);
  OM.hasAccount = (id) => D.accounts.some((a) => a.person === real(id));
  OM.achOf = (id) => D.ach[real(id)] || [];
  // Публичная лента: примеры + публичные благодарности всех аккаунтов демо
  OM.feed = () => shared().feed.concat(D.feed.map((f) => Object.assign({ t: Date.now() - f.ago * DAY }, f))).sort((a, b) => b.t - a.t);
  OM.thanksOf = (id) => {
    const r = real(id);
    const seed = (D.thanks[r] || []).map((x) => Object.assign({ t: Date.now() - x.ago * DAY }, x));
    const pub = shared().feed.filter((f) => f.to === r);
    const mine = OM.isMe(id) ? [] : S().thanks.filter((t) => t.to === r && t.vis === 'team').map((t) => ({ from: 'me', cat: t.cat, what: t.what, help: t.help, t: t.t }));
    return pub.map((f) => Object.assign({}, f, { from: OM.isMe(f.from) ? 'me' : f.from })).concat(mine, seed).sort((a, b) => b.t - a.t);
  };
  OM.gameBest = () => S().game.best;
  OM.wishOf = (id) => {
    const w = shared().wishes[real(id)];
    if (!w) return null;
    const kit = D.shop.kits.find((k) => k.id === w.kit);
    return Object.assign({}, w, { kitObj: kit, got: w.from.reduce((a, x) => a + x.amount, 0) });
  };
  OM.cardOf = (id) => shared().cards[real(id)] || null;
  OM.stockOf = (kitId) => shared().stock[kitId];
  OM.titleOf = (id) => {
    const st = publicState(real(id));
    if (!st || !st.prof || !st.prof.title || st.prof.title === 'none') return '';
    const title = D.titles.find((x) => x.id === st.prof.title);
    if (!title) return '';
    if (title.id === 'month' && (!st.monthAward || st.monthAward.month !== monthId())) return '';
    if (title.id === 'rhythm' && (!st.taskStreak || st.taskStreak.weeks < 3)) return '';
    if (title.id === 'leader' && managerScore(real(id)) < 90) return '';
    return title.name;
  };
  OM.lot = (id) => {
    const l = D.shop.auction.find((x) => x.id === id);
    const st = shared().auction[id] || {};
    return Object.assign({}, l, { bid: st.bid || l.bid, by: st.by || null });
  };

  // ---------- предметы ----------
  OM.item = (slot, id) => D.items.find((i) => i.slot === slot && i.id === id);
  const key = (it) => it.slot + ':' + it.id;
  const zoneName = (id) => (D.rooms.find((r) => r.id === id) || {}).name;

  const store = {
    routeDone: () => D.rooms.every((r) => S().visited.includes(r.id)),
    hasAch: (a) => (a === 'learning' ? OM.achOf('me').some((x) => x.cat === 'learning') : a === 'winner' ? !!OM.account.winner : false),

    // Статус предмета для карточки гардероба
    itemState(it) {
      const s = S();
      if (!it) return { owned: false, kind: 'locked', label: '' };
      const n = D.rooms.length;
      switch (it.src) {
        case 'base': return { owned: true, kind: 'free', label: 'Бесплатно' };
        case 'digital':
          return s.owned.includes(key(it))
            ? { owned: true, kind: 'owned', label: 'Куплено' }
            : { owned: false, kind: 'buy', price: it.price, label: 'Только для аватара' };
        case 'kit': {
          if (s.owned.includes(key(it))) return { owned: true, kind: 'owned', label: 'С реальной вещью' };
          const kit = D.shop.kits.find((k) => k.id === it.kit);
          const open = s.orders.find((o) => o.ref === it.kit && o.status === 'queue');
          if (open) return { owned: false, kind: 'waiting', label: 'Ждёт выдачи', order: open };
          return { owned: false, kind: 'kit', price: kit.price, label: 'Комплект с вещью', kit };
        }
        case 'route':
          return s.visited.includes(it.zone)
            ? { owned: true, kind: 'free', label: 'Маршрут офиса' }
            : { owned: false, kind: 'locked', label: 'Маршрут офиса', hint: `Зайдите в зону «${zoneName(it.zone)}» в ОТП Офисе` };
        case 'routeAll': {
          const v = s.visited.length;
          return store.routeDone()
            ? { owned: true, kind: 'free', label: 'Весь маршрут' }
            : { owned: false, kind: 'locked', label: `Маршрут ${v}/${n}`, hint: `Пройдите все ${n} зон ОТП Офиса — открыто ${v} из ${n}` };
        }
        case 'streak':
          return s.streak.best >= it.need
            ? { owned: true, kind: 'free', label: `Ударный режим ${it.need} нед.` }
            : { owned: false, kind: 'locked', label: `Ударный режим ${it.need} нед.`, hint: `Благодарите хотя бы раз в неделю ${it.need} недель подряд — сейчас ${s.streak.weeks}` };
        case 'taskStreak':
          return s.taskStreak.weeks >= it.need
            ? { owned: true, kind: 'free', label: 'Пока держится серия задач' }
            : { owned: false, kind: 'locked', label: `${it.need} недели задач подряд`, hint: 'Закрывайте хотя бы одну задачу в неделю. Отпуск и больничный замораживают серию' };
        case 'monthAward':
          return s.monthAward && s.monthAward.month === monthId()
            ? { owned: true, kind: 'free', label: 'На месяц победы' }
            : { owned: false, kind: 'locked', label: 'Вклад месяца', hint: 'Образ открывается на месяц победы в «Выборе коллег»' };
        case 'game':
          return s.game.best >= it.need
            ? { owned: true, kind: 'free', label: `Забег ${it.need}` }
            : { owned: false, kind: 'locked', label: `Забег ${it.need}`, hint: `Наберите ${OM.fmt(it.need)} очков в забеге — ваш рекорд ${OM.fmt(s.game.best)}` };
        case 'event':
          return s.celebrated
            ? { owned: true, kind: 'free', label: it.event }
            : { owned: false, kind: 'locked', label: it.event, hint: 'Откроется, когда заберёте награду за стаж. Купить нельзя' };
        case 'ach':
          return store.hasAch(it.ach)
            ? { owned: true, kind: 'free', label: 'За вклад' }
            : { owned: false, kind: 'locked', label: 'За вклад', hint: `${it.how}. Знак за вклад нельзя купить` };
        default: return { owned: false, kind: 'locked', label: '' };
      }
    },

    // ---------- бонусы ----------
    claim(id) {
      const s = S();
      const i = s.pending.findIndex((p) => p.id === id);
      if (i < 0) return null;
      const p = s.pending.splice(i, 1)[0];
      s.balance[p.cur] += p.amount;
      const src = p.src || { award: 'От руководителя', peer: 'Peer-бонус', gift: 'Подарок коллеги' }[p.kind] || 'Ваш праздник в ОТП';
      const from = p.from ? OM.person(p.from) : null;
      s.history.unshift({ id: uid('h'), t: Date.now(), title: p.kind === 'award' ? `${p.tier}: ${p.text}` : p.kind === 'event' ? p.text : `${p.tier}${from ? ' · ' + from.name : ''}`, src, amt: p.amount, cur: p.cur });
      if (p.tenure) s.celebrated = true;
      grow(1);
      commit();
      return p;
    },
    convert(n) {
      const s = S();
      n = Math.floor(n);
      if (!validAmount(n) || n > s.balance.ru) return false;
      s.balance.ru -= n;
      s.balance.coin += n;
      const t = Date.now();
      s.history.unshift({ id: uid('h'), t, title: 'Обмен РуКоинов на Коины', src: 'Обмен', amt: n, cur: 'coin' });
      s.history.unshift({ id: uid('h'), t, title: 'Обмен РуКоинов на Коины', src: 'Обмен', amt: -n, cur: 'ru' });
      commit();
      return true;
    },
    buy(it) {
      const s = S();
      if (!it || it.src !== 'digital' || !validAmount(it.price)) return false;
      if (s.owned.includes(key(it))) return true;
      if (s.balance.coin < it.price) return false;
      s.balance.coin -= it.price;
      s.owned.push(key(it));
      s.history.unshift({ id: uid('h'), t: Date.now(), title: `${it.name} — цифровой предмет`, src: 'Гардероб', amt: -it.price, cur: 'coin' });
      commit();
      return true;
    },
    // Сертификаты: не больше 3 в одни руки и один заказ за окно
    // Бронь сертификата до выкладки партии: Коины замораживаются, партию распределяют по броням, а не «кто первый успел»
    batch(ref) { return shared().batches[ref] || null; },
    seatsLeft(id) { const v = shared().seats[id]; return v != null ? v : ((D.shop.ruSeats.find((x) => x.id === id) || {}).left || 0); },
    bookCert(ref) {
      const s = S(), c = D.shop.certs.find((x) => x.id === ref), b = store.batch(ref);
      if (!c || !b || b.released || store.certCheck() || s.balance.coin < c.price) return null;
      s.balance.coin -= c.price;
      s.reserved.coin += c.price;
      b.booked += 1;
      const ord = { id: uid('o-'), t: Date.now(), kind: 'cert', ref, name: `Сертификат «${c.name}» ${OM.fmt(c.nominal)} ₽`, price: c.price, cur: 'coin', own: c.price, pot: 0, status: 'booked', batch: b.date, place: b.booked };
      s.orders.unshift(ord);
      s.history.unshift({ id: uid('h'), t: Date.now(), title: `Бронь до партии: ${ord.name}`, src: 'Магазин', amt: -c.price, cur: 'coin' });
      grow(1);
      commit();
      return ord;
    },
    // HR выкладывает партию: броней не больше партии — получают все, иначе жребий среди броней
    releaseBatch(ref) {
      const b = store.batch(ref);
      if (!b || b.released) return null;
      Object.assign(b, { released: true, at: Date.now(), lottery: b.booked > b.size });
      store.syncBooks();
      commit();
      return b;
    },
    // Разбор своих броней после выкладки; вызывается и при входе в аккаунт
    syncBooks() {
      const s = S();
      if (!s) return false;
      let changed = false;
      const back = (o, title) => {
        s.reserved.coin = Math.max(0, s.reserved.coin - o.own);
        s.balance.coin += o.own;
        s.history.unshift({ id: uid('h'), t: Date.now(), title, src: 'Магазин', amt: o.own, cur: 'coin' });
      };
      s.orders.forEach((o) => {
        if (o.status === 'booked') {
          const b = store.batch(o.ref);
          if (!b || !b.released) return;
          let h = 0;
          for (const ch of o.id) h = (h * 31 + ch.charCodeAt(0)) % 1000;
          if (!b.lottery || h / 1000 < b.size / b.booked) Object.assign(o, { status: 'offer', until: Date.now() + 48 * 36e5 });
          else { o.status = 'lost'; back(o, `Жребий: ${o.name} — Коины вернулись, в следующей партии вы первые`); }
          changed = true;
        } else if (o.status === 'offer' && Date.now() > o.until) {
          o.status = 'expired';
          back(o, `Время подтверждения вышло: ${o.name}`);
          changed = true;
        }
      });
      return changed;
    },
    confirmCert(id) {
      const o = S().orders.find((x) => x.id === id && x.status === 'offer');
      if (!o) return null;
      shared().queueSeq += 1;
      Object.assign(o, { status: 'queue', place: shared().queueSeq, t: Date.now() });
      commit();
      return o;
    },
    certCheck() {
      const list = S().orders.filter((o) => o.kind === 'cert' && !['cancelled', 'lost', 'expired'].includes(o.status));
      if (list.length >= D.shop.certLimit) return `Не больше ${D.shop.certLimit} сертификатов в одни руки`;
      if (list.some((o) => sameMonth(o.t))) return 'Один сертификат за окно — следующий в декабрьском';
      return '';
    },
    // Заказ бронирует коины: доступный баланс уменьшается, списание — при выдаче.
    // Если это вещь из вишлиста, сначала тратятся коины, которые скинули коллеги
    order(o) {
      const s = S();
      if (!o || !validAmount(o.price) || !['coin', 'ru'].includes(o.cur)) return null;
      if (o.kind === 'cert' && store.certCheck()) return null;
      if (o.kind === 'kit' && !(shared().stock[o.ref] > 0)) return null;
      if (o.kind === 'seat' && (!(store.seatsLeft(o.ref) > 0) || s.orders.some((x) => x.ref === o.ref && x.status !== 'cancelled'))) return null;
      if (o.kind === 'priv' && o.ref === 'pv-dayoff' && s.orders.filter((x) => x.ref === o.ref && x.status !== 'cancelled' && new Date(x.t).getFullYear() === new Date().getFullYear()).length >= 2) return null;
      const wish = o.kind === 'kit' && !o.gift ? OM.wishOf('me') : null;
      const pot = wish && wish.kit === o.ref ? Math.min(o.price, wish.got) : 0;
      const own = o.price - pot;
      if (s.balance[o.cur] < own) return null;
      if (pot && wish.reserved) return null;
      s.balance[o.cur] -= own;
      s.reserved[o.cur] += own;
      shared().queueSeq += 1;
      const ord = Object.assign({}, o, { id: uid('o-'), t: Date.now(), status: 'queue', place: shared().queueSeq, own, pot });
      if (pot) shared().wishes[OM.meId].reserved = ord.id;
      s.seq += 1;
      s.orders.unshift(ord);
      if (o.kind === 'kit' && shared().stock[o.ref] > 0) shared().stock[o.ref] -= 1;
      if (o.kind === 'seat') shared().seats[o.ref] = store.seatsLeft(o.ref) - 1;
      s.history.unshift({ id: uid('h'), t: Date.now(), title: `Забронировано: ${o.name}`, src: o.cur === 'ru' ? 'Витрина РуКоинов' : 'Магазин', amt: -own, cur: o.cur });
      grow(1);
      commit();
      return ord;
    },
    fulfill(id) {
      const s = S();
      const o = s.orders.find((x) => x.id === id);
      if (!o || o.status !== 'queue') return null;
      o.status = 'done';
      o.done = Date.now();
      s.reserved[o.cur] = Math.max(0, s.reserved[o.cur] - (o.own != null ? o.own : o.price));
      if (o.pot) delete shared().wishes[OM.meId];
      if (o.twin && !o.gift && !s.owned.includes(o.twin)) s.owned.push(o.twin);
      if (o.twin && o.gift && o.to && byId[o.to]) send('merch', o.to, { twin: o.twin, name: o.name, ref: o.ref });
      commit();
      return o;
    },
    cancel(id) {
      const s = S();
      const o = s.orders.find((x) => x.id === id);
      if (!o || !['queue', 'booked', 'offer'].includes(o.status)) return null;
      const own = o.own != null ? o.own : o.price;
      if (o.status === 'booked') { const b = store.batch(o.ref); if (b) b.booked = Math.max(0, b.booked - 1); }
      o.status = 'cancelled';
      s.reserved[o.cur] = Math.max(0, s.reserved[o.cur] - own);
      s.balance[o.cur] += own;
      if (o.kind === 'kit') shared().stock[o.ref] += 1;
      if (o.kind === 'seat') shared().seats[o.ref] = store.seatsLeft(o.ref) + 1;
      if (o.pot && shared().wishes[OM.meId]) delete shared().wishes[OM.meId].reserved;
      if (o.kind === 'support') { const ev = shared().support.find((x) => x.id === o.ref); if (ev) ev.booked = Math.max(0, (ev.booked || 0) - 1); }
      s.history.unshift({ id: uid('h'), t: Date.now(), title: `Бронь снята: ${o.name}`, src: 'Магазин', amt: own, cur: o.cur });
      commit();
      return o;
    },
    rateOrder(id, n) {
      const o = S().orders.find((x) => x.id === id);
      if (!o || o.status !== 'done' || o.rating) return;
      o.rating = n;
      commit();
    },
    receiveGift(id, size) {
      const o = S().orders.find((x) => x.id === id && x.receivedGift && x.status === 'size');
      const kit = o && D.shop.kits.find((x) => x.id === o.ref);
      if (!o || !kit || !(kit.sizes || ['One size']).includes(size)) return false;
      o.size = size; o.status = 'done'; o.done = Date.now();
      if (o.twin && !S().owned.includes(o.twin)) S().owned.push(o.twin);
      commit(); return true;
    },

    // ---------- коины между коллегами ----------
    // Подарок коллеге: до 5 000 Коинов в месяц, встречные переводы ловит админка
    giftLeft() {
      const sent = S().history.filter((h) => h.src === 'Подарок коллеге' && sameMonth(h.t)).reduce((a, h) => a - h.amt, 0);
      return Math.max(0, 5000 - sent);
    },
    transfer(to, amount, note) {
      const s = S();
      amount = Math.floor(amount);
      if (!byId[to] || OM.isMe(to) || !validAmount(amount) || amount > s.balance.coin || amount > store.giftLeft()) return false;
      s.balance.coin -= amount;
      s.history.unshift({ id: uid('h'), t: Date.now(), title: `Подарок · ${OM.person(to).name}`, src: 'Подарок коллеге', amt: -amount, cur: 'coin' });
      send('gift', to, { tier: 'Подарок коллеги', amount, text: note || 'Подарок от коллеги' });
      grow(1);
      commit();
      return true;
    },
    setWish(kitId) {
      const w = shared().wishes[OM.meId];
      if (w && w.kit === kitId) return true;
      if (w && w.reserved) return false;
      if (!D.shop.kits.some((k) => k.id === kitId) || (w && w.kit !== kitId && w.from.length)) return false;
      shared().wishes[OM.meId] = { kit: kitId, from: w && w.kit === kitId ? w.from : [] };
      commit();
      return true;
    },
    chip(owner, amount, note) {
      const s = S();
      const w = shared().wishes[owner];
      amount = Math.floor(amount);
      if (!w || OM.isMe(owner) || w.reserved || !validAmount(amount) || amount > s.balance.coin || amount > store.giftLeft()) return false;
      const kit = D.shop.kits.find((k) => k.id === w.kit);
      if (amount > kit.price - w.from.reduce((n, x) => n + x.amount, 0)) return false;
      w.from.push({ who: OM.meId, amount, note: note || '', t: Date.now() });
      s.balance.coin -= amount;
      s.history.unshift({ id: uid('h'), t: Date.now(), title: `Скинулись на «${kit.name}» · ${OM.person(owner).name}`, src: 'Подарок коллеге', amt: -amount, cur: 'coin' });
      // Взнос остаётся в копилке желания; второе зачисление на баланс создавало бы лишние коины.
      grow(1);
      commit();
      return true;
    },
    signCard(owner, text, coins) {
      const s = S();
      const c = shared().cards[owner];
      coins = Math.floor(coins || 0);
      if (!c || OM.isMe(owner) || !clean(text) || !Number.isSafeInteger(coins) || coins < 0 || coins > s.balance.coin || coins > store.giftLeft() || c.signs.some((x) => x.who === OM.meId)) return false;
      c.signs.push({ who: OM.meId, text, coins, t: Date.now() });
      if (coins > 0) {
        s.balance.coin -= coins;
        s.history.unshift({ id: uid('h'), t: Date.now(), title: `Открытка · ${OM.person(owner).name}`, src: 'Подарок коллеге', amt: -coins, cur: 'coin' });
        send('gift', owner, { tier: 'Открытка от команды', amount: coins, text: c.title });
      }
      grow(2);
      commit();
      return true;
    },
    community(id, amount) {
      const s = S();
      const c = D.shop.communities.find((x) => x.id === id);
      amount = Math.floor(amount);
      if (!c || !validAmount(amount) || amount > s.balance.coin || amount > c.goal - shared().comm[id]) return false;
      s.balance.coin -= amount;
      shared().comm[id] = Math.min(c.goal, shared().comm[id] + amount);
      s.history.unshift({ id: uid('h'), t: Date.now(), title: `Сообществу «${c.name}»`, src: 'Сообщества', amt: -amount, cur: 'coin' });
      grow(1);
      commit();
      return true;
    },
    // Аукцион: ставка бронирует коины, перебили — бронь возвращается
    bid(id) {
      const s = S();
      if (!D.shop.auction.some((x) => x.id === id)) return 'invalid';
      const l = OM.lot(id);
      if (l.by === OM.meId) return 'lead';
      const next = l.bid + l.step;
      const cur = l.cur || 'coin';
      if (s.balance[cur] < next) return 'money';
      s.balance[cur] -= next;
      s.reserved[cur] += next;
      s.bids[id] = next;
      if (l.by) send('outbid', l.by, { lot: id });
      shared().auction[id] = { bid: next, by: OM.meId, t: Date.now() };
      commit();
      return 'ok';
    },
    outbid(id, by) {
      const s = S();
      const l = OM.lot(id);
      if (l.by !== OM.meId) { shared().auction[id] = { bid: l.bid + l.step, by, t: Date.now() }; saveShared(); return false; }
      const mine = s.bids[id] || 0;
      const cur = l.cur || 'coin';
      s.balance[cur] += mine;
      s.reserved[cur] = Math.max(0, s.reserved[cur] - mine);
      delete s.bids[id];
      shared().auction[id] = { bid: l.bid + l.step, by, t: Date.now() };
      commit();
      return true;
    },

    // ---------- признание ----------
    thank(t) {
      const s = S();
      if (!t || !byId[t.to] || OM.isMe(t.to) || !D.cats[t.cat] || !clean(t.what) || !clean(t.help)) return false;
      // Публичность решает получатель: благодарность не может быть публичнее его настройки
      const VIS = ['private', 'team', 'public'];
      const racc = D.accounts.find((a) => a.person === t.to);
      const pref = racc ? ((OM.savedState(racc.id) || {}).publicity || 'public') : (byId[t.to].publicity || 'public');
      t = Object.assign({}, t, { vis: VIS[Math.min(Math.max(0, VIS.indexOf(t.vis || 'public')), Math.max(0, VIS.indexOf(pref)))] });
      rollWeek(s);
      const at = Date.now();
      const norm = (x) => clean(x).toLowerCase().replace(/\s+/g, ' ');
      const substantive = clean(t.what).length >= 12 && clean(t.help).length >= 12;
      const duplicate = s.thanks.some((x) => at - x.t < 30 * DAY && norm(x.what) === norm(t.what) && norm(x.help) === norm(t.help));
      s.thanks.unshift(Object.assign({ t: at }, t));
      if (!s.streak.done) { s.streak.done = true; s.streak.weeks += 1; s.streak.best = Math.max(s.streak.best, s.streak.weeks); }
      // В охват руководителя идёт только спасибо с ответами на оба вопроса
      if (OM.account.canManage && OM.isTeam(t.to) && substantive && !duplicate) { s.mgr.rec[t.to] = 0; s.mgr.recAt[t.to] = at; s.mgr.weekDone = true; }
      if (t.tool) s.toolsDone.push(t.tool);
      if (t.vis === 'public') shared().feed.unshift({ from: OM.meId, to: t.to, cat: t.cat, what: t.what, help: t.help, t: at });
      send('thanks', t.to, { what: t.what, help: t.help, cat: t.cat, vis: t.vis });
      grow(2);
      commit();
      return true;
    },
    // «Выбор коллег» без привязки к «спасибо»: в каждой номинации пул — вся команда
    teamPool() {
      const own = OM.account.team.filter((id) => byId[id]);
      const pool = own.length >= 3 ? own : Array.from(new Set(own.concat(D.team.map((p) => p.id))));
      return pool.filter((id) => !OM.isMe(id));
    },
    teamTally(cat) {
      const tally = {};
      const add = (who, n, why) => { const x = tally[who] || (tally[who] = { who, n: 0, reasons: [] }); x.n += n; if (why) x.reasons.push(why); };
      (D.teamVotes[cat] || []).forEach(([who, n, why]) => add(who, n, why));
      Object.keys(shared().teamVotes).forEach((acc) => { const v = shared().teamVotes[acc][cat]; if (v) add(v.who, 1, v.why); });
      const list = Object.values(tally).sort((a, b) => b.n - a.n);
      return { list, total: list.reduce((a, b) => a + b.n, 0) };
    },
    myTeamVote(cat) { return (shared().teamVotes[OM.meId] || {})[cat] || null; },
    teamVote(cat, who, why) {
      why = clean(why, 200);
      if (S().stage !== 'nominations') return 'Голосование в команде идёт с 1 по 10 число';
      if (!D.cats[cat]) return 'Выберите номинацию';
      if (OM.isMe(who)) return 'За себя голосовать нельзя';
      if (!store.teamPool().includes(who)) return 'Выберите коллегу из своей команды';
      if (why.length < 12) return 'Напишите, за что голосуете, — не меньше 12 символов';
      const mine = shared().teamVotes[OM.meId] || (shared().teamVotes[OM.meId] = {});
      if (!mine[cat]) grow(1);
      mine[cat] = { who, why, t: Date.now() };
      commit();
      return true;
    },
    // Номинант команды — больше всего голосов; в финал выходит после подтверждения руководителя
    teamNominee(cat) {
      const { list, total } = store.teamTally(cat);
      if (!list.length) return null;
      return Object.assign({ total, status: shared().teamConfirm[cat] || 'wait' }, list[0]);
    },
    confirmNominee(cat, ok) {
      if (!OM.account.canManage || !D.cats[cat]) return false;
      shared().teamConfirm[cat] = ok ? 'ok' : 'details';
      commit();
      return true;
    },
    // Финал банка: номинанты других команд плюс номинант нашей команды
    finalists(cat) {
      const ours = D.team.map((p) => p.id);
      const all = D.finalists[cat] || [];
      const list = all.filter((f) => !ours.includes(f.who));
      const nom = store.teamNominee(cat);
      if (!nom || nom.status === 'details') return list;
      const known = all.find((f) => f.who === nom.who);
      return list.concat([known || { id: 'team-' + cat, who: nom.who, title: nom.reasons[0] || 'Выбор команды', text: nom.reasons[1] || '', res: `Выбор команды: ${nom.n} из ${nom.total} голосов`, parts: [nom.who] }]);
    },
    vote(cat, fid) {
      const s = S();
      const f = store.finalists(cat).find((x) => x.id === fid);
      if (s.stage !== 'voting' || !f || [f.who].concat(f.parts || []).some((id) => OM.isMe(id) || OM.isTeam(id))) return false;
      s.votes[cat] = s.votes[cat] === fid ? null : fid;
      commit();
      return true;
    },
    setStage(st) { S().stage = st; commit(); },
    // Peer-бонус раз в квартал; взаимные — не раньше чем через полгода
    peerCheck(to) {
      const s = S();
      if (!byId[to] || OM.isMe(to)) return 'Выберите другого сотрудника';
      if (s.peer && s.peer.q === quarterId()) return 'Peer-бонус уже отправлен в этом квартале';
      if (shared().peers.some((x) => x.from === to && x.to === OM.meId && Date.now() - x.t < 183 * DAY)) return 'Взаимный peer-бонус — не раньше чем через полгода';
      return '';
    },
    peer(to, note) {
      if (store.peerCheck(to) || clean(note).length < 12) return false;
      shared().peers.unshift({ id: uid('pq'), from: OM.meId, to, note, t: Date.now(), status: 'pending' });
      S().peer = { q: quarterId(), to };
      grow(2);
      commit();
      return true;
    },
    addIdea(title) {
      title = clean(title, 300);
      if (!title) return false;
      shared().ideas.unshift({ title, author: OM.meId, status: 'review', note: 'На рассмотрении', t: Date.now() });
      grow(1);
      commit();
      return true;
    },
    mentor(name) {
      const mentor = D.mentors.find((m) => m.who === name || byId[m.who].name === name);
      if (!mentor || S().mentors.includes(byId[mentor.who].name)) return false;
      S().mentors.push(byId[mentor.who].name); commit(); return true;
    },

    // ---------- руководитель ----------
    teamRec(p) {
      const t = S().mgr.recAt[p.id];
      if (t) return Math.floor((Date.now() - t) / DAY);
      const o = S().mgr.rec[p.id];
      return o != null ? o : p.lastRec;
    },
    coverage() {
      const covered = D.team.filter((p) => { const r = store.teamRec(p); return r != null && r <= 30; }).length;
      return { covered, total: D.team.length, pct: covered / D.team.length };
    },
    // Фонд по 1/12 в месяц с переносом до трёх месяцев
    fund() {
      const M = D.manager;
      if (rollFund(S())) OM.save();
      const mgr = S().mgr;
      const used = mgr.openingUsed + mgr.used;
      const carry = mgr.fundBuckets.filter((b) => b.period !== mgr.fundPeriod).reduce((n, b) => n + b.amount, 0);
      return { month: M.fundMonth, carry, used, left: Math.max(0, M.fundMonth + carry - used) };
    },
    fundLeft: () => store.fund().left,
    // Индекс признания: охват, регулярность, скорость и голос команды; сумма наград не входит
    index(extra) {
      const M = D.manager;
      const s = S();
      const cov = store.coverage();
      const pct = (cov.covered + ((extra && extra.cover) || 0)) / cov.total;
      const weeks = M.weeks + (s.mgr.weekDone || (extra && extra.week) ? 1 : 0);
      const parts = [
        { id: 'cov', name: 'Охват', w: 35, score: clamp(pct / 0.8), now: Math.round(pct * 100) + '%', goal: 'цель 80% команды' },
        { id: 'reg', name: 'Регулярность', w: 25, score: clamp(weeks / M.weeksGoal), now: `${weeks} из ${M.quarterWeeks} недель`, goal: 'цель 10 недель' },
        { id: 'speed', name: 'Скорость', w: 15, score: M.median <= 7 ? 1 : clamp((14 - M.median) / 7), now: `${M.median} ${OM.plural(M.median, ['день', 'дня', 'дней'])}`, goal: 'цель до 7 дней' },
        { id: 'voice', name: 'Голос команды', w: 25, score: M.voiceN >= 5 ? clamp((M.voice - 3) / 1.5) : 0, now: M.voiceN >= 5 ? `${OM.num(M.voice, 1)} из 5` : 'Недостаточно ответов', goal: 'цель от 4,5 · минимум 5 ответов' },
      ];
      const value = Math.round(parts.reduce((a, p) => a + p.w * p.score, 0));
      let tier = null;
      D.indexTiers.forEach((t) => { if (value >= t.from) tier = t; });
      if (M.voice < 3.5 && tier && tier.id !== 'notice') tier = D.indexTiers[0];
      return { value, tier, parts, pct, weeks };
    },
    // Кого отметить, чтобы индекс вырос: самые давние без признания
    indexHint() {
      const quiet = D.team.filter((p) => !p.isNew).map((p) => ({ p, r: store.teamRec(p) })).filter((x) => x.r == null || x.r > 30).sort((a, b) => b.r - a.r).slice(0, 3);
      return { people: quiet.map((x) => x.p), after: store.index({ cover: quiet.length, week: true }) };
    },
    award(a) {
      const s = S();
      if (!OM.account.canManage || !a || !byId[a.who] || OM.isMe(a.who) || !D.cats[a.cat] || clean(a.text).length < 12) return { ok: false, reason: 'invalid' };
      if (a.review && !store.reviews().some((x) => x.id === a.review)) return { ok: false, reason: 'review' };
      const tr = D.awardTiers.find((x) => x.id === a.tier);
      if (!tr) return { ok: false };
      if (tr.amount > store.fundLeft()) return { ok: false, reason: 'fund' };
      const before = store.index();
      const team = OM.isTeam(a.who);
      s.mgr.used += tr.amount;
      if (team) { s.mgr.rec[a.who] = 0; s.mgr.recAt[a.who] = Date.now(); s.mgr.weekDone = true; }
      s.mgr.awards.unshift(Object.assign({ t: Date.now(), amount: tr.amount }, a));
      if (a.review) {
        s.mgr.reviews = s.mgr.reviews.filter((r) => r !== a.review);

/* Лёгкие SVG-графики для кабинета руководителя: тонкие метки, волосяная сетка, подсказки при наведении. */
(function () {
  'use strict';
  const OM = (window.OM = window.OM || {});

  const GRID = '#E4E6E9';
  const AXIS = '#717171';
  const SURFACE = '#F3F4F6';
  // Последовательная шкала одного оттенка: от светлого к тёмному
  const RAMP = ['#E6E8EB', '#D4EEA0', '#A8D84E', '#76B41F', '#4F8A00'];

  const k = (n) => (Math.abs(n) >= 1000 ? (n / 1000).toLocaleString('ru-RU', { maximumFractionDigits: 1 }) + ' тыс.' : String(n));
  function niceMax(v) {
    if (v <= 0) return 1;
    const p = Math.pow(10, Math.floor(Math.log10(v)));
    const m = v / p;
    const step = m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10;
    return step * p;
  }
  // Столбец со скруглённым верхом и прямым основанием

  }

  const charts = {
    RAMP,
    bars(o) {
      const W = 640, H = o.h || 230;
      const L = 56, R = 12, T = 22, B = 30;
      const pw = W - L - R, ph = H - T - B;
      const data = o.data;
      const max = niceMax(Math.max.apply(null, data.map((d) => d[1]).concat(o.ref || 0)) * 1.08);
      const band = pw / data.length;
      const bw = Math.min(24, band * 0.56);
      const y = (v) => T + ph - (v / max) * ph;
      const fmt = o.fmt || OM.fmt;
      let s = '';
      [0, 0.5, 1].forEach((f) => {
        const v = max * f;
        s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="${GRID}" stroke-width="1"/>`;
        s += `<text x="${L - 10}" y="${y(v) + 4}" text-anchor="end" font-size="12" fill="${AXIS}" class="tnum">${o.tick ? o.tick(v) : k(v)}</text>`;
      });
      if (o.ref) {
        s += `<line x1="${L}" x2="${W - R}" y1="${y(o.ref)}" y2="${y(o.ref)}" stroke="#222" stroke-width="1" opacity=".55"/>`;
        s += `<text x="${L + 6}" y="${y(o.ref) - 6}" font-size="12" fill="#333">${o.refLabel || ''}</text>`;
      }
      const maxI = data.reduce((a, d, i) => (d[1] > data[a][1] ? i : a), 0);
      data.forEach((d, i) => {
        const cx = L + band * i + band / 2;

        const fill = o.highlightLast && !last ? (o.mute || '#B9DC7A') : (o.color || '#5E9E00');
        s += `<path d="${colPath(cx - bw / 2, top, bw, T + ph - top, 4)}" fill="${fill}"/>`;
        if (last || i === maxI) s += `<text x="${cx}" y="${top - 7}" text-anchor="middle" font-size="12" font-weight="500" fill="#222" class="tnum">${fmt(d[1])}</text>`;
        s += `<text x="${cx}" y="${H - 8}" text-anchor="middle" font-size="12" fill="${AXIS}">${d[0]}</text>`;
        s += `<rect x="${cx - band / 2}" y="${T}" width="${band}" height="${ph}" fill="transparent" tabindex="0" data-tip="<b>${d[0]}</b><br>${fmt(d[1])}${o.unit ? ' ' + o.unit : ''}"/>`;
      });
      return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${OM.esc(o.label || '')}">${s}</svg>`;
    },

    line(o) {
      const W = 640, H = o.h || 210;
      const L = 44, R = 64, T = 20, B = 30;
      const pw = W - L - R, ph = H - T - B;
      const data = o.data;
      const max = o.yMax || niceMax(Math.max.apply(null, data.map((d) => d[1])));
      const x = (i) => L + (pw * i) / (data.length - 1);
      const y = (v) => T + ph - (v / max) * ph;

/* «Забег по офису»: аватар в текущем образе перепрыгивает препятствия, питомец бежит следом.
   Игра не начисляет Коины — только рекорд в профиле и предметы оформления за рубежи. */
(function () {
  'use strict';
  const OM = (window.OM = window.OM || {});

  function toImg(svg) {
    return new Promise((res, rej) => {
      const img = new Image();
      img.onload = () => res(img);
      img.onerror = rej;
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    });
  }

  const OBST = [
    { id: 'docs', w: 36, h: 30, min: 0 },
    { id: 'coffee', w: 24, h: 34, min: 0 },
    { id: 'cone', w: 28, h: 38, min: 0 },
    { id: 'plant', w: 30, h: 50, min: 120 },
    { id: 'printer', w: 54, h: 34, min: 220 },
    { id: 'chair', w: 38, h: 48, min: 320 },
    { id: 'deadline', w: 36, h: 60, min: 450 },
  ];

  function rr(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);

  }

  class Runner {
    constructor(wrap, opt) {
      this.wrap = wrap;
      this.opt = opt || {};
      this.canvas = wrap.querySelector('canvas');
      this.ctx = this.canvas.getContext('2d');
      this.overlay = wrap.querySelector('.runner-overlay');
      this.state = 'loading';
      this.best = this.opt.best || 0;
      this.loop = this.loop.bind(this);
      this.onKey = this.onKey.bind(this);
      this.onKeyUp = this.onKeyUp.bind(this);
      this.onPointer = this.onPointer.bind(this);
      this.onPointerUp = this.onPointerUp.bind(this);
      this.onVis = () => { if (document.hidden && this.state === 'run') this.pause(); };
      this.ro = new ResizeObserver(() => this.resize());
      this.ro.observe(wrap);
      wrap.addEventListener('pointerdown', this.onPointer);
      // Курсор над игрой — пробел сразу запускает забег, без лишнего клика
      wrap.addEventListener('mouseenter', () => { try { wrap.focus({ preventScroll: true }); } catch (e) { /* ничего */ } });
      window.addEventListener('pointerup', this.onPointerUp);
      window.addEventListener('keydown', this.onKey);
      window.addEventListener('keyup', this.onKeyUp);
      document.addEventListener('visibilitychange', this.onVis);
      this.overlay.addEventListener('click', (e) => {
        const b = e.target.closest('[data-run]');
        if (!b) return;
        if (b.dataset.run === 'resume') this.resume(); else this.start();
      });
      this.reset();
      this.resize();
      this.load().then(() => {
        if (this.state === 'dead') return;
        this.state = 'ready';
        this.draw();
        this.show('ready');
      }).catch(() => { this.state = 'ready'; this.show('ready'); });
    }

    async load() {
      const av = this.opt.av;
      const mk = (pose) => toImg(OM.avatar.svg(av, { view: 'full', pose, shadow: false, raster: [400, 640] }));
      const imgs = await Promise.all([mk('run1'), mk('run2'), mk('jump'), mk('stand')]);
      [this.run1, this.run2, this.jumpImg, this.standImg] = imgs;

      }

    resize() {

      if (!r.width) return;

      this.score = 0; this.bonus = 0; this.dist = 0; this.t = 0;
      this.speed = 360; this.spawnIn = 1.2; this.starIn = 2.6;

      this.cityOff = 0; this.midOff = 0; this.groundOff = 0;

    buildWorld() {
      const city = [];
      let x = 0;
      while (x < 1600) {
        const w = 40 + Math.random() * 70;
        city.push({ x, w, h: 34 + Math.random() * 70, win: Math.random() < 0.75 });
        x += w + 6 + Math.random() * 16;
      }
      this.city = city; this.cityW = x;
      const mid = [];
      x = 260;
      while (x < 2600) {
        const otp = Math.random() < 0.22;
        mid.push({ x, type: otp ? 'otp' : 'tree', s: 0.8 + Math.random() * 0.45 });
        x += otp ? 420 : 140 + Math.random() * 170;
      }
      this.mid = mid; this.midW = x;

    }

    // ---------- управление ----------
    jump() {
      if (this.y <= 0.5 && this.vy <= 0) {
        this.vy = 930 * Math.sqrt(this.sc);

        this.held = true;
        this.buffer = 0;

    release() {

    }
    typing(e) {
      const t = e.target;

    }
    onKey(e) {
      if (!['Space', 'ArrowUp', 'KeyW'].includes(e.code) || this.typing(e)) return;
      if (this.state === 'run') { e.preventDefault(); if (!e.repeat) this.jump(); return; }
      if ((this.state === 'ready' || this.state === 'over') && document.activeElement === this.wrap) { e.preventDefault(); this.start(); }
      if (this.state === 'paused' && document.activeElement === this.wrap) { e.preventDefault(); this.resume(); }

    onKeyUp(e) { if (['Space', 'ArrowUp', 'KeyW'].includes(e.code) && this.state === 'run') this.release(); }
    onPointer(e) {
      if (e.target.closest('button')) return;
      if (this.state === 'run') { e.preventDefault(); this.jump(); }
      else if (this.state === 'ready' || this.state === 'over') this.start();
      else if (this.state === 'paused') this.resume();

    onPointerUp() { if (this.state === 'run') this.release(); }

    start() {

    hitbox() {

    update(dt) {

      this.speed = Math.min(840, 360 + this.t * 12);
      const g = 2700 * sc;
      // игрок
      if (this.y > 0 || this.vy > 0) {

      if (this.py > 0 || this.pvy > 0) {

      const dx = this.speed * dt;

      this.score = Math.floor(this.dist / 14) + this.bonus;

      this.clouds.forEach((c) => { c.x -= dx * 0.05; if (c.x < -120) c.x += this.W + 240; });

      this.spawnIn -= dt;

        const o = pool[(Math.random() * pool.length) | 0];

        const airtime = (2 * 930) / (2700 * Math.sqrt(sc));
        this.spawnIn = Math.max(airtime + 0.12, 1.25 - this.speed / 1400) + Math.random() * 0.8;

      if (this.starIn <= 0) {

      this.obs.forEach((o) => { o.x -= dx; });
      this.obs = this.obs.filter((o) => o.x + o.w > -30);
      this.stars.forEach((s) => { s.x -= dx; });
      this.stars = this.stars.filter((s) => s.x > -30 && !s.got);

    over() {

    // ---------- отрисовка ----------

            c.fillStyle = '#222';
            c.font = `700 ${13 * s}px Onest, system-ui, sans-serif`;
            c.textAlign = 'center';
            c.fillText('отп', x + 52 * s, gy - bh - 1 * s);

      // звёзды
      this.stars.forEach((s) => {

        c.fillStyle = '#222';
        c.fillText('+25', p.x, p.y);
      });

      c.textAlign = 'right';
      c.fillStyle = '#717171';
      c.font = '500 14px Onest, system-ui, sans-serif';

      c.fillStyle = '#222';
      c.font = '600 22px Onest, system-ui, sans-serif';
      c.fillText(OM.fmt(this.score), W - 16, 52);

    star(c, x, y, r) {

      c.translate(x, y);
      c.beginPath();

        `</g></g>`;

  // ---------- класс сцены ----------
  class Office {
    constructor(stage, opts) {
      this.stage = stage;
      this.opts = opts || {};
      const last = OM.officePos || { floor: 0, x: 360 };
      this.p = { floor: last.floor, x: last.x, y: SURF[last.floor], dir: 1, ride: null };
      this.pet = { x: last.x - 50, dir: 1 };
      this.path = [];
      this.keys = {};
      this.zone = zoneAt(this.p.floor, this.p.x);
      this.render();
      this.bind();
      this.last = 0;
      this.tick = this.tick.bind(this);
      this.raf = requestAnimationFrame(this.tick);
    }

    render() {
      const s = OM.state;
      const npcLayer = npcs();
      const av = s.av;
      const petMarkup = av.pet && av.pet !== 'none' ? OM.avatar.pet(av.pet, av.petColor, { shadow: true }).replace('<svg ', '<svg width="50" height="42" ') : '';
      this.stage.innerHTML = `<svg class="office-svg" viewBox="0 0 ${W} ${H}" role="application" aria-label="ОТП Офис">
        ${sky()}${shell()}
        ${reception()}${wardrobe()}${team()}${gallery()}${academy()}${lab()}
        <g class="cabin" id="of-cabin" transform="translate(0 ${SURF[this.p.floor] - SURF[0]})">
          <rect x="566" y="${SURF[0] - 180}" width="68" height="176" rx="8" fill="#F3F4F6"/><rect x="566" y="${SURF[0] - 180}" width="68" height="8" rx="4" fill="#C1FF05"/>
          <path d="M572 ${SURF[0] - 90} H628" stroke="#C9CDD3" stroke-width="3" stroke-linecap="round"/><rect x="566" y="${SURF[0] - 16}" width="68" height="12" fill="#DADDE1"/>
        </g>
        <g id="of-floors">${[0, 1, 2].map((f) => `<g transform="translate(${EX} ${top(f) - 2})"><rect x="-15" y="-11" width="30" height="16" rx="8" fill="#222"/><text y="1.5" text-anchor="middle" font-family="Onest, Arial, sans-serif" font-size="11" font-weight="600" fill="#C1FF05">${f + 1}</text></g>`).join('')}</g>
        <g id="of-target" style="display:none"><ellipse class="tgt-ring" cx="0" cy="0" rx="24" ry="7" fill="none" stroke="#C1FF05" stroke-width="4"/><ellipse cx="0" cy="0" rx="12" ry="3.5" fill="#222" opacity=".25"/>
          <path class="tgt-pin" d="M0 -6 C0 -6 -15 -17 -15 -27 C-15 -34 -9 -41 0 -41 C9 -41 15 -34 15 -27 C15 -17 0 -6 0 -6 Z" fill="#C1FF05" stroke="#222" stroke-width="2.5"/><circle cx="0" cy="-27" r="5" fill="#222"/></g>
        <g id="of-labels">${labels(s.visited)}</g>
        <g id="of-npcs">${npcLayer}</g>
        <g id="of-gifts">${gifts(s.pending)}</g>
        <g id="of-pet">${petMarkup}</g>
        <g id="of-player"><g class="pl-body">${avatarNested(av, AV_W, AV_H)}</g>
          <g class="me-tag"><rect x="${AV_W / 2 - 17}" y="-30" width="34" height="22" rx="11" fill="#C1FF05" stroke="#222" stroke-width="2"/><text x="${AV_W / 2}" y="-14.5" text-anchor="middle" font-family="Onest, Arial, sans-serif" font-size="12" font-weight="700" fill="#222">Вы</text></g>
        </g>
      </svg>`;
      this.svg = this.stage.querySelector('svg');
      this.elPlayer = this.svg.querySelector('#of-player');
      this.elBody = this.svg.querySelector('#of-player .pl-body');
      this.elPet = this.svg.querySelector('#of-pet');
      this.elCabin = this.svg.querySelector('#of-cabin');
      this.elTarget = this.svg.querySelector('#of-target');
      this.place();
    }

    // Метка цели на полу и подпись «Идём к…», чтобы было видно, что клик сработал
    mark(t) {
      if (!t) {
        this.elTarget.style.display = 'none';
        if (this.opts.onTarget) this.opts.onTarget(null);
        return;
      }
      this.elTarget.setAttribute('transform', `translate(${t.x} ${SURF[t.floor] - 4})`);
      this.elTarget.style.display = '';
      const z = zoneAt(t.floor, t.x);
      const label = t.label || (z ? D.rooms.find((r) => r.id === z).name : 'Лифт');
      if (this.opts.onTarget) this.opts.onTarget(label);
    }

    refresh() {
      const s = OM.state;
      const g = this.svg.querySelector('#of-gifts');
      if (g) g.innerHTML = gifts(s.pending);
      const l = this.svg.querySelector('#of-labels');
      if (l) l.innerHTML = labels(s.visited);
    }

    bind() {
      this.onClick = (e) => {
        const npc = e.target.closest('[data-npc]');
        const hotEl = e.target.closest('[data-hot]');
        const gift = e.target.closest('[data-gift]');
        if (gift) {
          const p = OM.state.pending.find((x) => x.id === gift.dataset.gift);
          if (p) this.goTo({ floor: floorOf(p.room || 'team'), x: GIFT_X[p.room || 'team'], kind: 'gift', id: p.id });
        } else if (npc) {
          const id = npc.dataset.npc;
          const z = Object.keys(NPC).find((k) => NPC[k].some((n) => n[0] === id));
          if (!z) return;
          const x = NPC[z].find((n) => n[0] === id)[1];
          this.goTo({ floor: floorOf(z), x: x + (x > this.p.x ? -52 : 52), kind: 'npc', id });
        } else if (hotEl) {
          const h = HOTS.find((x) => x.id === hotEl.dataset.hot);
          this.goTo({ floor: floorOf(h.zone), x: h.x, kind: 'hot', id: h.id, act: h.act, label: h.label });
        } else {
          const pt = this.toSvg(e);
          const f = [0, 1, 2].find((k) => pt.y >= top(k) && pt.y <= SURF[k] + 6);
          if (f != null && pt.x >= LX[0] && pt.x <= RX[1]) this.goTo({ floor: f, x: pt.x, kind: 'walk' });
        }
      };
      this.svg.addEventListener('click', this.onClick);
      this.onKeyDown = (e) => {
        if (this.blocked(e)) return;
        const k = e.code;
        if (['ArrowLeft', 'ArrowRight', 'KeyA', 'KeyD'].includes(k)) { this.keys[k] = true; this.path = []; if (this.target) { this.target = null; this.mark(null); } e.preventDefault(); }
        if (['ArrowUp', 'KeyW'].includes(k)) { e.preventDefault(); this.ride(this.p.floor + 1); }
        if (['ArrowDown', 'KeyS'].includes(k)) { e.preventDefault(); this.ride(this.p.floor - 1); }
        if (['KeyE', 'Enter'].includes(k)) { e.preventDefault(); this.interact(); }
      };
      this.onKeyUp = (e) => { delete this.keys[e.code]; };
      window.addEventListener('keydown', this.onKeyDown);
      window.addEventListener('keyup', this.onKeyUp);
    }

    blocked(e) {
      const t = e.target;
      return (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT')) || document.querySelector('.modal-overlay');
    }

    toSvg(e) {
      const pt = this.svg.createSVGPoint();
      pt.x = e.clientX; pt.y = e.clientY;
      return pt.matrixTransform(this.svg.getScreenCTM().inverse());
    }

    // Маршрут: по этажу до лифта, лифт, по этажу до цели
    goTo(target) {
      if (this.p.ride) return;
      target.x = Math.max(110, Math.min(1090, target.x));
      this.path = [];
      if (target.floor !== this.p.floor) {
        this.path.push({ type: 'walk', x: EX });
        this.path.push({ type: 'ride', floor: target.floor });
      }
      this.path.push({ type: 'walk', x: target.x });
      this.target = target;
      this.mark(target);
    }

    ride(floor) {
      if (floor < 0 || floor > 2 || this.p.ride) return;
      this.goTo({ floor, x: EX, kind: 'walk' });
    }

    interact() {
      const n = this.near;
      if (!n) return;
      this.arrive(n);
    }

    arrive(t) {
      if (!t || t.kind === 'walk') return;
      if (this.opts.onArrive) this.opts.onArrive(t);
    }

    nearest() {
      const f = this.p.floor, x = this.p.x;
      let best = null, bd = 70;
      HOTS.forEach((h) => {
        if (floorOf(h.zone) !== f) return;
        const d = Math.abs(h.x - x);
        if (d < bd) { bd = d; best = { kind: 'hot', id: h.id, act: h.act, label: h.label, floor: f, x: h.x }; }
      });
      OM.state.pending.forEach((p) => {
        const room = p.room || 'team';
        if (floorOf(room) !== f) return;
        const d = Math.abs(GIFT_X[room] - x);
        if (d < bd + 10) { bd = d; best = { kind: 'gift', id: p.id, label: 'Ваша награда', floor: f, x: GIFT_X[room] }; }
      });
      Object.keys(NPC).forEach((z) => {
        if (floorOf(z) !== f) return;
        NPC[z].forEach(([id, nx]) => {
          if (OM.isMe(id)) return;
          const d = Math.abs(nx - x);
          if (d < Math.min(bd, 58)) { bd = d; best = { kind: 'npc', id, label: OM.person(id).name, floor: f, x: nx }; }
        });
      });
      return best;
    }

    tick(ts) {
      const dt = this.last ? Math.min(0.05, (ts - this.last) / 1000) : 0.016;
      this.last = ts;
      const p = this.p;
      let moving = false;

      if (p.ride) {
        const r = p.ride;
        r.t = Math.min(1, r.t + dt / r.dur);
        const e = r.t < 0.5 ? 2 * r.t * r.t : 1 - Math.pow(-2 * r.t + 2, 2) / 2;
        p.y = SURF[r.from] + (SURF[r.to] - SURF[r.from]) * e;
        if (r.t >= 1) { p.floor = r.to; p.y = SURF[r.to]; p.ride = null; this.path.shift(); }
      } else if (this.keys.ArrowLeft || this.keys.KeyA || this.keys.ArrowRight || this.keys.KeyD) {
        const d = this.keys.ArrowLeft || this.keys.KeyA ? -1 : 1;
        p.x = Math.max(110, Math.min(1090, p.x + d * SPEED * dt));
        p.dir = d;
        moving = true;
      } else if (this.path.length) {
        const step = this.path[0];
        if (step.type === 'walk') {
          const d = step.x - p.x;
          if (Math.abs(d) < 3) {
            p.x = step.x;
            this.path.shift();
            if (!this.path.length && this.target) {
              const t = this.target;
              this.target = null;
              this.mark(null);
              if (t.kind === 'walk') { if (this.opts.onStop) this.opts.onStop(this.zone); } else this.arrive(t);
            }
          } else {
            p.dir = Math.sign(d);
            p.x += p.dir * Math.min(Math.abs(d), SPEED * dt);
            moving = true;
          }
        } else if (step.type === 'ride') {
          if (step.floor === p.floor) this.path.shift();
          else p.ride = { from: p.floor, to: step.floor, t: 0, dur: 0.55 + 0.35 * Math.abs(step.floor - p.floor) };
        }
      }

      // зона
      if (!p.ride) {
        const z = zoneAt(p.floor, p.x);
        if (z && z !== this.zone) {
          this.zone = z;
          if (this.opts.onZone) this.opts.onZone(z);
        }
      }
      // подсказка «рядом»
      const n = p.ride || moving ? null : this.nearest();
      const key = n ? n.kind + n.id : '';
      if (key !== this.nearKey) {
        this.nearKey = key;
        this.near = n;
        this.svg.querySelectorAll('.hot.near').forEach((el) => el.classList.remove('near'));
        if (n && n.kind === 'hot') { const el = this.svg.querySelector(`[data-hot="${n.id}"]`); if (el) el.classList.add('near'); }
        if (this.opts.onNear) this.opts.onNear(n);
      }

      // питомец догоняет
      const want = p.x - p.dir * 52;
      const pd = want - this.pet.x;
      if (Math.abs(pd) > 2) { this.pet.x += pd * Math.min(1, dt * 4.5); this.pet.dir = Math.sign(pd) || this.pet.dir; }
      this.moving = moving || !!p.ride;
      this.place();
      OM.officePos = { floor: p.floor, x: p.x };
      this.raf = requestAnimationFrame(this.tick);
    }

    place() {
      const p = this.p;
      this.elPlayer.setAttribute('transform', `translate(${(p.x - AV_W / 2).toFixed(1)} ${(p.y - AV_H - 2).toFixed(1)})`);
      this.elBody.classList.toggle('walking', !!this.moving && !p.ride);
      this.elBody.classList.toggle('idle', !this.moving);
      this.elCabin.setAttribute('transform', `translate(0 ${(p.y - SURF[0]).toFixed(1)})`);
      const petY = p.y - 40;
      const flip = this.pet.dir < 0 ? ` translate(50 0) scale(-1 1)` : '';

          if (c) { st.cat = c.dataset.cat; el.querySelector('[data-part="cat"]').innerHTML = catChips(st.cat); return; }
          const g = e.target.closest('[data-give]');
          if (!g) return;
          if (!validate(el, [[st.text.trim().length < 12, 'text', 'Опишите конкретный вклад и пользу — не менее 12 символов']])) return;
          const res = OM.store.award({ who, tier: st.tier, cat: st.cat, text: st.text.trim(), review: rv ? rv.id : null });
          if (!res.ok) { OM.toast(res.reason === 'fund' ? 'Не хватает фонда на эту ступень' : 'Проверьте получателя, ценность и описание вклада', { icon: 'info' }); return; }
          OM.modal.close(entry);
          const r = g.getBoundingClientRect();
          OM.fx.confetti({ x: r.left + r.width / 2, y: r.top, n: res.after.value > res.before.value ? 160 : 70 });
          OM.toast(`${esc(OM.firstName(p))} получит ${OM.fmt(res.amount)} РуКоинов`, { coin: 'ru' });
          if (res.after.value > res.before.value) setTimeout(() => OM.toast(`Индекс признания: ${res.after.value}`, { icon: 'spark', ms: 4200 }), 700);
        });
      },
    });

  A.dropReview = (ds) => {
    OM.store.dropReview(ds.id);
    OM.toast('Возвращено на уточнение', { icon: 'refresh' });
  };

  // ---------- Покупки и заказы ----------
  A.buyItem = (ds) => {
    const it = OM.item(ds.slot, ds.id);
    if (!it) return;
    const bal = OM.state.balance.coin;
    const ok = bal >= it.price;
    const preview = ['backdrop', 'pattern', 'frame'].includes(it.slot)
      ? OM.tgCard(Object.assign({}, OM.person('me'), { prof: Object.assign({}, OM.state.prof, { [it.slot]: it.id }) }), { size: 100, h: 240, sub: false })
      : it.slot === 'pet'
        ? `<div class="card" style="height:220px;display:grid;place-items:center">${OM.avatar.pet(it.id, ds.color, {})}</div>`
        : `<div class="card" style="height:260px;background:var(--violet-2)">${OM.avatar.svg(Object.assign({}, OM.state.av, { [it.slot]: it.id }, ds.color ? { [it.slot + 'Color']: ds.color } : {}), { view: 'full' })}</div>`;
    OM.modal.open({
      label: it.name,
      html: `<div class="modal-title">${esc(it.name)}</div>
        <div class="modal-sub">Только для аватара</div>
        <div class="mt-20">${preview}</div>
        <div class="row space mt-20"><span class="muted">Цена</span><span class="h3">${OM.money(it.price, 'coin', 26)}</span></div>
        <div class="row space mt-8 small"><span class="muted">Ваш баланс</span><span>${OM.money(bal, 'coin', 18)}</span></div>
        ${ok ? '' : `<div class="try-note" style="background:var(--warn-2)">${OM.icon('info', 18)}<span>Не хватает ${OM.fmt(it.price - bal)} ${OM.curName('coin', it.price - bal)}</span></div>`}
        <div class="modal-foot"><button class="btn btn-primary btn-lg" data-buy ${ok ? '' : 'disabled'}>Купить и надеть</button><button class="btn btn-secondary btn-lg" data-close>Подумаю</button></div>`,
      onMount(el, entry) {
        el.addEventListener('click', (e) => {
          if (!e.target.closest('[data-buy]')) return;
          if (!OM.store.buy(it)) return;
          if (['backdrop', 'pattern', 'frame'].includes(it.slot)) OM.store.setProf({ [it.slot]: it.id });
          else {
            const av = Object.assign({}, OM.state.av, { [it.slot]: it.id });
            if (ds.color) av[it.slot + 'Color'] = ds.color;
            OM.store.saveAvatar(av);
            if (OM.wardrobeDraft) OM.wardrobeDraft = Object.assign({}, av);
          }
          OM.modal.close(entry);
          OM.fx.confetti({ n: 70 });
          OM.toast(`«${esc(it.name)}» теперь в вашем гардеробе`, { icon: 'hanger' });
        });
      },
    });
  };

  A.orderKit = (ds) => {
    const kit = D.shop.kits.find((k) => k.id === ds.id);
    if (!kit) return;
    const twin = OM.item(kit.slot, kit.twin);
    const st = { step: 0, rec: 'self', to: null, size: kit.sizes.length === 1 ? kit.sizes[0] : 'M', how: 'office', q: '' };
    const bal = () => { const w = OM.wishOf('me'); return OM.state.balance.coin + (st.rec === 'self' && w && w.kit === kit.id && !w.reserved ? Math.min(w.got, kit.price) : 0); };
    const steps = () => `<div class="steps">${[0, 1, 2, 3].map((i) => `<i class="${i <= st.step ? 'on' : ''}"></i>`).join('')}</div>`;
    const tryAv = Object.assign({}, OM.state.av, { [kit.slot]: kit.twin });
    const views = [
      () => `<div class="modal-title">${esc(kit.name)}</div><div class="modal-sub">Шаг 1 из 4 · примерка</div>${steps()}
        <div class="grid g-2 mt-20" style="gap:16px;align-items:center">

            <p>${esc(kit.desc)}</p>

          </div></div>
        <div class="modal-foot"><button class="btn btn-primary btn-lg" data-next ${bal() < kit.price ? 'disabled' : ''}>Дальше</button></div>`,

        <div class="seg mt-20">${[['self', 'Себе'], ['gift', 'Подарить коллеге']].map(([v, n]) => `<button class="${st.rec === v ? 'on' : ''}" data-rec="${v}">${n}</button>`).join('')}</div>
        ${st.rec === 'gift' ? (st.to ? `<div class="mt-16">${chosenHtml(OM.person(st.to), 'data-change')}</div>` : `<div class="search mt-16"><input class="input" data-in="q" placeholder="Кому подарить">${OM.icon('search', 18)}</div><div class="picker mt-8" data-part="list">${pickerHtml(st.q, null, 8)}</div>`) : ''}
        <div class="modal-foot"><button class="btn btn-primary btn-lg" data-next ${st.rec === 'gift' && !st.to ? 'disabled' : ''}>Дальше</button><button class="btn btn-ghost btn-lg" data-prev>Назад</button></div>`,
      () => `<div class="modal-title">Размер и получение</div><div class="modal-sub">Шаг 3 из 4</div>${steps()}
        <div class="field mt-20"><span class="field-label">Размер</span>${st.rec === 'gift' ? '<p class="muted">Размер выберет получатель в своих заказах</p>' : `<div class="chips chip-w">${kit.sizes.map((s) => `<button class="chip ${st.size === s ? 'on' : ''}" data-size="${s}">${s}</button>`).join('')}</div>`}</div>
        <div class="field mt-16"><span class="field-label">Способ получения</span><div class="col" style="gap:8px">${[['office', 'В офисе', 'На ресепшене'], ['pickup', 'Пункт выдачи', 'Для регионов'], ['courier', 'Курьером', 'Домой']].map(([v, n, d]) => `<button class="pick ${st.how === v ? 'on' : ''}" data-how="${v}" style="padding:12px 14px">${OM.icon(v === 'office' ? 'office' : v === 'pickup' ? 'bag' : 'send', 20)}<span class="grow"><b>${n}</b><small>${d}</small></span></button>`).join('')}</div></div>
        <div class="modal-foot"><button class="btn btn-primary btn-lg" data-next>Дальше</button><button class="btn btn-ghost btn-lg" data-prev>Назад</button></div>`,
      () => `<div class="modal-title">Подтверждение</div><div class="modal-sub">Шаг 4 из 4 · выдача до ${esc(D.shop.window.closes)}</div>${steps()}
        <div class="list mt-20">
          <div class="list-item"><span class="muted grow">Комплект</span><b style="font-weight:500">${esc(kit.name)}</b></div>
          <div class="list-item"><span class="muted grow">Получатель</span><span>${st.rec === 'gift' && st.to ? esc(OM.person(st.to).name) : 'Вы'}</span></div>
          <div class="list-item"><span class="muted grow">Размер · получение</span><span>${st.rec === 'gift' ? 'Выберет получатель' : esc(st.size)} · ${{ office: 'в офисе', pickup: 'пункт выдачи', courier: 'курьером' }[st.how]}</span></div>
          <div class="list-item"><span class="muted grow">Резерв</span>${OM.money(kit.price, 'coin', 20)}</div>
        </div>
        <div class="small muted mt-12">Списание при выдаче, отмена — бесплатно</div>
        <div class="modal-foot"><button class="btn btn-primary btn-lg btn-caps" data-confirm>Подтвердить заказ</button><button class="btn btn-ghost btn-lg" data-prev>Назад</button></div>`,
    ];
    OM.modal.open({
      size: 'wide',
      label: kit.name,
      html: views[0],
      onMount(el, entry, render) {
        const show = () => render(views[st.step]());
        el.addEventListener('input', (e) => { if (e.target.dataset.in === 'q') { st.q = e.target.value; el.querySelector('[data-part="list"]').innerHTML = pickerHtml(st.q, null, 8); } });
        el.addEventListener('click', (e) => {
          const t = e.target;
          if (t.closest('[data-next]')) { st.step = Math.min(3, st.step + 1); show(); return; }
          if (t.closest('[data-prev]')) { st.step = Math.max(0, st.step - 1); show(); return; }
          const rec = t.closest('[data-rec]');
          if (rec) { st.rec = rec.dataset.rec; show(); return; }
          const pk = t.closest('[data-pick]');
          if (pk) { st.to = pk.dataset.pick; show(); return; }
          if (t.closest('[data-change]')) { st.to = null; show(); return; }
          const sz = t.closest('[data-size]');
          if (sz) { st.size = sz.dataset.size; show(); return; }
          const how = t.closest('[data-how]');
          if (how) { st.how = how.dataset.how; show(); return; }
          if (t.closest('[data-confirm]')) {
            const gift = st.rec === 'gift' && st.to;
            const ord = OM.store.order({ kind: 'kit', ref: kit.id, name: kit.name + (gift ? ' → ' + OM.person(st.to).name : ''), price: kit.price, cur: 'coin', size: gift ? null : st.size, how: st.how, twin: OM.store.key(twin), gift: !!gift, to: gift ? st.to : null });
            if (!ord) { OM.toast('Не хватает Коинов', { icon: 'info' }); return; }
            render(`<div style="text-align:center;padding:8px 0">
              <div class="stamp-big">${OM.icon('check', 44, 2.4)}</div>
              <div class="modal-title mt-20" style="padding:0">Заказ ${esc(ord.id)} в очереди</div>
              <p class="lead mt-8">№${ord.place} в очереди · выдача до ${esc(D.shop.window.closes)}</p>
              <div class="modal-foot" style="justify-content:center"><button class="btn btn-primary" data-fulfill="${ord.id}">Демо: выдать</button><a class="btn btn-secondary" href="#/bonuses" data-close>Мои заказы</a></div></div>`);
            OM.fx.confetti({ n: 90 });
            return;
          }
          const f = t.closest('[data-fulfill]');
          if (f) {
            OM.store.fulfill(f.dataset.fulfill);
            OM.modal.close(entry);
            OM.toast(st.rec === 'gift' ? 'Комплект выдан коллеге' : `${esc(twin.name)} — уже в вашем гардеробе`, { icon: 'hanger' });
          }
        });
      },
    });
  };

  A.orderSimple = (ds) => {
    const S = D.shop;
    const it = S.certs.find((x) => x.id === ds.id) || S.privileges.find((x) => x.id === ds.id) || S.experiences.find((x) => x.id === ds.id);
    if (!it) return;
    const cur = S.privileges.includes(it) ? 'ru' : 'coin';
    const name = it.nominal ? `Сертификат «${it.name}» ${OM.fmt(it.nominal)} ₽` : it.name;
    const bal = OM.state.balance[cur];
    const days = [];
    for (let d = 1; days.length < 5; d++) {
      const dt = new Date(Date.now() + d * 864e5);
      if (dt.getDay() % 6) days.push(dt);
    }
    let day = 0;
    OM.modal.open({
      label: name,
      html: () => `<div class="modal-title">${esc(name)}</div>
        ${it.note ? `<div class="modal-sub">${esc(it.note)}</div>` : ''}
        ${cur === 'ru' ? `<div class="field mt-20"><span class="field-label">Дата</span><div class="chips chip-w">${days.map((d, i) => `<button class="chip ${i === day ? 'on' : ''}" data-day="${i}">${d.toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric', month: 'short' })}</button>`).join('')}</div></div>` : ''}
        <div class="list mt-20"><div class="list-item"><span class="muted grow">Цена</span>${OM.money(it.price, cur, 20)}</div><div class="list-item"><span class="muted grow">Ваш баланс</span>${OM.money(bal, cur, 20)}</div></div>
        ${bal < it.price ? `<div class="try-note" style="background:var(--warn-2)">${OM.icon('info', 18)}<span>Не хватает ${OM.fmt(it.price - bal)} ${OM.curName(cur, it.price - bal)}.</span></div>` : ''}
        <div class="modal-foot"><button class="btn btn-primary btn-lg" data-confirm ${bal < it.price ? 'disabled' : ''}>${cur === 'ru' ? 'На согласование' : 'Оформить'}</button></div>`,
      onMount(el, entry, render) {
        el.addEventListener('click', (e) => {
          const d = e.target.closest('[data-day]');
          if (d) { day = +d.dataset.day; el.querySelectorAll('[data-day]').forEach((b) => b.classList.toggle('on', b === d)); return; }
          if (!e.target.closest('[data-confirm]')) return;
          const ord = OM.store.order({ kind: cur === 'ru' ? 'priv' : S.certs.includes(it) ? 'cert' : 'experience', ref: it.id, name: name + (cur === 'ru' ? ' · ' + days[day].toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' }) : ''), price: it.price, cur });
          if (!ord) return;
          OM.modal.close(entry);
          OM.toast(cur === 'ru' ? 'Заявка ушла руководителю' : `Заказ ${ord.id} в очереди`, { icon: 'check' });

  A.fulfill = (ds) => { const o = OM.store.fulfill(ds.id); if (o) OM.toast(o.twin && !o.gift ? 'Выдано! Цифровой двойник — в гардеробе' : 'Заказ выдан', { icon: 'check' }); };

  // ---------- Как это работает ----------
  A.howItWorks = () => {

        <div class="list mt-16">${[
          [OM.icon('heart', 20), 'Благодарите', 'Бесплатно и каждому'],
          [OM.icon('gift', 20), 'Награды за вклад', '1 000 – 5 000 РуКоинов от руководителя'],
          [OM.coin('coin', 26), 'Коины', 'Магазин, мерч, поездки. Накопленное не сгорает'],

    });
  };

  // ---------- Знакомство (ресепшен) ----------
  A.onboarding = () => {
    const st = { step: 0, name: OM.state.name, av: Object.assign({}, OM.state.av), interests: OM.state.interests.slice(), publicity: OM.state.publicity };
    const INTERESTS = ['Данные', 'Клиенты', 'Обучение', 'Продукт', 'Дизайн', 'ИТ', 'Регионы', 'Спорт', 'Наставничество', 'Идеи'];

    const tops = [['hoodie', 'Худи'], ['tee', 'Футболка'], ['shirt', 'Рубашка'], ['sweater', 'Свитер'], ['polo', 'Поло']];
    const topColors = ['lime', 'violet', 'sky', 'graphite', 'white', 'navy', 'coral', 'mint'];
    const views = [
      () => `<div class="eyebrow">1 из 3</div><div class="modal-title mt-8">${OM.account.since > 0 ? 'Мы обновились' : 'Добро пожаловать'}</div>
        <p class="lead mt-12">Благодарите коллег и получайте награды за вклад</p>

      () => `<div class="eyebrow">2 из 3</div><div class="modal-title mt-8">Ваш аватар</div>
        <p class="muted mt-8">Его увидят коллеги</p>

        <div class="col" style="gap:16px">
          <div><div class="opt-title">Фигура</div><div class="seg">${D.appearance.body.map(([id, n]) => `<button class="${st.av.body === id ? 'on' : ''}" data-k="body" data-v="${id}">${n}</button>`).join('')}</div></div>
          <div><div class="opt-title">Тон кожи</div><div class="swatches">${D.appearance.skin.map(([id, c]) => `<button class="swatch ${st.av.skin === id ? 'on' : ''}" style="background:${c}" data-k="skin" data-v="${id}" aria-label="Тон ${id}"></button>`).join('')}</div></div>
          <div><div class="opt-title">Причёска</div><div class="chips chip-w">${D.appearance.hair.map(([id, n]) => `<button class="chip ${st.av.hair === id ? 'on' : ''}" data-k="hair" data-v="${id}">${n}</button>`).join('')}</div></div>
          <div><div class="opt-title">Цвет волос</div><div class="swatches">${hairCols.map((id) => `<button class="swatch ${st.av.hairColor === id ? 'on' : ''}" style="background:${OM.avatar.HAIR[id]}" data-k="hairColor" data-v="${id}" aria-label="${id}"></button>`).join('')}</div></div>
          <div><div class="opt-title">Борода и усы</div><div class="chips chip-w">${D.appearance.facial.map(([id, n]) => `<button class="chip ${st.av.facial === id ? 'on' : ''}" data-k="facial" data-v="${id}">${n}</button>`).join('')}</div></div>

            <div class="swatches mt-12">${topColors.map((id) => `<button class="swatch ${st.av.topColor === id ? 'on' : ''}" style="background:${OM.avatar.CLOTH[id]}" data-k="topColor" data-v="${id}" aria-label="${id}"></button>`).join('')}</div></div>
        </div></div>
        <div class="modal-foot"><button class="btn btn-primary btn-lg" data-next>Дальше</button><button class="btn btn-ghost btn-lg" data-prev>Назад</button></div>`,
      () => `<div class="eyebrow">3 из 3</div><div class="modal-title mt-8">Интересы</div>
        <div class="field mt-20"><span class="field-label">Что вам близко</span><div class="chips chip-w">${INTERESTS.map((i) => `<button class="chip ${st.interests.includes(i) ? 'on' : ''}" data-int="${esc(i)}">${i}</button>`).join('')}</div></div>
        <div class="field mt-20"><span class="field-label">Кто видит ваши благодарности</span><div class="seg">${[['public', 'Все'], ['team', 'Команда'], ['private', 'Только я']].map(([v, n]) => `<button class="${st.publicity === v ? 'on' : ''}" data-pub="${v}">${n}</button>`).join('')}</div></div>
        <div class="modal-foot"><button class="btn btn-primary btn-lg btn-caps" data-done>${OM.icon('office', 18)} Войти в офис</button><button class="btn btn-secondary btn-lg" data-stay>На главную</button><button class="btn btn-ghost btn-lg" data-prev>Назад</button></div>`,
    ];
    OM.modal.open({
      size: 'wide',
      label: 'Знакомство',
      html: views[0],
      onMount(el, entry, render) {
        const show = () => render(views[st.step]());
        const finish = () => {
          OM.store.finishOnboarding({ name: (st.name || '').trim() || OM.state.name, av: st.av, interests: st.interests, publicity: st.publicity });
          OM.modal.close(entry);
          OM.toast('Открыт «Бейдж ОТП»', { icon: 'check', ms: 3800 });
        };
        el.addEventListener('input', (e) => { if (e.target.dataset.in === 'name') st.name = e.target.value; });
        el.addEventListener('click', (e) => {
          const t = e.target;
          if (t.closest('[data-next]')) { st.step++; show(); return; }
          if (t.closest('[data-prev]')) { st.step--; show(); return; }
          if (t.closest('[data-skip]')) { finish(); return; }
          if (t.closest('[data-done]')) { finish(); OM.fx.confetti({ n: 120 }); location.hash = '#/office'; return; }

          const k = t.closest('[data-k]');
          if (k) {
            if (k.dataset.k === 'body') st.av = OM.avatar.applyBody(st.av, k.dataset.v);

            show();
            return;

          const i = t.closest('[data-int]');
