<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ОТП Мания</title>
  <meta name="description" content="Прототип личного кабинета ОТП Мании: ОТП Офис, аватар и гардероб, бонусы, «Выбор коллег» и кабинет руководителя.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22%23C1FF05%22%2F%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2216.5%22%20fill%3D%22none%22%20stroke%3D%22%23222%22%20stroke-width%3D%229%22%2F%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%225%22%20fill%3D%22%23222%22%2F%3E%3C%2Fsvg%3E%0A">
  <style>
/* ОТП Мания — личный кабинет сотрудника.
   Визуальный язык взят с otpbank.ru: шрифт Onest, лайм #C1FF05, серые карточки #F3F4F6,
   радиус 16px, кнопки-«таблетки», текст #222 / #717171, фиолетовый #9E6FC3. */

:root {
  --lime: #C1FF05;
  --lime-2: #D5FF6B;
  --lime-3: #EEFFBF;
  --lime-ink: #5E9E00;
  --ink: #222222;
  --text: #333333;
  --muted: #717171;
  --muted-2: #6E7482;
  --faint: #A3A8B0;
  --bg: #FFFFFF;
  --surface: #F3F4F6;
  --surface-2: #E8EAED;
  --border: #DEDFE1;
  --hair: #ECEDEF;
  --violet: #9E6FC3;
  --violet-2: #F1E8F9;
  --violet-ink: #7A4CA3;
  --blue: #80C0FA;
  --blue-2: #E3F2FC;
  --blue-ink: #2F6FAF;
  --orange: #FF9F5A;
  --warn: #B26A00;
  --warn-2: #FFF1DC;
  --red: #E5484D;
  --red-2: #FDECEC;
  --good: #2F8A3B;
  --cat-result: #5E9E00;
  --cat-learning: #62AEF2;
  --cat-enjoyment: #9763C2;
  --r-sm: 12px;
  --r: 16px;
  --r-lg: 24px;
  --pill: 100px;
  --shadow: 0 8px 28px rgba(34, 34, 34, .08);
  --shadow-lg: 0 24px 64px rgba(34, 34, 34, .18);
  --font: 'Onest', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --emoji: 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif;
  --header-h: 72px;
  --container: 1240px;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.5;
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4, p { margin: 0; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }
img, svg { display: block; }
input, textarea, select { font: inherit; color: inherit; }
[hidden] { display: none !important; }
[id] { scroll-margin-top: 96px; }
::selection { background: var(--lime); }

.container { max-width: var(--container); margin: 0 auto; padding: 0 24px; }
.emoji { font-family: var(--emoji); font-style: normal; }
.tnum { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.tiny { font-size: 12px; }
.nowrap { white-space: nowrap; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- Типографика ---------- */
.h1 { font-size: 44px; line-height: 1.08; font-weight: 500; letter-spacing: -0.02em; }
.h2 { font-size: 32px; line-height: 1.12; font-weight: 500; letter-spacing: -0.015em; }
.h3 { font-size: 24px; line-height: 1.2; font-weight: 500; letter-spacing: -0.01em; }
.h4 { font-size: 19px; line-height: 1.3; font-weight: 500; }
.lead { font-size: 18px; color: var(--muted); }
.eyebrow { font-size: 13px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

/* ---------- Верхняя серая полоса ---------- */
.topbar { background: var(--surface); height: 40px; font-size: 14px; }
.topbar .container { height: 100%; display: flex; align-items: center; justify-content: flex-end; gap: 16px; }
.topbar-links { display: flex; gap: 20px; align-items: center; color: var(--muted); }
.topbar-links button { border: 0; background: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; color: var(--ink); font-size: 14px; padding: 0; }
.topbar-links button.quiet { color: var(--muted); }
.topbar-links button:hover { color: var(--ink); }

/* ---------- Шапка ---------- */
.header { position: sticky; top: 0; z-index: 50; background: rgba(255, 255, 255, .96); backdrop-filter: saturate(1.4) blur(8px); border-bottom: 1px solid transparent; transition: border-color .2s; }
.header.scrolled { border-bottom-color: var(--hair); }
.header .container { height: var(--header-h); display: flex; align-items: center; gap: 20px; }
.logo { display: inline-flex; align-items: center; gap: 8px; flex: none; }
.logo-mark { width: 30px; height: 30px; }
.logo-word { font-size: 23px; line-height: 1; letter-spacing: -0.03em; white-space: nowrap; }
.logo-word b { font-weight: 700; }
.logo-word i { font-weight: 500; font-style: italic; margin-left: 1px; }
.nav { display: flex; gap: 2px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav a { height: 38px; padding: 0 11px; display: inline-flex; align-items: center; border-radius: var(--pill); font-size: 15px; white-space: nowrap; color: var(--ink); transition: background .15s; }
.nav a:hover { background: var(--surface); }
.nav a.on { background: var(--lime-2); }
.nav a .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--red); margin-left: 6px; }
.header-right { display: flex; align-items: center; gap: 8px; flex: none; }
.bal-pill { height: 40px; border-radius: var(--pill); background: var(--surface); display: inline-flex; align-items: center; gap: 7px; padding: 0 14px 0 7px; font-weight: 500; font-size: 15px; cursor: pointer; border: 0; transition: background .15s, transform .15s; }
.bal-pill:hover { background: var(--surface-2); }
.bal-pill.bump { animation: bump .5s ease; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--surface); border: 0; display: inline-grid; place-items: center; cursor: pointer; position: relative; flex: none; transition: background .15s; }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn .badge-dot { position: absolute; top: 7px; right: 8px; width: 9px; height: 9px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 2px var(--surface); }
.me-btn { border: 0; background: none; padding: 0; cursor: pointer; border-radius: 50%; }

/* ---------- Нижняя панель (мобильная) ---------- */
.tabbar { display: none; }

/* ---------- Страница ---------- */
.main { min-height: calc(100vh - 112px); }
.view { padding: 32px 0 96px; animation: viewIn .28s ease both; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 28px; flex-wrap: wrap; }
.page-head .lead { margin-top: 8px; max-width: 720px; }
.section { margin-top: 40px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
.link { color: var(--ink); border-bottom: 1px solid var(--border); cursor: pointer; background: none; border-top: 0; border-left: 0; border-right: 0; padding: 0; font-size: inherit; transition: border-color .15s; }
.link:hover { border-bottom-color: var(--ink); }
.link-arrow { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; cursor: pointer; background: none; border: 0; padding: 0; font-size: 15px; }
.link-arrow:hover svg { transform: translateX(3px); }
.link-arrow svg { transition: transform .15s; }

/* ---------- Сетки ---------- */
.grid { display: grid; gap: 20px; }
.g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-main { grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr); }
.g-side { grid-template-columns: minmax(0, 1fr) 380px; }
.row { display: flex; align-items: center; gap: 12px; }
.row-wrap { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.col { display: flex; flex-direction: column; gap: 12px; }
.grow { flex: 1; min-width: 0; }
.space { justify-content: space-between; }
.mt-8 { margin-top: 8px; } .mt-12 { margin-top: 12px; } .mt-16 { margin-top: 16px; } .mt-20 { margin-top: 20px; } .mt-24 { margin-top: 24px; } .mt-32 { margin-top: 32px; }

/* ---------- Карточки ---------- */
.card { background: var(--surface); border-radius: var(--r); padding: 28px; position: relative; min-width: 0; }
.card-white { background: #fff; box-shadow: inset 0 0 0 1px var(--hair); }
.card-lime { background: var(--lime); }
.card-dark { background: var(--ink); color: #fff; }
.card-dark .muted { color: rgba(255, 255, 255, .62); }
.card-violet { background: var(--violet); color: #fff; }
.card-tight { padding: 20px; }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
.card-title { font-size: 21px; font-weight: 500; letter-spacing: -0.01em; line-height: 1.25; }
.card-sub { font-size: 14px; color: var(--muted); margin-top: 4px; }
.clickable { cursor: pointer; transition: transform .18s ease, box-shadow .18s ease; }
.clickable:hover { transform: translateY(-2px); box-shadow: var(--shadow); }

/* ---------- Кнопки ---------- */
.btn { height: 48px; padding: 0 24px; border-radius: var(--pill); border: 0; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 500; font-size: 16px; line-height: 1; cursor: pointer; white-space: nowrap; transition: background .15s, transform .1s, box-shadow .15s, opacity .15s; text-decoration: none; }
.btn:active { transform: scale(.98); }
.btn:disabled, .btn.disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn-primary { background: var(--lime); color: var(--ink); }
.btn-primary:hover { background: #B4F000; }
.btn-secondary { background: var(--surface); color: var(--ink); }
.btn-secondary:hover { background: var(--surface-2); }
.card .btn-secondary, .modal .card .btn-secondary { background: #fff; }
.card .btn-secondary:hover { background: #fafafa; box-shadow: inset 0 0 0 1px var(--border); }
.btn-dark { background: var(--ink); color: #fff; }
.btn-dark:hover { background: #3a3a3a; }
.btn-outline { background: transparent; box-shadow: inset 0 0 0 1.5px var(--ink); color: var(--ink); }
.btn-outline:hover { background: rgba(34, 34, 34, .05); }
.btn-ghost { background: transparent; color: var(--ink); }
.btn-ghost:hover { background: var(--surface); }
.btn-lg { height: 54px; padding: 0 32px; font-size: 17px; }
.btn-caps { text-transform: uppercase; letter-spacing: .03em; }
.btn-sm { height: 36px; padding: 0 16px; font-size: 14px; }
.btn-xs { height: 30px; padding: 0 12px; font-size: 13px; }
.btn-block { width: 100%; }
.btn-icon { width: 48px; padding: 0; }
.btn-sm.btn-icon { width: 36px; }

/* ---------- Чипы, бейджи ---------- */
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { height: 36px; padding: 0 16px; border-radius: var(--pill); background: var(--surface); border: 0; cursor: pointer; font-size: 15px; display: inline-flex; align-items: center; gap: 6px; transition: background .15s; white-space: nowrap; }
.chip:hover { background: var(--surface-2); }
.chip.on { background: var(--lime); }
.card .chip { background: #fff; }
.card .chip.on, .modal .chip-w .chip.on { background: var(--lime); }
.chip .cdot { width: 8px; height: 8px; border-radius: 50%; }
.badge { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 10px; border-radius: var(--pill); font-size: 12px; font-weight: 500; background: #fff; color: var(--ink); white-space: nowrap; line-height: 1; }
.badge-lime { background: var(--lime); }
.badge-soft { background: var(--lime-3); color: #3F6B00; }
.badge-violet { background: var(--violet-2); color: var(--violet-ink); }
.badge-blue { background: var(--blue-2); color: var(--blue-ink); }
.badge-dark { background: var(--ink); color: #fff; }
.badge-gray { background: var(--surface); color: var(--muted-2); }
.badge-warn { background: var(--warn-2); color: var(--warn); }
.badge-red { background: var(--red-2); color: #B3261E; }
.cat { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted-2); }
.cat i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.cat-result i { background: var(--cat-result); }
.cat-learning i { background: var(--cat-learning); }
.cat-enjoyment i { background: var(--cat-enjoyment); }

/* ---------- Монеты ---------- */
.coin { display: inline-grid; place-items: center; border-radius: 50%; flex: none; font-weight: 700; line-height: 1; letter-spacing: -0.02em; }
.coin-coin { background: var(--lime); color: var(--ink); box-shadow: inset 0 0 0 2px #A6DB00; }
.coin-ru { background: var(--violet); color: #fff; box-shadow: inset 0 0 0 2px #8655AE; }
.money { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; white-space: nowrap; }

/* ---------- Прогресс ---------- */
.bar { height: 8px; border-radius: var(--pill); background: #fff; overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: inherit; background: var(--ink); transition: width .6s cubic-bezier(.2, .8, .2, 1); }
.bar-thin { height: 6px; }
.bar-thick { height: 12px; }
.bar-on-white { background: var(--surface); }
.card-dark .bar { background: rgba(255, 255, 255, .14); }
.card-dark .bar > i, .bar-lime > i { background: var(--lime); }
.bar-violet > i { background: var(--violet); }
.bar-label { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; margin-bottom: 8px; }

/* ---------- Поля ---------- */
.field { display: flex; flex-direction: column; gap: 8px; }
.field-label { font-size: 14px; color: var(--muted); }
.input { width: 100%; height: 52px; border-radius: var(--r-sm); background: var(--surface); border: 1.5px solid transparent; padding: 0 16px; font-size: 16px; transition: border-color .15s, background .15s; }
.input:focus { outline: none; border-color: var(--ink); background: #fff; }
textarea.input { height: auto; min-height: 88px; padding: 14px 16px; resize: vertical; line-height: 1.45; }
.input::placeholder { color: var(--faint); }
.search { position: relative; }
.search svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search .input { padding-left: 46px; }
.check { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; font-size: 15px; }
.check input { width: 22px; height: 22px; accent-color: var(--ink); flex: none; margin: 1px 0 0; }

/* ---------- Сегменты ---------- */
.seg { display: inline-flex; max-width: 100%; overflow-x: auto; scrollbar-width: none; background: var(--surface); border-radius: var(--pill); padding: 4px; gap: 2px; }
.seg::-webkit-scrollbar { display: none; }
.seg button { border: 0; background: transparent; height: 36px; padding: 0 16px; border-radius: var(--pill); cursor: pointer; font-size: 15px; white-space: nowrap; transition: background .15s; }
.seg button.on { background: #fff; box-shadow: 0 1px 4px rgba(34, 34, 34, .1); font-weight: 500; }
.card .seg { background: #fff; }
.card .seg button.on { background: var(--lime); box-shadow: none; }

/* ---------- Списки и таблицы ---------- */
.list { display: flex; flex-direction: column; }
.list-item { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-top: 1px solid var(--hair); }
.list-item:first-child { border-top: 0; }
.card .list-item { border-top-color: #E4E6E9; }
.tbl { width: 100%; border-collapse: collapse; font-size: 15px; }
.tbl th { text-align: left; font-weight: 500; font-size: 13px; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.tbl td { padding: 12px; border-bottom: 1px solid var(--hair); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.card .tbl td { border-bottom-color: #E4E6E9; }
.tbl-wrap { overflow-x: auto; }

/* ---------- Аватары ---------- */
.av { width: 100%; height: 100%; }
.ava-w { position: relative; display: inline-grid; place-items: center; width: var(--s, 48px); height: var(--s, 48px); border-radius: 50%; flex: none; }
.ava { width: 100%; height: 100%; border-radius: 50%; overflow: hidden; background: radial-gradient(circle at 50% 30%, var(--ab1, #EEFFBF), var(--ab2, #C1FF05)); display: block; }
.ava svg { width: 100%; height: 100%; }
.ava-w.f-lime { padding: 3px; background: var(--lime); }
.ava-w.f-flame { padding: 3px; background: conic-gradient(from 200deg, #FF6B3D, #FFB341, #FFE066, #FF8A3D, #FF6B3D); }
.ava-w.f-learning { padding: 3px; background: conic-gradient(from 90deg, #62AEF2, #B9DEFF, #62AEF2); }
.ava-w.f-choice { padding: 3px; background: conic-gradient(from 30deg, #C1FF05, #9E6FC3, #80C0FA, #C1FF05); }
.ava-w.f-route { padding: 3px; background: repeating-conic-gradient(var(--ink) 0 12deg, var(--lime) 12deg 24deg); }
.ava-w[class*="f-"] .ava { box-shadow: 0 0 0 2px #fff; }
.ava-w.f-none { padding: 0; background: none; }
.ava-w.f-none .ava { box-shadow: none; }
.ava-stack { display: flex; }
.ava-stack .ava-w { margin-left: -10px; }
.ava-stack .ava-w:first-child { margin-left: 0; }

/* ---------- Профиль в стиле Telegram ---------- */
.tg { position: relative; border-radius: var(--r-lg); overflow: hidden; color: var(--tg-ink, #222); display: flex; flex-direction: column; align-items: center; text-align: center; padding: 32px 24px 26px; isolation: isolate; }
.tg-bg { position: absolute; inset: 0; z-index: -1; }
.tg-bg svg { width: 100%; height: 100%; }
.tg-ava { --s: 140px; }
.tg-ava .ava { background: rgba(255, 255, 255, .28); }
.tg-name { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; margin-top: 16px; display: inline-flex; align-items: center; gap: 8px; line-height: 1.15; }
.tg-name .emoji { font-size: 22px; }
.tg-sub { font-size: 15px; opacity: .78; margin-top: 4px; }
.tg-badges { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
.tg-badge { height: 30px; padding: 0 12px; border-radius: var(--pill); background: rgba(255, 255, 255, .55); color: var(--ink); font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; backdrop-filter: blur(6px); }
.tg[data-ink="light"] .tg-badge { background: rgba(255, 255, 255, .18); color: #fff; }
.tg-showcase { display: flex; gap: 10px; justify-content: center; margin-top: 16px; }
.tg-gift { width: 64px; height: 64px; border-radius: 18px; background: rgba(255, 255, 255, .5); display: grid; place-items: center; position: relative; overflow: hidden; }
.tg[data-ink="light"] .tg-gift { background: rgba(255, 255, 255, .16); }
.tg-gift svg { width: 100%; height: 100%; }
.tg-gift .emoji { font-size: 30px; }
.tg-actions { display: flex; gap: 10px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
.tg-actions .btn-secondary { background: rgba(255, 255, 255, .7); }
.tg-actions .btn-secondary:hover { background: #fff; }
.tg[data-ink="light"] .tg-actions .btn-secondary { background: rgba(255, 255, 255, .16); color: #fff; }

/* ---------- Модальные окна ---------- */
.modal-overlay { position: fixed; inset: 0; z-index: 100; background: rgba(34, 34, 34, .5); display: flex; align-items: center; justify-content: center; padding: 24px; animation: fadeIn .18s ease both; }
.modal-overlay.closing { animation: fadeOut .16s ease both; }
.modal { background: #fff; border-radius: var(--r-lg); width: 100%; max-width: 560px; max-height: calc(100vh - 48px); overflow: auto; position: relative; padding: 32px; animation: popIn .26s cubic-bezier(.2, .9, .3, 1.2) both; box-shadow: var(--shadow-lg); overscroll-behavior: contain; }
.modal.m-wide { max-width: 760px; }
.modal.m-xl { max-width: 980px; }
.modal-x { position: absolute; top: 18px; right: 18px; width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--surface); cursor: pointer; display: grid; place-items: center; z-index: 2; }
.modal-x:hover { background: var(--surface-2); }
.modal-title { font-size: 28px; font-weight: 500; letter-spacing: -0.015em; line-height: 1.15; padding-right: 44px; }
.modal-sub { color: var(--muted); margin-top: 8px; }
.modal-body { margin-top: 24px; }
.modal-foot { display: flex; gap: 10px; margin-top: 28px; flex-wrap: wrap; }
.steps { display: flex; gap: 6px; margin-top: 18px; }
.steps i { flex: 1; height: 4px; border-radius: 4px; background: var(--surface-2); }
.steps i.on { background: var(--ink); }

/* ---------- Тосты, подсказки ---------- */
.toast-root { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 300; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
.toast { background: var(--ink); color: #fff; border-radius: var(--pill); padding: 13px 22px 13px 14px; display: flex; align-items: center; gap: 12px; font-size: 15px; box-shadow: var(--shadow-lg); animation: toastIn .3s cubic-bezier(.2, .9, .3, 1.2) both; max-width: min(560px, calc(100vw - 32px)); }
.toast.out { animation: toastOut .25s ease both; }
.toast-ic { width: 30px; height: 30px; border-radius: 50%; background: var(--lime); color: var(--ink); display: grid; place-items: center; flex: none; }
.tooltip { position: fixed; z-index: 400; pointer-events: none; background: var(--ink); color: #fff; font-size: 13px; line-height: 1.35; padding: 8px 11px; border-radius: 10px; max-width: 260px; box-shadow: var(--shadow); }
.tooltip b { font-weight: 600; }
.menu { position: fixed; z-index: 120; background: #fff; border-radius: var(--r); box-shadow: var(--shadow-lg); padding: 8px; min-width: 260px; animation: popIn .18s ease both; }
.menu-item { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 12px; cursor: pointer; border: 0; background: none; width: 100%; text-align: left; font-size: 15px; }
.menu-item:hover { background: var(--surface); }
.menu-sep { height: 1px; background: var(--hair); margin: 6px 4px; }
.notif { display: flex; gap: 12px; padding: 12px; border-radius: 12px; cursor: pointer; align-items: flex-start; }
.notif:hover { background: var(--surface); }
.notif-ic { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--surface); }
.notif.unread .notif-ic { background: var(--lime); }

/* ---------- Эффекты ---------- */
.fly-coin { position: fixed; z-index: 500; pointer-events: none; will-change: transform, opacity; }
.confetti-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 450; }
.pop { animation: popIn .35s cubic-bezier(.2, .9, .3, 1.4) both; }
.float { animation: float 3.2s ease-in-out infinite; }
.pulse-lime { animation: pulseLime 1.8s ease-out infinite; }

@keyframes viewIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeOut { to { opacity: 0; } }
@keyframes popIn { from { opacity: 0; transform: scale(.94) translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes toastIn { from { opacity: 0; transform: translateY(16px) scale(.96); } to { opacity: 1; transform: none; } }
@keyframes toastOut { to { opacity: 0; transform: translateY(10px); } }
@keyframes bump { 0% { transform: scale(1); } 35% { transform: scale(1.12); background: var(--lime); } 100% { transform: scale(1); } }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@keyframes pulseLime { 0% { box-shadow: 0 0 0 0 rgba(193, 255, 5, .7); } 100% { box-shadow: 0 0 0 16px rgba(193, 255, 5, 0); } }
@keyframes wiggle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }
@keyframes hop { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-14px); } 60% { transform: translateY(-14px); } }
@keyframes shine { from { background-position: 200% 0; } to { background-position: -200% 0; } }
@keyframes spinSlow { to { transform: rotate(360deg); } }

/* ---------- Анимация аватара (шаг и покачивание) ---------- */
.av-leg-l, .av-leg-r, .av-arm-l, .av-arm-r { transform-box: view-box; }
.av-leg-l { transform-origin: 82px 240px; }
.av-leg-r { transform-origin: 118px 240px; }
.av-arm-l { transform-origin: 57px 152px; }
.av-arm-r { transform-origin: 143px 152px; }
.walking .av-leg-l { animation: stepL .42s ease-in-out infinite; }
.walking .av-leg-r { animation: stepR .42s ease-in-out infinite; }
.walking .av-arm-l { animation: armL .42s ease-in-out infinite; }
.walking .av-arm-r { animation: armR .42s ease-in-out infinite; }
.walking .av-body { animation: bodyBob .21s ease-in-out infinite alternate; }
@keyframes stepL { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
@keyframes stepR { 0%, 100% { transform: translateY(-9px); } 50% { transform: translateY(0); } }
@keyframes armL { 0%, 100% { transform: rotate(14deg); } 50% { transform: rotate(0deg); } }
@keyframes armR { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-14deg); } }
@keyframes bodyBob { from { transform: translateY(0); } to { transform: translateY(-4px); } }
.idle .av-body { animation: idleBreath 3s ease-in-out infinite; }
@keyframes idleBreath { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
.wave .av-arm-r { animation: waveArm .5s ease-in-out 3; }
@keyframes waveArm { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-150deg); } }
.hop { animation: hop .6s ease; }

/* ---------- Главная ---------- */
.hello { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; margin-bottom: 28px; }
.hello .h1 span { color: var(--muted); }
.quick { display: flex; gap: 10px; flex-wrap: wrap; }
.hero-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; }
.hero-profile { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 0; padding: 0; overflow: hidden; }
.hero-profile .tg { border-radius: 0; height: 100%; justify-content: center; }
.hero-info { padding: 28px; display: flex; flex-direction: column; gap: 18px; }
.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: #fff; border-radius: 14px; padding: 14px; }
.stat-v { font-size: 26px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.1; display: flex; align-items: center; gap: 6px; }
.stat-l { font-size: 13px; color: var(--muted); margin-top: 4px; line-height: 1.3; }
.balance-card { display: flex; flex-direction: column; gap: 18px; }
.bal-big { display: flex; align-items: center; gap: 14px; }
.bal-big .v { font-size: 40px; font-weight: 500; letter-spacing: -0.03em; line-height: 1; }
.bal-big .l { font-size: 14px; color: var(--muted); margin-top: 4px; }
.reward-call { background: var(--ink); color: #fff; border-radius: 14px; padding: 16px 16px 16px 18px; display: flex; align-items: center; gap: 14px; }
.reward-call .grow b { display: block; font-size: 17px; font-weight: 500; }
.reward-call .grow span { font-size: 13px; color: rgba(255, 255, 255, .62); }
.reward-gift { width: 44px; height: 44px; border-radius: 12px; background: var(--lime); display: grid; place-items: center; flex: none; color: var(--ink); animation: wiggle 2.4s ease-in-out infinite; }
.bal-split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.bal-split .stat { padding: 16px; }

/* Игра */
.runner-card { padding: 0; overflow: hidden; }
.runner-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 22px 24px 0; flex-wrap: wrap; }
.runner-wrap { position: relative; margin: 16px 24px 0; border-radius: 14px; overflow: hidden; background: #fff; height: 240px; cursor: pointer; outline: none; -webkit-tap-highlight-color: transparent; user-select: none; }
.runner-wrap:focus-visible { box-shadow: 0 0 0 3px var(--ink); }
.runner-wrap canvas { width: 100%; height: 100%; display: block; }
.runner-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; background: rgba(255, 255, 255, .55); backdrop-filter: blur(2px); transition: opacity .2s; }
.runner-overlay .h3 { font-size: 26px; }
.runner-foot { display: flex; align-items: center; gap: 18px; padding: 16px 24px 22px; flex-wrap: wrap; }
.runner-foot .grow .bar { margin-top: 8px; }
.kbd { display: inline-grid; place-items: center; min-width: 26px; height: 24px; padding: 0 7px; border-radius: 6px; background: #fff; box-shadow: inset 0 -2px 0 var(--border), inset 0 0 0 1px var(--border); font-size: 12px; font-weight: 600; }

/* Стрик */
.streak-num { display: flex; align-items: center; gap: 10px; }
.streak-num .v { font-size: 54px; font-weight: 500; letter-spacing: -0.04em; line-height: 1; }
.flame { width: 44px; height: 54px; }
.flame.lit { animation: float 2.4s ease-in-out infinite; }
.days { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; margin-top: 16px; }
.days i { aspect-ratio: 1; border-radius: 6px; background: #fff; display: block; }
.days i.on { background: var(--ink); }
.days i.today { box-shadow: inset 0 0 0 2px var(--ink); background: #fff; }
.days i.today.on { background: var(--lime); box-shadow: inset 0 0 0 2px var(--ink); }
.days i.off { background: transparent; box-shadow: inset 0 0 0 1px #D9DBDF; }
.task { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: #fff; border-radius: 12px; cursor: pointer; border: 0; width: 100%; text-align: left; font-size: 15px; transition: background .15s; }
.task:hover { background: #FAFAFA; }
.task .tick { width: 22px; height: 22px; border-radius: 7px; box-shadow: inset 0 0 0 2px var(--border); display: grid; place-items: center; flex: none; transition: background .15s, box-shadow .15s; }
.task.done .tick { background: var(--lime); box-shadow: inset 0 0 0 2px var(--lime); }
.task.done .t { text-decoration: line-through; color: var(--muted); }

/* Питомец */
.pet-card { display: flex; flex-direction: column; }
.pet-stage { position: relative; height: 150px; display: grid; place-items: end center; cursor: pointer; }
.pet-stage svg { width: 150px; height: 125px; }
.pet-bubble { position: absolute; top: 0; left: 50%; transform: translateX(-50%); background: #fff; border-radius: 14px; padding: 8px 12px; font-size: 13px; line-height: 1.35; max-width: 92%; box-shadow: 0 4px 14px rgba(34, 34, 34, .08); text-align: center; animation: popIn .25s ease both; }
.pet-bubble::after { content: ''; position: absolute; bottom: -6px; left: 50%; margin-left: -6px; border: 6px solid transparent; border-bottom: 0; border-top-color: #fff; }

/* Лента */
.feed-item { display: flex; gap: 14px; padding: 16px 0; border-top: 1px solid #E4E6E9; }
.feed-item:first-child { border-top: 0; padding-top: 0; }
.feed-text { font-size: 15px; line-height: 1.45; }
.feed-text b { font-weight: 500; }
.feed-quote { margin-top: 6px; color: var(--text); background: #fff; border-radius: 12px; padding: 10px 14px; font-size: 15px; }
.feed-meta { display: flex; align-items: center; gap: 10px; margin-top: 8px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.via { display: inline-flex; align-items: center; gap: 5px; }

/* Мой путь */
.path-item + .path-item { margin-top: 16px; }

/* ---------- Бонусы ---------- */
.bonus-hero { display: grid; grid-template-columns: 1fr 1fr minmax(0, 1.1fr); gap: 20px; }
.bonus-bal .v { font-size: 48px; font-weight: 500; letter-spacing: -0.03em; line-height: 1; margin-top: 18px; }
.bonus-bal .rub { color: var(--muted); font-size: 14px; margin-top: 6px; }
.pending-row { display: flex; align-items: center; gap: 16px; background: #fff; border-radius: 14px; padding: 16px 16px 16px 18px; }
.pending-row + .pending-row { margin-top: 10px; }
.pending-row .amt { font-size: 22px; font-weight: 500; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
.way { display: flex; flex-direction: column; gap: 10px; }
.way-n { width: 36px; height: 36px; border-radius: 50%; background: var(--lime); display: grid; place-items: center; font-weight: 600; }
.way .amount { font-size: 22px; font-weight: 500; letter-spacing: -0.02em; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.no-coins { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.no-coins span { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: var(--pill); background: #fff; font-size: 14px; color: var(--muted-2); }
.range { width: 100%; accent-color: var(--ink); height: 28px; }
.order-status { display: flex; gap: 6px; margin-top: 10px; }
.order-status i { flex: 1; height: 4px; border-radius: 4px; background: var(--surface-2); }
.order-status i.on { background: var(--ink); }
.rate { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.rate-stars { display: inline-flex; flex-direction: row-reverse; gap: 2px; }
.rate-star { border: 0; background: none; padding: 2px; cursor: pointer; color: #A2A7AE; display: grid; place-items: center; }
.rate-star svg { transition: fill .12s; }
.rate-star:disabled { cursor: default; }
.rate-star.on, .rate-star:not(:disabled):hover, .rate-star:not(:disabled):hover ~ .rate-star { color: var(--ink); }
.rate-star.on svg, .rate-star:not(:disabled):hover svg, .rate-star:not(:disabled):hover ~ .rate-star svg { fill: var(--lime); }

/* ---------- Гардероб ---------- */
.fitting { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 20px; align-items: start; }
.mirror { position: sticky; top: calc(var(--header-h) + 16px); border-radius: var(--r-lg); overflow: hidden; background: var(--violet-2); padding: 20px; }
.mirror-frame { position: relative; border-radius: 160px 160px 22px 22px; background: linear-gradient(180deg, #fff 0%, #F7F2FB 100%); box-shadow: inset 0 0 0 8px #fff, inset 0 0 0 10px var(--border); height: 520px; overflow: hidden; display: grid; place-items: end center; }
.mirror-frame .stage-bg { position: absolute; inset: 0; }
.mirror-frame .stage-bg svg { width: 100%; height: 100%; }
.mirror-av { position: relative; width: 250px; height: 400px; margin-bottom: 28px; }
.mirror-av .av { width: 100%; height: 100%; }
.mirror-pet { position: absolute; left: calc(50% + 92px); bottom: 26px; width: 96px; height: 80px; }
.mirror-pet svg { width: 100%; height: 100%; }
.mirror-tag { position: absolute; top: 22px; left: 50%; transform: translateX(-50%); z-index: 2; }
.mirror-actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.mirror-actions .btn-primary { flex: 1; }
.curtain { position: absolute; top: 0; bottom: 0; width: 34px; background: repeating-linear-gradient(90deg, #9E6FC3 0 8px, #8D5FB4 8px 14px); opacity: .9; z-index: 1; }
.curtain.l { left: 0; border-radius: 0 0 18px 0; }
.curtain.r { right: 0; border-radius: 0 0 0 18px; }
.ward-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
.sub-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.items { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
.item { background: #fff; border-radius: 16px; padding: 8px 8px 10px; border: 0; cursor: pointer; position: relative; text-align: center; transition: box-shadow .15s, transform .15s; display: flex; flex-direction: column; align-items: stretch; gap: 6px; }
.item:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.item.on { box-shadow: inset 0 0 0 2.5px var(--ink); }
.item-pic { aspect-ratio: 1; border-radius: 12px; background: var(--surface); overflow: hidden; display: grid; place-items: center; }
.item-pic svg { width: 100%; height: 100%; }
.item-pic .emoji { font-size: 38px; }
.item-name { font-size: 13px; line-height: 1.25; font-weight: 500; min-height: 32px; display: flex; align-items: center; justify-content: center; }
.item-tag { font-size: 11px; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 4px; min-height: 16px; }
.item .lock { position: absolute; top: 12px; right: 12px; width: 24px; height: 24px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; }
.item .owned-mark { position: absolute; top: 12px; right: 12px; width: 22px; height: 22px; border-radius: 50%; background: var(--lime); display: grid; place-items: center; }
.item.locked .item-pic { opacity: .7; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatch { width: 34px; height: 34px; border-radius: 50%; border: 0; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12); position: relative; transition: transform .12s; }
.swatch:hover { transform: scale(1.08); }
.swatch.on { box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--ink); }
.opt-group + .opt-group { margin-top: 22px; }
.opt-title { font-size: 14px; color: var(--muted); margin-bottom: 10px; display: flex; justify-content: space-between; }
.emoji-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: 8px; }
.emoji-btn { aspect-ratio: 1; border-radius: 14px; border: 0; background: #fff; cursor: pointer; font-size: 24px; font-family: var(--emoji); transition: transform .12s; }
.emoji-btn:hover { transform: scale(1.08); }
.emoji-btn.on { box-shadow: inset 0 0 0 2.5px var(--ink); }
.try-note { display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 14px; padding: 12px 14px; font-size: 14px; margin-top: 12px; }

/* ---------- Магазин ---------- */
.window-bar { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
.prod { background: var(--surface); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; cursor: pointer; transition: transform .18s, box-shadow .18s; border: 0; text-align: left; }
.prod:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
.prod-pic { aspect-ratio: 4 / 3; border-radius: 12px; background: #fff; overflow: hidden; position: relative; display: grid; place-items: center; }
.prod-pic > svg { width: 100%; height: 100%; }
.prod-pic .twin { position: absolute; right: 10px; bottom: 10px; width: 64px; height: 64px; border-radius: 50%; background: var(--violet-2); overflow: hidden; box-shadow: 0 0 0 3px #fff; }
.prod-pic .twin svg { width: 100%; height: 100%; }
.prod-name { font-size: 17px; font-weight: 500; line-height: 1.3; }
.prod-desc { font-size: 14px; color: var(--muted); line-height: 1.4; }
.prod-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: auto; }
.prod-price { font-size: 19px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.stock { font-size: 12px; color: var(--muted); }
.cert-pic { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 16px; text-align: left; }
.cert-pic b { font-size: 28px; font-weight: 500; letter-spacing: -0.02em; }

/* ---------- Коллеги ---------- */
.people-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
.pcard { background: var(--surface); border-radius: var(--r); overflow: hidden; cursor: pointer; transition: transform .18s, box-shadow .18s; display: flex; flex-direction: column; border: 0; text-align: left; padding: 0; }
.pcard:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
.pcard-top { position: relative; height: 128px; display: grid; place-items: center; overflow: hidden; isolation: isolate; }
.pcard-top .tg-bg { position: absolute; inset: 0; z-index: -1; }
.pcard-top .tg-bg svg { width: 100%; height: 100%; }
.pcard-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.pcard-name { font-weight: 500; font-size: 17px; display: flex; align-items: center; gap: 6px; }
.pcard-role { font-size: 13px; color: var(--muted); line-height: 1.35; }
.pcard-foot { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.profile-layout { display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 20px; align-items: start; }
.profile-side { position: sticky; top: calc(var(--header-h) + 16px); display: flex; flex-direction: column; gap: 16px; }
.ach { background: #fff; border-radius: 16px; padding: 20px; }
.ach + .ach { margin-top: 12px; }
.ach-title { font-size: 19px; font-weight: 500; margin-top: 8px; line-height: 1.3; }
.ach-text { margin-top: 8px; color: var(--text); }
.ach-res { margin-top: 10px; font-size: 14px; color: var(--muted-2); }
.ach-foot { display: flex; align-items: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.wear-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }

/* ---------- Выбор коллег ---------- */
.stages { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stage { background: var(--surface); border-radius: 14px; padding: 14px 16px; border: 0; text-align: left; cursor: pointer; transition: background .15s; position: relative; }
.stage:hover { background: var(--surface-2); }
.stage.on { background: var(--ink); color: #fff; }
.stage.on .muted { color: rgba(255, 255, 255, .6); }
.stage.done::after { content: ''; position: absolute; top: 14px; right: 14px; width: 8px; height: 8px; border-radius: 50%; background: var(--lime-ink); }
.stage b { display: block; font-weight: 500; font-size: 15px; }
.vote-cat + .vote-cat { margin-top: 36px; }
.fin-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.fin { background: var(--surface); border-radius: var(--r); padding: 20px; display: flex; flex-direction: column; gap: 10px; position: relative; transition: box-shadow .2s; }
.fin.voted { box-shadow: inset 0 0 0 2.5px var(--ink); background: #fff; }
.fin.blocked { opacity: .72; }
.fin-title { font-size: 18px; font-weight: 500; line-height: 1.3; }
.fin-who { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.fin-foot { display: flex; align-items: center; gap: 10px; margin-top: auto; padding-top: 6px; flex-wrap: wrap; }
.result-bar { height: 10px; border-radius: var(--pill); background: #fff; overflow: hidden; margin-top: 6px; }
.result-bar i { display: block; height: 100%; background: var(--ink); border-radius: inherit; }
.winner { background: var(--ink); color: #fff; }
.winner .muted { color: rgba(255, 255, 255, .6); }
.winner .result-bar { background: rgba(255, 255, 255, .15); }
.winner .result-bar i { background: var(--lime); }

/* ---------- Кабинет руководителя ---------- */
.kpi { display: flex; flex-direction: column; gap: 6px; }
.kpi-v { font-size: 34px; font-weight: 500; letter-spacing: -0.03em; line-height: 1.05; display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.kpi-v small { font-size: 16px; color: var(--muted); font-weight: 400; letter-spacing: 0; }
.kpi .bar { margin-top: 10px; }
.tiers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 18px; }
.tier { border-radius: 16px; padding: 18px; background: rgba(255, 255, 255, .08); position: relative; }
.tier.on { background: var(--lime); color: var(--ink); }
.tier.on .muted { color: rgba(34, 34, 34, .65); }
.tier.done { background: rgba(193, 255, 5, .16); }
.tier-pct { font-size: 40px; font-weight: 500; letter-spacing: -0.03em; line-height: 1; }
.tier-name { font-weight: 500; margin-top: 10px; }
.tier-cond { font-size: 13px; margin-top: 6px; line-height: 1.4; }
.tier-check { position: absolute; top: 16px; right: 16px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 255, 255, .12); }
.tier.on .tier-check, .tier.done .tier-check { background: var(--ink); color: var(--lime); }
.bonus-calc { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-top: 20px; padding-top: 18px; border-top: 1px solid rgba(255, 255, 255, .12); }
.bonus-calc .v { font-size: 30px; font-weight: 500; letter-spacing: -0.02em; }
.chart-card .card-head { margin-bottom: 8px; }
.chart { width: 100%; position: relative; }
.chart svg { width: 100%; height: auto; overflow: visible; }
.chart text { font-family: var(--font); }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--text); margin-top: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.donut-wrap { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
.donut-wrap svg { width: 168px; height: 168px; flex: none; }
.donut-legend { display: flex; flex-direction: column; gap: 12px; flex: 1; min-width: 160px; }
.donut-legend div { display: flex; align-items: center; gap: 10px; font-size: 15px; }
.donut-legend i { width: 12px; height: 12px; border-radius: 4px; flex: none; }
.donut-legend b { margin-left: auto; font-weight: 500; font-variant-numeric: tabular-nums; }
.heat { display: grid; gap: 3px; align-items: center; font-size: 13px; }
.heat-cell { height: 22px; border-radius: 5px; }
.heat-name { display: flex; align-items: center; gap: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 8px; }
.heat-head { font-size: 11px; color: var(--muted); text-align: center; white-space: nowrap; }
.heat-head.end { direction: rtl; }
.show-s { display: none; }
.person-row { display: flex; align-items: center; gap: 12px; min-width: 0; }
.person-row .nm { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.person-row .rl { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.review { background: #fff; border-radius: 16px; padding: 20px; }
.review + .review { margin-top: 12px; }
.tier-pick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tier-opt { background: var(--surface); border-radius: 16px; padding: 16px; border: 0; cursor: pointer; text-align: left; transition: box-shadow .15s, background .15s; }
.tier-opt:hover { background: var(--surface-2); }
.tier-opt.on { background: #fff; box-shadow: inset 0 0 0 2.5px var(--ink); }
.tier-opt b { display: flex; align-items: center; gap: 6px; font-size: 20px; font-weight: 500; margin-top: 6px; }
.tbl-toggle { font-size: 13px; }

/* ---------- Офис ---------- */
.office-card { padding: 0; overflow: hidden; background: #EAF5FF; }
.office-stage { position: relative; }
.office-svg { width: 100%; height: auto; display: block; user-select: none; -webkit-user-select: none; touch-action: manipulation; cursor: pointer; }
.office-svg .npc .av-body { animation-delay: var(--d, 0s); }
.office-svg .hot { cursor: pointer; }
.office-svg .hot .hot-glow { opacity: 0; transition: opacity .2s; }
.office-svg .hot:hover .hot-glow, .office-svg .hot.near .hot-glow { opacity: 1; }
.office-svg .npc { cursor: pointer; }
.office-svg .npc .tag { opacity: 0; transition: opacity .15s; }
.office-svg .npc:hover .tag { opacity: 1; }
.office-svg .gift-bob { animation: float 2s ease-in-out infinite; }
.office-svg .me-tag { animation: float 1.6s ease-in-out infinite; }
.office-hud { position: absolute; left: 16px; right: 16px; top: 16px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; pointer-events: none; }
.office-hud > * { pointer-events: auto; }
.hud-pill { background: rgba(255, 255, 255, .94); border-radius: var(--pill); height: 44px; padding: 0 16px 0 8px; display: inline-flex; align-items: center; gap: 10px; box-shadow: 0 4px 16px rgba(34, 34, 34, .1); font-size: 15px; }
.hud-pill .z-ic { width: 30px; height: 30px; border-radius: 50%; background: var(--lime); display: grid; place-items: center; }
.route-dots { display: inline-flex; gap: 4px; }
.route-dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--surface-2); }
.route-dots i.on { background: var(--ink); }
.office-prompt { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--ink); color: #fff; border-radius: var(--pill); padding: 10px 12px 10px 18px; display: flex; align-items: center; gap: 12px; font-size: 15px; box-shadow: var(--shadow-lg); animation: toastIn .2s ease both; white-space: nowrap; max-width: calc(100% - 32px); }
.zone-cards { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
.zone { background: var(--surface); border-radius: 16px; padding: 14px; border: 0; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 8px; transition: background .15s, transform .15s; position: relative; }
.zone:hover { background: var(--surface-2); transform: translateY(-2px); }
.zone.here { background: var(--lime-2); }
.zone-ic { width: 36px; height: 36px; border-radius: 10px; background: #fff; display: grid; place-items: center; }
.zone b { font-weight: 500; font-size: 15px; line-height: 1.25; }
.zone .stamp-ok { position: absolute; top: 12px; right: 12px; width: 22px; height: 22px; border-radius: 50%; background: var(--ink); color: var(--lime); display: grid; place-items: center; }
.story { background: var(--surface); border-radius: 16px; padding: 18px; }
.stamp-big { width: 92px; height: 92px; border-radius: 50%; background: var(--lime); display: grid; place-items: center; margin: 0 auto; animation: popIn .5s cubic-bezier(.2, .9, .3, 1.5) both; box-shadow: 0 0 0 8px var(--lime-3); }

/* ---------- Онбординг ---------- */
.onb-ava { width: 170px; height: 270px; margin: 0 auto; }
.onb-grid { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 24px; align-items: center; }

/* ---------- Выбор коллеги ---------- */
.picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; max-height: 236px; overflow: auto; padding: 2px; }
.pick { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 14px; border: 0; background: var(--surface); cursor: pointer; text-align: left; width: 100%; transition: background .15s, box-shadow .15s; }
.pick:hover { background: var(--surface-2); }
.pick.on { background: #fff; box-shadow: inset 0 0 0 2px var(--ink); }
.pick b { display: block; font-weight: 500; font-size: 14px; line-height: 1.3; }
.pick small { display: block; font-size: 12px; color: var(--muted); line-height: 1.3; }
.chosen { display: flex; align-items: center; gap: 12px; background: var(--surface); border-radius: 16px; padding: 10px 12px; }

/* ---------- Образ на главной ---------- */
.hero-look { position: relative; display: grid; place-items: end center; min-height: 340px; overflow: hidden; isolation: isolate; }
.hero-look .tg-bg { position: absolute; inset: 0; z-index: -1; }
.hero-look .tg-bg svg { width: 100%; height: 100%; }
.hero-av { width: 184px; height: 294px; margin-bottom: 14px; }
.hero-av .av { width: 100%; height: 100%; }
.hero-pet { position: absolute; right: 12px; bottom: 16px; width: 78px; height: 65px; }
.hero-pet svg { width: 100%; height: 100%; }
.hero-emoji { position: absolute; top: 16px; left: 16px; width: 44px; height: 44px; border-radius: 50%; background: rgba(255, 255, 255, .75); display: grid; place-items: center; font-size: 22px; font-family: var(--emoji); }
.hero-edit { position: absolute; top: 16px; right: 16px; height: 34px; padding: 0 12px; border-radius: var(--pill); background: rgba(255, 255, 255, .85); display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: var(--ink); transition: background .15s; }
.hero-look:hover .hero-edit { background: #fff; }
.office-teaser { display: flex; flex-direction: column; gap: 14px; overflow: hidden; }
.office-teaser svg.mini { width: 100%; height: auto; border-radius: 12px; }

/* ---------- Вход ---------- */
body.is-auth #topbar, body.is-auth #header, body.is-auth #tabbar { display: none; }
body.is-auth .view { padding: 0; }
.auth { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); min-height: 100vh; }
.auth-hero { position: relative; overflow: hidden; isolation: isolate; padding: 36px 56px 0; display: flex; flex-direction: column; min-height: 100vh; }
.auth-hero .tg-bg { position: absolute; inset: 0; z-index: -1; }
.auth-hero .tg-bg svg { width: 100%; height: 100%; }
.auth-title { font-size: clamp(40px, 4.2vw, 60px); line-height: 1.04; font-weight: 500; letter-spacing: -0.035em; margin-top: 64px; }
.auth-lead { font-size: 19px; margin-top: 18px; max-width: 470px; color: rgba(34, 34, 34, .72); }
.auth-crowd { position: relative; margin-top: auto; display: flex; align-items: flex-end; justify-content: center; padding-top: 70px; min-height: 340px; }
.auth-crowd .p { width: 150px; height: 240px; margin: 0 -10px; }
.auth-crowd .p.big { width: 190px; height: 304px; z-index: 2; }
.auth-crowd .p.far { width: 132px; height: 211px; }
.auth-crowd .p .av { width: 100%; height: 100%; }
.auth-pet { position: absolute; bottom: 8px; left: calc(50% + 120px); width: 84px; height: 70px; z-index: 3; }
.auth-pet svg { width: 100%; height: 100%; }
.auth-float { position: absolute; display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px 0 10px; border-radius: var(--pill); background: #fff; font-size: 14px; font-weight: 500; box-shadow: 0 10px 30px rgba(34, 34, 34, .12); animation: float 3.4s ease-in-out infinite; z-index: 4; white-space: nowrap; }
.auth-float.f1 { left: 4%; top: 30px; background: var(--ink); color: #fff; }
.auth-float.f2 { right: 6%; top: 8px; animation-delay: .8s; }
.auth-float.f3 { right: 2%; top: 120px; animation-delay: 1.6s; }
.auth-panel { display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 48px 32px; background: #fff; }
.auth-card { width: 100%; max-width: 460px; }
.auth-mark { display: flex; align-items: center; gap: 8px; }
.sso-btn { gap: 12px; }
.auth-or { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; margin: 26px 0 14px; }
.auth-or::before, .auth-or::after { content: ''; flex: 1; height: 1px; background: var(--hair); }
.acc-list { display: flex; flex-direction: column; gap: 10px; }
.acc { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 18px; background: var(--surface); border: 0; cursor: pointer; text-align: left; width: 100%; transition: background .15s, transform .15s; }
.acc:hover { background: var(--surface-2); transform: translateY(-1px); }
.acc:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.acc b { display: block; font-weight: 500; }
.acc small { display: block; font-size: 13px; color: var(--muted); line-height: 1.35; margin-top: 2px; }
.acc-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.acc > svg { flex: none; color: var(--muted); transition: transform .15s; }
.acc:hover > svg { transform: translateX(3px); color: var(--ink); }
.auth-foot { max-width: 460px; font-size: 12px; color: var(--faint); margin-top: 36px; text-align: center; line-height: 1.5; }
.sso-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 28px; }
.sso-logo { display: inline-flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
.sso-check { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 40px 0; text-align: center; }
.spinner { width: 40px; height: 40px; border-radius: 50%; border: 4px solid var(--surface-2); border-top-color: var(--ink); animation: spinSlow .8s linear infinite; }
@media (max-width: 1080px) {
  .auth { grid-template-columns: 1fr; }
  .auth-hero { min-height: auto; padding: 24px 20px 0; }
  .auth-title { font-size: 40px; margin-top: 28px; }
  .auth-lead { font-size: 17px; }
  .auth-crowd { min-height: 250px; padding-top: 56px; }
  .auth-crowd .p { width: 104px; height: 166px; }
  .auth-crowd .p.big { width: 132px; height: 211px; }
  .auth-crowd .p.far { display: none; }
  .auth-pet { left: calc(50% + 70px); width: 64px; height: 53px; }
  .auth-float.f3 { display: none; }
  .auth-panel { padding: 32px 20px 40px; }
}
@media (max-width: 520px) {
  .auth-hero { padding: 18px 16px 0; }
  .auth-title { font-size: 30px; margin-top: 18px; }
  .auth-lead { font-size: 15px; margin-top: 10px; }
  .auth-crowd { min-height: 0; padding-top: 34px; }
  .auth-crowd .p { width: 74px; height: 118px; margin: 0 -6px; }
  .auth-crowd .p.big { width: 94px; height: 150px; }
  .auth-pet { left: calc(50% + 48px); width: 48px; height: 40px; bottom: 4px; }
  .auth-float { height: 30px; font-size: 12px; padding: 0 12px 0 8px; }
  .auth-float.f1 { top: 0; left: 0; }
  .auth-float.f2 { top: 0; right: 0; }
  .auth-panel { padding: 24px 16px 32px; }
  .auth-card .auth-mark { display: none; }
  .auth-card .h2 { margin-top: 0; }
}

/* ---------- «Тыц»: отклик на каждый клик ---------- */
.tap { position: fixed; z-index: 700; width: 0; height: 0; pointer-events: none; }
.tap::before { content: ''; position: absolute; left: -20px; top: -20px; width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--lime); box-shadow: 0 0 0 1.5px rgba(34, 34, 34, .28), inset 0 0 0 1.5px rgba(34, 34, 34, .18); animation: tapRing .5s cubic-bezier(.2, .8, .3, 1) forwards; }
.tap i { position: absolute; left: -3.5px; top: -3.5px; width: 7px; height: 7px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 0 1px rgba(34, 34, 34, .25); animation: tapSpark .55s cubic-bezier(.2, .8, .3, 1) forwards; }
.tap i:nth-child(1) { --a: -90deg; }
.tap i:nth-child(2) { --a: -30deg; background: var(--violet); }
.tap i:nth-child(3) { --a: 30deg; }
.tap i:nth-child(4) { --a: 90deg; background: var(--ink); }
.tap i:nth-child(5) { --a: 150deg; }
.tap i:nth-child(6) { --a: 210deg; background: var(--violet); }
.tap.on-dark::before { box-shadow: none; }
.tap.on-dark i:nth-child(4) { background: #fff; }
@keyframes tapRing { from { transform: scale(.25); opacity: 1; } to { transform: scale(1.35); opacity: 0; } }
@keyframes tapSpark { from { transform: rotate(var(--a)) translateX(6px) scale(1); opacity: 1; } to { transform: rotate(var(--a)) translateX(30px) scale(.3); opacity: 0; } }
.chip:active, .item:active, .zone:active, .prod:active, .pcard:active, .acc:active, .task:active, .stage:active,
.tier-opt:active, .pick:active, .seg button:active, .nav a:active, .icon-btn:active, .bal-pill:active, .swatch:active,
.emoji-btn:active, .menu-item:active, .fin .btn:active { transform: scale(.96); transition-duration: .05s; }

/* ---------- Кабинет администратора ---------- */
.stack { display: flex; height: 12px; border-radius: var(--pill); background: #fff; overflow: hidden; }
.stack i { display: block; height: 100%; }
.req { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; padding: 14px 0; border-top: 1px solid var(--hair); }
.req:first-child { border-top: 0; }
.req .grow { min-width: 170px; }

/* ---------- Подсказки и ошибки форм ---------- */
.field-error { color: #B3261E; font-size: 13px; display: flex; align-items: center; gap: 6px; }
.field.invalid .input { border-color: var(--red); background: #fff; }
.field.invalid .picker .pick { box-shadow: inset 0 0 0 1px rgba(229, 72, 77, .35); }
.mgr-banner { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; background: var(--ink); color: #fff; border-radius: var(--r); padding: 18px 22px; }
.mgr-banner .muted { color: rgba(255, 255, 255, .62); }
.mgr-stats { display: flex; gap: 22px; flex-wrap: wrap; }
.mgr-stats b { display: block; font-size: 22px; font-weight: 500; letter-spacing: -0.02em; }
.path-item .bar-label span:first-child { display: inline-flex; align-items: center; gap: 6px; }
.path-item:hover .bar-label span:first-child { text-decoration: underline; text-underline-offset: 3px; }
.pet-hint { position: absolute; bottom: 4px; right: 0; font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }
.walk-status { background: var(--ink); color: #fff; }
.office-svg #of-target .tgt-ring { transform-box: fill-box; transform-origin: center; animation: tgtPulse 1.1s ease-out infinite; }
.office-svg #of-target .tgt-pin { transform-box: fill-box; transform-origin: 50% 100%; animation: tgtDrop .45s cubic-bezier(.3, 1.6, .5, 1) both; }
@keyframes tgtPulse { from { transform: scale(.5); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }
@keyframes tgtDrop { from { transform: translateY(-16px) scale(.8); opacity: 0; } to { transform: none; opacity: 1; } }
.walk-status .z-ic { background: var(--lime); color: var(--ink); }

/* ---------- Пустые состояния ---------- */
.empty { text-align: center; padding: 28px 16px; color: var(--muted); }
.empty .emoji { font-size: 34px; display: block; margin-bottom: 8px; }

/* Дополнения программы используют исходные карточки, палитру и типографику. */
.social-row, .year-banner { display:flex; align-items:center; gap:14px; width:100%; padding:16px; border:0; border-radius:16px; background:#fff; color:var(--ink); text-align:left; font:inherit; cursor:pointer; }
.social-row + .social-row { margin-top:10px; }
.social-row .grow, .year-banner .grow { min-width:0; }
.social-row .grow > span, .year-banner .grow > span { display:block; margin-top:4px; }
.year-banner { padding:22px 26px; background:var(--violet-2); }
.year-badge { background:var(--violet); color:#fff; padding:10px 14px; border-radius:12px; font-weight:600; }
.ava-stack { display:flex; flex:none; padding-right:9px; }
.ava-stack > * + * { margin-left:-9px; }
.card-dark .pending-row .muted { color:var(--muted); }
[data-sec="tasks"] .list-item { flex-wrap:wrap; }
[data-sec="tasks"] .list-item .grow { min-width:180px; }
.input { max-width:100%; }

/* ---------- Адаптив ---------- */
@media (max-width: 1340px) {
  .header .container { gap: 12px; }
  .nav a { padding: 0 8px; font-size: 14px; }
  .bal-pill { padding: 0 10px 0 6px; font-size: 14px; }
}
@media (max-width: 1200px) {
  .bal-pill.ru { display: none; }
}
@media (max-width: 1180px) {
  .hero-grid { grid-template-columns: 1fr; }
  .bonus-hero { grid-template-columns: 1fr 1fr; }
  .bonus-hero > :last-child { grid-column: 1 / -1; }
  .zone-cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .g-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .logo-word { font-size: 20px; }
}
@media (max-width: 980px) {
  .g-main, .g-side, .fitting, .profile-layout { grid-template-columns: 1fr; }
  .g-3 { grid-template-columns: 1fr 1fr; }
  .mirror, .profile-side { position: static; }
  .mirror-frame { height: 440px; }
  .mirror-av { width: 210px; height: 336px; }
  .stages { grid-template-columns: 1fr 1fr; }
  .tiers { grid-template-columns: 1fr; }
}
@media (max-width: 1100px) {
  .nav { display: none; }
  .header .container { justify-content: space-between; }
  .tabbar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; background: rgba(255, 255, 255, .97); border-top: 1px solid var(--hair); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); backdrop-filter: blur(8px); }
  .tabbar a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--muted-2); padding: 4px 0; border-radius: 12px; }
  .tabbar a.on { color: var(--ink); }
  .tabbar a.on .tb-ic { background: var(--lime-2); }
  .tb-ic { width: 44px; height: 28px; border-radius: 14px; display: grid; place-items: center; }
  .view { padding-bottom: 120px; }
  .toast-root { bottom: calc(86px + env(safe-area-inset-bottom)); }
  .topbar { display: none; }
}
@media (max-width: 720px) {
  .container { padding: 0 16px; }
  .h1 { font-size: 32px; }
  .h2 { font-size: 26px; }
  .card { padding: 20px; }
  .g-2, .g-3, .g-4 { grid-template-columns: 1fr; }
  .bonus-hero { grid-template-columns: 1fr; }

  // ---------- лицо ----------
  function eyes(t) {

      switch (kind) {

        case 'sleepy': return `<path d="M${x - 6} 97 Q${x} 102 ${x + 6} 97" stroke="${INK}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
        case 'big': return `<ellipse cx="${x}" cy="98" rx="6" ry="7.2" fill="${INK}"/><circle cx="${x + 2}" cy="95.2" r="2.3" fill="#fff"/><circle cx="${x - 2.2}" cy="100.8" r="1.1" fill="#fff"/>`;

      }

    if (t === 'wink') return E(84, 'round', -1) + E(116, 'happy', 1);
